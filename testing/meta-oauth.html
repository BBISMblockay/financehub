<!doctype html>
<!-- Meta App Review test page. Chrome-less on purpose (no sidebar, no nav
     entry): it exists only to exercise Facebook Login for Business end to end
     in an allow-listed App Review workspace. Signing in is required, and every
     action is authorized by the meta-oauth-review / meta-oauth-start edge
     functions (allow-listed ACTIVE workspace + admin + review-marked
     connection). The page itself writes nothing to the database. -->
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>SILO — Meta connection test</title>
  <link rel="stylesheet" href="../v2/beacon.css" />
  <link rel="stylesheet" href="../v2/silo-brand.css" />
  <style>
    /* --bcn-canvas is not a Beacon token; the page had no background at all. */
    body { background: var(--bcn-bg); margin: 0; }
    /* .bcn-card sets display:flex, which beats the hidden attribute. */
    .bcn-card[hidden] { display: none; }
    .mo-wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 64px; display: flex; flex-direction: column; gap: 16px; }
    .mo-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .mo-choice { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; }
    .mo-choice small { display: block; color: var(--bcn-ink-3); }
    .mo-muted { color: var(--bcn-ink-3); font-size: 13px; }
    .mo-pre { white-space: pre-wrap; word-break: break-word; font-family: var(--bcn-mono); font-size: 12px; margin: 0; }
    table.bcn-table td.mo-wrapcell { white-space: normal; text-align: left; overflow-wrap: anywhere; }

    /* The selected assets, by name, above the results -- what every one of
       Meta's 2026-10-26 rejections asked to see beside the data. Light cards,
       not the near-black band: the name has to be the most readable thing on
       the screen in the screencast, and page ink on --bcn-band is unreadable
       in light theme. */
    .mo-assets-head { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin-bottom: 16px; }
    .mo-asset { background: var(--bcn-surface); border: 1px solid var(--bcn-border);
      border-left: 3px solid var(--bcn-accent); border-radius: var(--bcn-radius); padding: 10px 12px; }
    .mo-asset b { display: block; color: var(--bcn-ink-3); font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .06em; margin-bottom: 2px; }
    .mo-asset-name { display: block; font-size: 16px; font-weight: 700; color: var(--bcn-ink); line-height: 1.3; }
    .mo-asset small { display: block; margin-top: 3px; color: var(--bcn-ink-2); font-size: 12px; overflow-wrap: anywhere; }

    /* One section per permission, not one wide table: a Graph URL is longer
       than any sane column, and squeezing it beside its result made both
       unreadable. The purpose heads the section; each call is a block. */
    .mo-perm { border: 1px solid var(--bcn-border); border-radius: var(--bcn-radius);
      background: var(--bcn-surface); margin-bottom: 14px; overflow: hidden; }
    .mo-perm-head { padding: 10px 14px; background: var(--bcn-sunken); border-bottom: 1px solid var(--bcn-border); }
    .mo-perm-name { font-family: var(--bcn-mono); font-size: 13px; font-weight: 600; color: var(--bcn-ink); }
    .mo-perm-why { margin: 4px 0 0; font-size: 13px; line-height: 1.45; color: var(--bcn-ink-2); }
    .mo-call { padding: 12px 14px; border-top: 1px solid var(--bcn-border); }
    .mo-perm .mo-call:first-of-type { border-top: 0; }
    .mo-call-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .mo-call-endpoint { font-family: var(--bcn-mono); font-size: 12px; color: var(--bcn-ink-2);
      overflow-wrap: anywhere; line-height: 1.5; }
    .mo-call-body { font-size: 13px; }
    .mo-note { margin: 8px 0 0; padding: 8px 10px; font-size: 12px; line-height: 1.5;
      background: var(--bcn-neg-soft); border: 1px solid var(--bcn-neg-border);
      border-radius: var(--bcn-radius-sm); color: var(--bcn-ink-2); }

    .mo-field { display: flex; gap: 8px; padding: 2px 0; font-size: 13px; }
    .mo-field-k { color: var(--bcn-ink-3); min-width: 150px; }
    .mo-field-v { font-family: var(--bcn-mono); overflow-wrap: anywhere; }
    /* A two-column day/value series does not need the full card width; left
       at 100% the value sits a screen away from its date. */
    table.bcn-table.mo-mini { margin: 4px 0 10px; font-size: 12px; max-width: 420px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../pages/config.js"></script>
</head>
<body>
  <div class="mo-wrap">
    <header class="bcn-header">
      <h1>Meta connection test</h1>
      <p class="mo-muted" id="mo-workspace">Checking access…</p>
    </header>
    <div class="bcn-status" id="status" hidden></div>

    <section class="bcn-card" id="mo-connect-card" hidden>
      <div class="bcn-card-header"><h2>1. Connect Meta</h2></div>
      <div class="bcn-card-body">
        <p class="mo-muted">Opens Facebook Login for Business. Choose the business, then the ad account, Page and
          Instagram account to share with SILO. SILO only reads data.</p>
        <div class="mo-actions"><button class="bcn-btn bcn-btn--primary" id="mo-connect">Connect Meta</button></div>
      </div>
    </section>

    <section class="bcn-card" id="mo-conns-card" hidden>
      <div class="bcn-card-header"><h2>2. Test connections in this workspace</h2></div>
      <div class="bcn-card-body">
        <table class="bcn-table">
          <thead><tr><th class="bcn-th-left">Connection</th><th class="bcn-th-left">Assets</th><th class="bcn-th-left">Actions</th></tr></thead>
          <tbody id="mo-conns"></tbody>
        </table>
      </div>
    </section>

    <section class="bcn-card" id="mo-assets-card" hidden>
      <div class="bcn-card-header"><h2>3. Choose assets</h2></div>
      <div class="bcn-card-body">
        <div id="mo-assets"></div>
        <div class="mo-actions"><button class="bcn-btn bcn-btn--primary" id="mo-save-assets">Save selection</button>
          <button class="bcn-btn bcn-btn--ghost" id="mo-cancel-assets">Cancel</button></div>
      </div>
    </section>

    <section class="bcn-card" id="mo-result-card" hidden>
      <div class="bcn-card-header"><h2 id="mo-result-title">Result</h2></div>
      <div class="bcn-card-body" id="mo-result"></div>
    </section>
  </div>
  <script src="meta-oauth-client.js"></script>
  <script src="meta-oauth.js"></script>
</body>
</html>
