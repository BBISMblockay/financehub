# GitHub Pages (Jekyll) build settings for silo-baseballism.com.
#
# Pages serves this branch's root, so without this file EVERYTHING tracked was
# public: import data, server and sync code, migrations, runbooks and the open
# bug list (security audit 2026-10-08 found a vendor's bank details downloadable
# at /data/…). Only the app itself is published: index.html and the other root
# pages, v2/, v3/, pages/, assets/, legal/, oauth/, legacy/ (still-linked iframe
# targets), CNAME.
#
# `legacy/pages` is excluded (security review 2026-11-12). `legacy/` as a whole
# cannot be: legacy/finance.html and legacy/retail.html are the iframe shells
# whose ROUTES point at the live v2 pages, they are still linked, and
# v2/tests/unit/legacy-retirement.test.js exercises those route definitions. But
# the two files UNDER legacy/pages -- payroll.html and login2.html -- are linked
# from nowhere in the repo and were being served from silo-baseballism.com
# anyway (both answered 200, checked 2026-11-12). Neither leaks on its own:
# payroll.html gates on requireAuth() and login2.html is a duplicate login page,
# both read pages/config.js, and neither carries a hardcoded key or a sheet URL.
# They come out because an unmaintained page on the production domain is how
# legacy/pages/mise.html became Critical 2 of the 2026-10-14 audit -- it was
# live and ungated for exactly this reason, that nothing excluded legacy/.
#
# Setting `exclude` replaces Jekyll's default list, so its defaults are restated
# at the end. A new top-level folder is PUBLIC unless it is added here.
#
# `testing` stays excluded, and the `include` allowlist at the end publishes the
# three Meta App Review assets out of it by name. Anything else added to
# testing/ stays unpublished, which is why this is an allowlist and not a
# narrower exclude.
exclude:
  - data
  - server
  - scripts
  - supabase
  - docs
  - tests
  - testing
  - config
  - legacy/pages
  - config.json
  - package.json
  - package-lock.json
  - deno.lock
  - CLAUDE.md
  # Jekyll's own defaults
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Allowlist, read only for entries Jekyll would otherwise drop. Two things about
# how Jekyll matches it (jekyll/entry_filter.rb) decide the shape below:
#   * a directory in `exclude` is never descended into, so `testing` has to be
#     listed here too or its files are never even looked at;
#   * inside a directory, entries are matched against this list by BASENAME, so
#     the files are listed by basename, not as `testing/meta-oauth.html`.
# A basename here publishes a file of that name in any directory Jekyll reaches,
# so keep these names specific. Adding a file to testing/ does NOT publish it;
# publishing another review asset means adding its basename here on purpose.
# Jekyll's own default include is `.htaccess`, which this repo does not have.
# scripts/tests/pages-publish-allowlist.test.mjs builds the site and proves all
# of this, including that the excluded directories stay out.
include:
  - testing                 # the directory itself, so the three files below are reachable
  - meta-oauth.html         # testing/meta-oauth.html - the Meta App Review reviewer page
  - meta-oauth.js           # testing/meta-oauth.js - its page logic
  - meta-oauth-client.js    # testing/meta-oauth-client.js - its request plumbing
