name: On Deck preparation
on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: on-deck-preparation
  cancel-in-progress: false
jobs:
  prepare:
    if: vars.ON_DECK_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-package-lock
      - run: node scripts/on-deck-prepare.mjs
        env:
          ON_DECK_ENABLED: 'true'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
