name: Legacy Payment Requests Import

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (no database writes)"
        required: true
        default: true
        type: boolean
      file_path:
        description: "Path under data/imports/ on the selected branch (raw sheet format or AP Workbench Export CSV — auto-detected). Never commit an import file to main; see data/imports/README.md"
        required: true
        type: string
      unpaid_only:
        description: "Only import unpaid rows (New + Hold queues)"
        required: true
        default: true
        type: boolean
      company_entity_id:
        description: "Company UUID (blank = Baseballism)"
        required: false
        default: ""
        type: string

jobs:
  import-legacy-payment-requests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Supabase envs exist
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL repo secret" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY repo secret" && exit 1)
          echo "Supabase env vars present"

      # Inputs reach the shell through env, never ${{ }} inside run:, and are
      # validated: a dispatcher-typed value must not become shell syntax in a
      # step that holds the service-role key (security audit 2026-10-08).
      - name: Verify import file and inputs
        env:
          FILE: ${{ inputs.file_path }}
          COMPANY: ${{ inputs.company_entity_id }}
        run: |
          [[ "$FILE" =~ ^data/imports/[A-Za-z0-9._-]+\.(csv|tsv)$ ]] || { echo "::error::file_path must be data/imports/<name>.csv or .tsv"; exit 1; }
          [[ -z "$COMPANY" || "$COMPANY" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] || { echo "::error::company_entity_id must be a UUID"; exit 1; }
          test -f "$FILE" || { echo "File not found on this branch: $FILE"; exit 1; }
          echo "Import file: $FILE"

      - name: Install dependencies
        run: npm install

      - name: Run legacy payment requests import
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FILE: ${{ inputs.file_path }}
          COMPANY: ${{ inputs.company_entity_id }}
          DRY_RUN: ${{ inputs.dry_run }}
          UNPAID_ONLY: ${{ inputs.unpaid_only }}
        run: |
          echo "dry_run=$DRY_RUN file_path=$FILE unpaid_only=$UNPAID_ONLY"
          ARGS=(--file "$FILE")
          if [ "$UNPAID_ONLY" = "true" ]; then
            ARGS+=(--unpaid-only)
          fi
          if [ -n "$COMPANY" ]; then
            ARGS+=(--company "$COMPANY")
          fi
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          node scripts/import-payment-requests-legacy.mjs "${ARGS[@]}"
