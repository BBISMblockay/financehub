name: Ask SILO tests

# Guards the silo-chat edge function: its prompt assembly, and its request
# handler.
#
# Why this exists as CI rather than a script someone remembers to run: the
# failure it catches is SILENT. The rule "ABSENCE OF HISTORY IS NOT EVIDENCE
# AGAINST" was correct, committed, and unreachable for months because it sat
# in PRODUCT_CONCEPT_SYSTEM_BLOCK, which is appended only for concept-mode
# testers -- so ordinary questions never saw it. A rule in the wrong prompt
# block does not error, does not warn, and reads perfectly in review. Only an
# assertion about WHICH block it lands in catches that.
#
# Scope note, so nobody reads more into a green check than it earns: these
# tests prove the instructions reach the prompt an ordinary question is built
# from. They do NOT prove the model obeys them. That question needs eval runs
# against the deployed function, which is a different (and much slower) kind
# of test than this file.
#
# Two jobs' worth of assertions, in one job. prompt.test.mjs asserts on the
# prompt's string content (right for a prompt, useless for a handler);
# handler.test.mjs executes the actual request handler against a mocked model
# and database, which is the only way to assert things like "the answer
# returned is the whole answer".
#
# Needs NO secrets and no install -- both read index.ts off the checkout, so
# they are safe to run on pull requests.

on:
  push:
    branches: [main]
    paths: &prompt_paths
      - 'supabase/functions/silo-chat/**'
      - '.github/workflows/silo-chat-tests.yml'
  pull_request:
    paths: *prompt_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: silo-chat-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prompt:
    name: Prompt assembly + request handler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Bare checkout on purpose, same stance as the v3 unit job: if this
      # ever needs an install step, that is a regression worth failing over.
      - name: Run prompt assertions
        run: node supabase/functions/silo-chat/prompt.test.mjs

      # Runs the real Deno.serve handler out of index.ts with the model API
      # and the database mocked. The prompt job above asserts on SOURCE TEXT,
      # which is right for a prompt and cannot reach a handler: the 2026-09-16
      # audit found five reliability defects here and the string-matching
      # suites passed on every one of them. Node strips the TypeScript
      # annotations, so this still needs no install and no secrets.
      - name: Run request-handler assertions
        run: node supabase/functions/silo-chat/handler.test.mjs

      # Pure functions: what a statement's evidence scope is derived to be,
      # from the two traced 2026-09-16 failures' real SQL. No model, no
      # database, no network.
      - name: Run evidence-scope assertions
        run: node supabase/functions/silo-chat/evidence-scope.test.mjs

      # The model EVALUATION is deliberately NOT run here -- it makes paid
      # Anthropic calls and its results are not deterministic, so it would be a
      # red check for reasons unrelated to the change under review (see
      # supabase/functions/silo-chat/evals/README.md). What runs is its dry
      # run: it builds every prompt and transcript and sends nothing. That is
      # what catches the failure this step exists for -- the eval scrapes
      # prompt constants and the budget-exhausted instruction out of index.ts,
      # and a rename there would otherwise surface as a crash partway through
      # a paid run that somebody had already started.
      - name: Check the model evaluation still assembles (no API calls)
        run: node supabase/functions/silo-chat/evals/evidence-scope.eval.mjs --dry-run
