name: AR Google Sheets Sync

# LEGACY, and no longer scheduled (2026-10-13, Blake's call).
#
# BBISM receivables moved to Shopify: `shopify_orders` carries the wholesale
# book's payment terms and paid dates (342 orders with terms, 187 unpaid as of
# 2026-10-13), and the reports read it through `shopify_orders_v`. The
# published Google Sheets behind this sync stopped being updated on
# 2026-09-14, so its own staleness guard -- which fails the run when the
# newest order in the sheet is more than AR_STALE_MAX_DAYS old -- failed every
# day while the sync itself loaded its rows perfectly. The guard was right;
# the source is retired.
#
# The cron is removed rather than the workflow: `ar_invoices` / `ar_customers`
# still hold the historical wholesale book, `/pages/baseballismwholesale.html`
# still reads them, and a dispatch is how you refresh them if the sheet is
# ever updated again. Deleting this would also delete the only way back.
on:
  workflow_dispatch:

jobs:
  sync-ar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run AR sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Fail the run when the newest order in the source sheet is older
          # than this many days (data still syncs; the failure is the alarm).
          # Override with a repo variable if wholesale goes quiet seasonally.
          AR_STALE_MAX_DAYS: ${{ vars.AR_STALE_MAX_DAYS || 7 }}
        run: npm run sync:ar
