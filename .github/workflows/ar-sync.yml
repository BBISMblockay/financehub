name: AR Google Sheets Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "15 9 * * *"

jobs:
  sync-ar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run AR sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Fail the run when the newest order in the source sheet is older
          # than this many days (data still syncs; the failure is the alarm).
          # Override with a repo variable if wholesale goes quiet seasonally.
          AR_STALE_MAX_DAYS: ${{ vars.AR_STALE_MAX_DAYS || 7 }}
        run: npm run sync:ar
