name: Deploy Edge Function

# Why this exists.
#
# Edge functions are deployed with the Supabase CLI. There is no way to
# deploy one from the Supabase dashboard's GitHub integration -- that
# integration covers database branching and migrations, not functions.
# Deploying by hand through an API client means transmitting the whole
# function inline, and silo-chat/index.ts is ~113KB; on 2026-08-25 exactly
# that produced two truncated deploys and took Ask SILO down until a
# reduced build could be shipped.
#
# This workflow removes the failure mode: the CLI reads the file straight
# off the repo, so what runs in production is byte-for-byte what is on the
# branch, and nothing has to be copied by a human or an agent.
#
# Run it from the Actions tab: "Deploy Edge Function" -> "Run workflow",
# pick a function (or "all"), and confirm the branch. Nothing deploys on
# push -- edge functions are deliberately manual here, matching the note in
# CLAUDE.md that merging a PR does NOT deploy a function.

on:
  workflow_dispatch:
    inputs:
      function_name:
        description: Function slug to deploy, or "all" for every function in supabase/functions
        required: true
        default: silo-chat
      project_ref:
        description: Supabase project ref (defaults to the Silo production project)
        required: false
        default: mkquclffrvlzyecnabyf

# Inputs reach the shell only through env and are validated first: a typed
# value must never become shell syntax in a step holding SUPABASE_ACCESS_TOKEN.
# And production deploys come from main only (CLAUDE.md), enforced here rather
# than left to whoever picks the branch in the Run dialog (security audit
# 2026-10-08).
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FN: ${{ inputs.function_name }}
      PROJECT_REF: ${{ inputs.project_ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate inputs
        run: |
          set -euo pipefail
          [[ "$FN" == all || "$FN" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]] || { echo "::error::function_name must be a function slug or 'all'"; exit 1; }
          [[ "$PROJECT_REF" =~ ^[a-z]{20}$ ]] || { echo "::error::project_ref must be a 20-letter Supabase project ref"; exit 1; }

      - name: Show what will be deployed
        run: |
          set -euo pipefail
          echo "Project ref : $PROJECT_REF"
          echo "Function    : $FN"
          echo "Commit      : $(git rev-parse HEAD)"
          if [ "$FN" = "all" ]; then
            ls -1 supabase/functions
          else
            f="supabase/functions/$FN/index.ts"
            test -f "$f" || { echo "::error::$f not found"; exit 1; }
            echo "Bytes       : $(wc -c < "$f")"
            echo "SHA256      : $(sha256sum "$f" | cut -d' ' -f1)"
          fi

      # verify_jwt is NOT passed here on purpose. Every function keeps the
      # setting it already has in the project; passing --no-verify-jwt would
      # silently strip authentication from a function that requires it.
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set. Create a token at https://supabase.com/dashboard/account/tokens and add it under the repository's Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          # Functions whose caller has no Supabase JWT to present, so they must
          # be deployed with --no-verify-jwt on EVERY path, "all" included:
          #   shopify-compliance-webhook -- Shopify signs with X-Shopify-Hmac-Sha256,
          #     checked against SILO's app secrets; that is its only auth.
          #   plaid-scheduled-sync, card-coding-prepare-scheduled -- validate a
          #     GitHub RS256 identity (OIDC, pinned to their workflows on main)
          #     before any DB access.
          #   onboarding-interest -- public contact intake; bounded validation
          #     and atomic service-only quotas, no account or invite creation.
          #   tiktok-oauth-callback -- TikTok redirects the browser here with no
          #     JWT; the single-use state nonce is its auth (live: verify_jwt=false).
          #   shopify-app-install -- Shopify opens it (App URL + OAuth callback);
          #     Shopify's HMAC signature is checked before anything is written.
          #   meta-oauth-callback -- Meta redirects the browser here; the state row
          #     a signed-in admin created is the authorization.
          NO_JWT_FUNCTIONS="shopify-compliance-webhook plaid-scheduled-sync card-coding-prepare-scheduled onboarding-interest tiktok-oauth-callback shopify-app-install meta-oauth-callback"
          if [ "$FN" = "all" ]; then
            supabase functions deploy --project-ref "$PROJECT_REF"
            # A plain deploy applies the default verify_jwt, which would leave
            # these rejecting their callers before the handler runs. Redeploy
            # each one public, from the same checkout.
            for fn in $NO_JWT_FUNCTIONS; do
              supabase functions deploy "$fn" --no-verify-jwt --project-ref "$PROJECT_REF"
            done
          elif [[ " $NO_JWT_FUNCTIONS " == *" $FN "* ]]; then
            supabase functions deploy "$FN" --no-verify-jwt --project-ref "$PROJECT_REF"
          else
            supabase functions deploy "$FN" --project-ref "$PROJECT_REF"
          fi

      - name: Confirm deployed version
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase functions list --project-ref "$PROJECT_REF" || true
