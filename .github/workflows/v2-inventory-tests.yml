name: v2 page tests

# Tests for /v2/ page logic extracted into testable modules:
#   inventory-signals.js     what the inventory page claims about stock
#   daily-trend-kpis.js      what the daily trend page's headline cards claim
#   transaction-filters.js   which transactions a filter position selects
#   onboarding-callbacks     that setup-checklist distinguishes "could not
#                            check" from "not done", and that login's emailed
#                            callbacks carry the destination through
#
# Plus two browser suites over the Accounting Suite: transactions-filters
# drives the real register (merchant blanks, split-account matching, chips and
# counts, rules paging, the suite nav), and accounting-dialogs opens every
# <dialog> on every suite page in both themes. Both read CSS, which is why
# `v2/*.css` is a trigger path -- a stylesheet-only change is exactly what the
# dialog suite exists to catch, and it would otherwise run nothing.
#
# Why this exists: v2/inventory-signals.js decides what the inventory page
# CLAIMS about stock -- whether a days-cover figure exists at all, whether a
# row is out of stock or merely unmeasured, whether a filter should match. All
# three bugs this suite was written for were of the same kind: a missing value
# being read as zero and then presented with confidence. That class of bug is
# invisible to a human reading the screen, which is exactly why it needs a
# machine checking it on every change.
#
# It needs NO secrets. Nothing here talks to a real database: the fixtures are
# rows captured from inventory_workboard_v and checked in, and Supabase is
# stubbed in-memory. That is what makes it safe to run on pull requests.

on:
  push:
    branches: [main]
    paths:
      - 'v2/*.html'
      - 'v2/*.js'
      - 'v2/*.css'
      - 'v2/tests/**'
      - 'supabase/functions/payment-request-extract/**'
      # onboarding-callbacks.test.js reads pages/login.html: it guards that the
      # emailed auth callbacks keep carrying `next` (a company-creation invite
      # lives inside it). Without this path a login-only change runs nothing,
      # and the suite guarding it would be silent exactly when it mattered.
      - 'pages/login.html'
      - '.github/workflows/v2-inventory-tests.yml'
  pull_request:
    paths:
      - 'v2/*.html'
      - 'v2/*.js'
      - 'v2/*.css'
      - 'v2/tests/**'
      - 'supabase/functions/payment-request-extract/**'
      # onboarding-callbacks.test.js reads pages/login.html: it guards that the
      # emailed auth callbacks keep carrying `next` (a company-creation invite
      # lives inside it). Without this path a login-only change runs nothing,
      # and the suite guarding it would be silent exactly when it mattered.
      - 'pages/login.html'
      - '.github/workflows/v2-inventory-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Supersede an in-flight run for the same branch: only the latest commit's
  # result matters, and a queued duplicate just delays the answer.
  group: v2-page-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No install step on purpose. The unit suites must run on a bare
      # checkout; if that ever stops being true, this job fails and says so.
      - name: Run unit suites
        run: node v2/tests/run.js --unit
      - name: Payment request document boundary
        run: node --test supabase/functions/payment-request-extract/handler.test.mjs

  payment-draft-storage:
    name: Payment draft storage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated IndexedDB test implementation
        run: npm ci --prefix v2/tests/draft-storage --ignore-scripts --no-audit --no-fund
      - name: Check completed-request content cleanup and retry retention
        run: node v2/tests/draft-storage/storage.test.mjs

  payment-extract-typecheck:
    name: Payment extraction Edge imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deployed entry point
        run: npx --yes deno@2.9.6 check --no-config --node-modules-dir=none supabase/functions/payment-request-extract/index.ts

  browser:
    name: Browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/tests/package.json

      - name: Install test dependencies
        working-directory: v2/tests
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: v2/tests
        run: npx playwright install --with-deps chromium

      # harness.js finds Chromium itself: no PLAYWRIGHT_CHROMIUM_PATH set and
      # no sandbox symlink on a runner, so it falls through to Playwright's
      # own resolution, which is what `playwright install` just set up.
      - name: Run browser suites
        run: node v2/tests/run.js --browser
