name: Shopify attribution snapshots
on:
  workflow_dispatch:
    inputs:
      connection_id:
        description: One Shopify connection UUID
        required: true
      start_date:
        description: Required for snapshots; blank for one-order probe. Inclusive YYYY-MM-DD
        required: false
      end_date:
        description: Required for snapshots; blank for one-order probe. Inclusive YYYY-MM-DD
        required: false
      probe_order_id:
        description: Optional numeric Shopify order ID. Read-only probe; blank dates and commit=false required
        required: false
      probe_plan_day:
        description: Optional YYYY-MM-DD. Read-only speed probe (deep sales paging, journey batch cost, landing batch); blank dates and commit=false required
        required: false
      commit:
        description: Publish verified snapshots (false is read-only)
        type: boolean
        default: false
  schedule:
    - cron: '25 12 * * *'
permissions:
  contents: read
concurrency:
  group: shopify-attribution
  cancel-in-progress: false
jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || (vars.ATTRIBUTION_SYNC_ENABLED == 'true' && vars.ATTRIBUTION_COVERAGE_ENABLED != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ATTRIBUTION_PUBLISH_CHUNK: ${{ vars.ATTRIBUTION_PUBLISH_CHUNK }}
      ATTRIBUTION_PUBLISH_THRESHOLD: ${{ vars.ATTRIBUTION_PUBLISH_THRESHOLD }}
      ATTRIBUTION_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}
      ATTRIBUTION_SYNC_ENABLED: ${{ vars.ATTRIBUTION_SYNC_ENABLED }}
      ATTRIBUTION_CONNECTION_ID: ${{ inputs.connection_id || vars.ATTRIBUTION_CONNECTION_ID }}
      ATTRIBUTION_START: ${{ inputs.start_date }}
      ATTRIBUTION_END: ${{ inputs.end_date }}
      ATTRIBUTION_COMMIT: ${{ inputs.commit }}
      ATTRIBUTION_PROBE_ORDER_ID: ${{ inputs.probe_order_id }}
      ATTRIBUTION_PROBE_PLAN_DAY: ${{ inputs.probe_plan_day }}
      ATTRIBUTION_JOURNEY_BATCH: ${{ vars.ATTRIBUTION_JOURNEY_BATCH }}
      ATTRIBUTION_JOURNEY_MOMENTS: ${{ vars.ATTRIBUTION_JOURNEY_MOMENTS }}
      ATTRIBUTION_LANDING_BATCH: ${{ vars.ATTRIBUTION_LANDING_BATCH }}
      ATTRIBUTION_MAX_DAY_ROWS: ${{ vars.ATTRIBUTION_MAX_DAY_ROWS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate snapshot dates before credential access
        run: |
          node --input-type=module <<'NODE'
          import {dayRange} from './scripts/lib/shopify-attribution-evidence.mjs';
          const env=process.env;
          if (!env.ATTRIBUTION_PROBE_ORDER_ID && !env.ATTRIBUTION_PROBE_PLAN_DAY && env.ATTRIBUTION_MODE !== 'scheduled') {
            dayRange(env.ATTRIBUTION_START,env.ATTRIBUTION_END);
          }
          NODE
      - run: npm ci
      - name: Probe one order without writes or token refresh
        if: inputs.probe_order_id != ''
        timeout-minutes: 10
        run: node scripts/shopify-attribution-probe.mjs
      - name: Measure collection limits without writes or token refresh
        if: inputs.probe_plan_day != ''
        timeout-minutes: 20
        run: node scripts/shopify-attribution-plan-probe.mjs
      - name: Collect snapshots
        if: inputs.probe_order_id == '' && inputs.probe_plan_day == ''
        run: node scripts/shopify-attribution-sync.mjs
