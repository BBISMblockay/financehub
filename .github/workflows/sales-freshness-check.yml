name: Data freshness check

# Independent alarm AND self-heal for "a nightly sync did not run" -- covers
# both sales (sales_by_day / shopify-sync) and marketing (marketing_kpis_daily
# / ad-platforms-sync). On 2026-08-27 GitHub dropped BOTH nightlies on the same
# morning, so checking only one would have caught half the damage.
#
# Why this is a SEPARATE workflow: a check bolted onto the end of a sync cannot
# detect a dropped sync, because a dropped sync never reaches the check.
#
# Why it RE-SYNCS rather than just alerting: an alarm only moves the
# firefighting earlier. The point is that nobody has to run a fix on the
# morning of the meeting. If a feed is stale, this runs that feed's sync
# inline, then re-checks and only then fails if it is still behind.
#
# Why inline rather than dispatching the other workflow: GitHub deliberately
# blocks workflows triggered by the built-in GITHUB_TOKEN from starting new
# workflow runs, to prevent recursion. Dispatching would need a PAT -- a new
# long-lived credential to store and rotate. Running the same script in this
# job needs nothing beyond the Supabase secrets this workflow already has.
#
# Times are offset from the sync crons (08:30/14:30 and 10:30/16:30 UTC) so
# each check lands after a run has had time to finish.
#   11:00 UTC = 4am PT -- the important one. If it heals, data is fresh by
#               ~12:15 UTC (5:15am PT), before anyone opens a report.
#   17:00 UTC = 10am PT, after the catch-up crons
#   23:00 UTC = 4pm PT, a last look before the US day ends

on:
  workflow_dispatch:
    inputs:
      max_lag_days:
        description: Max acceptable lag in days behind the last complete Pacific day (default 1)
        required: false
      heal:
        description: Set false to report only, without re-syncing a stale feed
        required: false
        default: 'true'
  schedule:
    - cron: "0 11 * * *"
    # 14:00 UTC = 7am PT, deliberately the LAST look before the morning
    # check-in. The 11:00 pass can itself arrive late (GitHub has been
    # delivering crons hours behind since 2026-08-27), so this is a second
    # chance to catch and heal a partial yesterday while there is still an
    # hour of slack before anyone opens a report at 8.
    - cron: "0 14 * * *"
    - cron: "0 17 * * *"
    - cron: "0 23 * * *"

jobs:
  check:
    runs-on: ubuntu-latest
    # Long enough for the heal path: a full Shopify sync is ~75min.
    timeout-minutes: 150

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MAX_LAG_DAYS: ${{ github.event.inputs.max_lag_days || '1' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      # First pass DECIDES. It must not fail the job here, or the heal below
      # never gets to run.
      - name: Check data freshness
        id: check
        env:
          FAIL_ON_STALE: 'false'
        run: node scripts/check-sales-freshness.mjs

      # continue-on-error on both heal steps, deliberately. A heal that throws
      # is NOT this job's verdict -- the verify pass below is, because the
      # question this workflow answers is "is the data fresh", not "did the
      # re-sync process exit 0". Before 2026-10-13 a heal that exited 1 turned
      # the job red even when the data came back fresh, and the marketing heal
      # exited 1 on EVERY run (see the env note below), so the job was red
      # continuously from 2026-10-05 to 2026-10-13 -- about 30 scheduled runs.
      # A check that is always red reports nothing. The heal's own outcome is
      # still surfaced, by name, in the summary step at the end.
      - name: Re-sync sales (stale)
        id: heal_sales
        continue-on-error: true
        if: ${{ steps.check.outputs.sales_stale == 'true' && github.event.inputs.heal != 'false' }}
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          SHOPIFY_SYNC_MODE: incremental
          # Sales and inventory only. The heal exists to close a freshness gap,
          # not to redo catalog paging and the per-day ShopifyQL loops.
          SHOPIFY_SKIP_CATALOG: 'true'
          SHOPIFY_SKIP_SESSIONS: 'true'
          SHOPIFY_SKIP_LANDING_PAGES: 'true'
          SHOPIFY_SKIP_DISCOUNT_CODES: 'true'
          SHOPIFY_DAYS_BACK: '3'
        run: node scripts/shopify-sync.mjs

      - name: Re-sync marketing (stale)
        id: heal_marketing
        continue-on-error: true
        if: ${{ steps.check.outputs.marketing_stale == 'true' && github.event.inputs.heal != 'false' }}
        # The three Google secrets are REQUIRED here, exactly as in
        # ad-platforms-sync.yml. Without them scripts/ad-platforms-sync.mjs
        # cannot redeem a per-connection refresh token, so every google_ads,
        # ga4 and search_console connection comes back
        # {"skipped": "google_env_missing"} and the script exits 1. This step
        # had no env block at all, which made the marketing heal structurally
        # unable to repair a Google feed -- the only kind of marketing feed
        # there is. Measured on run 38341584392 (2026-10-13 03:29 UTC): three
        # google_env_missing skips, exit 1, while the verify pass correctly
        # reported company e6184b57 seven days behind. Meta and TikTok
        # credentials live on the connection rows, so these three are the
        # whole set the script reads beyond the Supabase pair.
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
        run: node scripts/ad-platforms-sync.mjs

      # Second pass VERIFIES. If the heal worked this is a no-op; if it did
      # not, this is the alarm, and the log above shows what the re-sync
      # actually did. It does not fail the job directly -- the summary step
      # below owns the exit code, so that it can say WHICH of the three
      # outcomes happened before the job goes red.
      - name: Verify freshness after heal
        id: verify
        continue-on-error: true
        if: ${{ always() && steps.check.outcome == 'success' }}
        run: node scripts/check-sales-freshness.mjs

      # The verdict, and the one place that distinguishes "stale and healed"
      # from "stale and could not heal". Both are worth knowing and only one
      # of them is worth waking somebody for: if the data is fresh by the end
      # of this job then nothing is owed, even if the re-sync was noisy on the
      # way there -- but a heal that errored is named explicitly so a broken
      # heal path cannot hide behind a feed that recovered on its own.
      - name: Freshness verdict
        if: ${{ always() }}
        env:
          CHECK: ${{ steps.check.outcome }}
          SALES_STALE: ${{ steps.check.outputs.sales_stale }}
          MARKETING_STALE: ${{ steps.check.outputs.marketing_stale }}
          HEAL_SALES: ${{ steps.heal_sales.outcome }}
          HEAL_MARKETING: ${{ steps.heal_marketing.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          HEAL_REQUESTED: ${{ github.event.inputs.heal != 'false' }}
        run: |
          # GITHUB_STEP_SUMMARY is always set by Actions; the default keeps this
          # block runnable outside it, since this step owns the job's exit code
          # and must not fail for a reason of its own.
          : "${GITHUB_STEP_SUMMARY:=/dev/null}"
          say() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }

          say "### Data freshness"
          say ""

          if [ "$CHECK" != "success" ]; then
            say "The freshness check itself did not complete (\`$CHECK\`) — no feed was assessed."
            say "This is the check being broken, not a verdict about the data."
            exit 1
          fi

          feed () {
            local label="$1" stale="$2" heal="$3"
            if [ "$stale" != "true" ]; then
              say "- **$label**: fresh, no re-sync needed"
            elif [ "$HEAL_REQUESTED" != "true" ]; then
              say "- **$label**: STALE, heal disabled for this run (reporting only)"
            elif [ "$heal" = "success" ]; then
              say "- **$label**: was stale, re-sync ran and completed"
            elif [ "$heal" = "failure" ]; then
              say "- **$label**: was stale, and the re-sync ITSELF FAILED — see its step log"
            else
              say "- **$label**: was stale, re-sync did not run (\`$heal\`)"
            fi
          }
          feed sales "$SALES_STALE" "$HEAL_SALES"
          feed marketing "$MARKETING_STALE" "$HEAL_MARKETING"
          say ""

          if [ "$VERIFY" = "failure" ]; then
            if [ "$HEAL_REQUESTED" != "true" ]; then
              say "**Verdict: STALE, and healing was disabled for this run.** The verify step names the feed."
            else
              say "**Verdict: STALE after the heal.** A feed is still behind — the verify step names which."
            fi
            exit 1
          fi

          if [ "$HEAL_SALES" = "failure" ] || [ "$HEAL_MARKETING" = "failure" ]; then
            say "**Verdict: fresh, but a re-sync failed on the way.** The data is within the allowed lag,"
            say "so nothing is owed on the numbers — but the heal path above is broken and will not"
            say "rescue the next dropped sync. Fix it before relying on it."
            exit 0
          fi

          say "**Verdict: fresh.**"
