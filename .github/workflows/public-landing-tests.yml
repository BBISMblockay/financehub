name: Public landing tests

on:
  push:
    branches: [main]
    paths: &landing_paths
      - 'index.html'
      - 'v2/company-onboarding.html'
      - 'pages/login.html'
      - 'assets/landing/**'
      - 'tests/public-landing.test.mjs'
      - '.github/workflows/public-landing-tests.yml'
  pull_request:
    paths: *landing_paths

permissions:
  contents: read

jobs:
  public-landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check public entry links, assets, and auth-router regressions
        run: node --test tests/public-landing.test.mjs
