name: Public landing tests

on:
  push:
    branches: [main]
    paths: &landing_paths
      - 'index.html'
      - 'demo.html'
      - 'v2/company-onboarding.html'
      - 'v2/platform-admin.html'
      - 'pages/config.js'
      - 'supabase/functions/onboarding-interest/**'
      - 'supabase/functions/onboarding-interest-invite/**'
      - 'supabase/migrations/*_onboarding_interest_auto_invite.sql'
      - 'pages/login.html'
      # login.html loads it; the fixture server allowlists it.
      - 'pages/mfa.js'
      - 'legal/privacy.html'
      - 'supabase/migrations/*_onboarding_interest_queue.sql'
      - 'supabase/verify_v2_schema.sql'
      - 'scripts/tests/onboarding-interest-*.test.mjs'
      - 'scripts/tests/finance-db/package*.json'
      - 'assets/landing/**'
      - 'tests/**'
      - '.github/workflows/public-landing-tests.yml'
  pull_request:
    paths: *landing_paths

permissions:
  contents: read

jobs:
  public-landing:
    # Pinned: ubuntu-latest is 26.04, which the pinned Playwright (1.58.2)
    # cannot install Chromium on, so the browser step never ran.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check existing home, standalone demo form, admin queue, and auth routing
        run: node --test tests/public-landing.test.mjs tests/landing-motion.test.mjs tests/early-access-ui.test.mjs tests/platform-interest.test.mjs
      - name: Check real public endpoint validation and CORS
        run: node scripts/tests/onboarding-interest-handler.test.mjs
      - name: Install pinned isolated PostgreSQL test dependency
        run: npm ci --prefix scripts/tests/finance-db
      - name: Check interest queue permissions, persistence, deduplication, and rate limits
        run: node scripts/tests/onboarding-interest-database.test.mjs
      - name: Check auto-invite handler, trigger and daily-cap database functions
        run: |
          node scripts/tests/onboarding-interest-invite-handler.test.mjs
          node scripts/tests/onboarding-interest-auto-invite-database.test.mjs
      - name: Install pinned browser test dependency
        working-directory: tests
        run: npm ci
      - name: Install Chromium for browser tests
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Verify existing home, standalone demo, interest submissions, and admin queue
        working-directory: tests
        run: npm run test:browser
      - name: Upload local-fixture screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-landing-screenshots
          path: tests/screenshots/
          if-no-files-found: warn
