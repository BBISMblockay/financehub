name: Redo Marketing Sync

# Redo campaign + automation reporting (email and SMS) into
# redo_marketing_messages / redo_marketing_daily. See
# scripts/redo-marketing-sync.mjs and scripts/lib/redo-marketing-sync-core.mjs.
#
# Nightly: every active redo_connections row, a trailing 60 days ending
# yesterday (business timezone), overwritten. Redo keeps attributing orders to
# a message for weeks, so recent days move and must be re-pulled.
#
# Backfill: dispatch with start_date (and optionally end_date). The window is
# cut into <=400-day chunks (Redo's per-request limit), newest first.
#
# Uses the token already on redo_connections.api_secret -- no repo secret
# beyond Supabase. A token without the marketing scopes is recorded in
# sync_jobs as `skipped` and does not fail the run.
on:
  workflow_dispatch:
    inputs:
      company_entity_id:
        description: Optional company UUID (default every active Redo connection)
        required: false
      days_back:
        description: Trailing days ending yesterday (default 60). Ignored when start_date is set
        required: false
      start_date:
        description: Backfill start YYYY-MM-DD (e.g. 2025-01-01)
        required: false
      end_date:
        description: Backfill end YYYY-MM-DD (default yesterday)
        required: false
  schedule:
    # 10:45 UTC, after the ad platforms sync (10:30). Pacific yesterday is
    # complete by then.
    - cron: "45 10 * * *"
    # 16:45 UTC catch-up: GitHub drops scheduled runs silently (see
    # ad-platforms-sync.yml). The sync is an idempotent overwrite of a
    # trailing window, so a second run after a successful first is cheap.
    - cron: "45 16 * * *"

jobs:
  redo-marketing-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Sync Redo marketing reporting
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REDO_MARKETING_COMPANY_ID: ${{ github.event.inputs.company_entity_id || '' }}
          REDO_MARKETING_DAYS_BACK: ${{ github.event.inputs.days_back || '60' }}
          REDO_MARKETING_START: ${{ github.event.inputs.start_date || '' }}
          REDO_MARKETING_END: ${{ github.event.inputs.end_date || '' }}
        run: node scripts/redo-marketing-sync.mjs
