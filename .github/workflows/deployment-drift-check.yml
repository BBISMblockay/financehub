name: Deployment drift check

# Is PRODUCTION in the state the repo claims? Two checks, both read-only,
# both independently scheduled, both reporting by FAILING (a red run emails
# the repo owner; no extra credential, no webhook to rot). Same stance as
# sales-freshness-check.yml, and for the same reason: the push-triggered test
# suites prove the code does what the code says, and none of them can see
# that a merged migration was never applied or a merged function was never
# deployed.
#
#   schema     runs supabase/verify_v2_schema.sql against production through
#              the Management API, one statement at a time, and fails on any
#              MISSING / CRITICAL / STALE row. On 2026-09-10 check 6 had been
#              reporting MISSING for a day (12 tables without their company
#              stamp trigger) and nobody knew, because the script is run by
#              hand.
#
#   functions  downloads every deployed edge function's source with the
#              Supabase CLI and lets git say whether it matches main. silo-chat
#              ran a version behind main twice in two weeks. Also flags a
#              function deployed with no source in the repo (four are known
#              and only warn) and a function on main that is not deployed.
#
# Triggers: daily at 12:00 UTC (after the 11:00 freshness pass), on any push
# to main touching supabase/, and by hand. The push trigger is deliberate: a
# merged migration or function change that has NOT yet been applied/deployed
# is exactly the drift this reports, so the run after that merge SHOULD be
# red until someone applies it. That red is the reminder.
#
# Secrets: SUPABASE_ACCESS_TOKEN -- the same Management API token the Deploy
# Edge Function workflow uses. Nothing here writes: the schema job refuses to
# send any statement that is not SELECT/WITH, and the functions job only
# downloads.

on:
  schedule:
    - cron: "0 12 * * *"
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/verify-schema-remote.mjs'
      - 'scripts/check-function-drift.mjs'
      - 'scripts/lib/sql-statements.mjs'
      - '.github/workflows/deployment-drift-check.yml'
  workflow_dispatch:
    inputs:
      project_ref:
        description: Supabase project ref (defaults to the Silo production project)
        required: false
        default: mkquclffrvlzyecnabyf

permissions:
  contents: read

concurrency:
  group: deployment-drift-${{ github.ref }}
  cancel-in-progress: false

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_REF: ${{ github.event.inputs.project_ref || 'mkquclffrvlzyecnabyf' }}

jobs:
  schema:
    name: Schema matches repo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Bare checkout: the runner uses only node:fs and fetch.
      - name: Run verify_v2_schema.sql against production
        run: node scripts/verify-schema-remote.mjs

  functions:
    name: Deployed functions match repo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # --use-api unbundles server-side, so no Docker on the runner. Every
      # deployed function is written into supabase/functions/<slug>/, over
      # the checkout -- which is the point: git diff is then the comparison.
      - name: Download every deployed function's source over the checkout
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set (same secret as Deploy Edge Function)."
            exit 1
          fi
          supabase functions download --use-api --project-ref "$SUPABASE_PROJECT_REF"
          echo
          echo "git status after download:"
          git status --porcelain=v1 --untracked-files=all -- supabase/functions || true

      - name: Compare with main
        run: node scripts/check-function-drift.mjs
