      - 'supabase/migrations/*workspace_settings_admin.sql'
      - 'supabase/migrations/*entities_update_lockdown.sql'
      - 'supabase/migrations/*stamp_company_entity_id_on_insert.sql'
      - 'supabase/migrations/*stamp_trigger_idempotent_and_verified.sql'
      - 'supabase/migrations/*stamp_triggers_for_customer_accounts.sql'
      - 'supabase/verify_v2_schema.sql'
      # page-inspect's admission logic is a SECURITY BOUNDARY and lives in the
      # function directory, so a change there must run these tests. Without
      # this path the allowlist could be edited and nothing would run.
      - 'supabase/functions/page-inspect/**'
      - 'supabase/functions/silo-chat/**'
