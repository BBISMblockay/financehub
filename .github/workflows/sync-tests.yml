      - 'supabase/migrations/*cashflow_overrides_liquidity.sql'
      - 'v2/schedules.html'
      - 'v2/fixed-assets.html'
      - 'v2/accounting-export.html'
      - 'v2/qbo-history.js'
      - 'v2/migration-status.js'
      - 'supabase/migrations/*qbo_historical_ledger.sql'
      - 'supabase/migrations/*qbo_history_number_formats.sql'
      - 'supabase/migrations/*qbo_history_bounded_archive.sql'
      - 'supabase/migrations/*card_transaction_splits.sql'
      - 'supabase/migrations/*tenant_boundary_hardening.sql'
      - 'supabase/migrations/*qbo_history_unattributed_section.sql'
      - 'supabase/migrations/*qbo_history_trial_balance_period.sql'
      - 'supabase/functions/plaid-finance/**'
      - 'supabase/functions/card-categorize/**'
      - 'supabase/migrations/*finance_v1_posting_controls.sql'
