name: Sync logic tests

# Unit tests for scripts/lib sync logic that has no network and no database.
#
# The suite that matters here is collections-sync: it drives a real
# mid-pagination failure through runCollectionsSync with a fake Shopify and
# a fake Supabase, and asserts that a partial fetch writes NO completed_at
# and sweeps NO missing_since. That property is the difference between a
# timeout being a retry and a timeout marking every collection deleted, and
# it is not visible in a diff -- the wrong version looks perfectly
# reasonable.
#
# No secrets. The unit job has no install and stubs IO in memory; the separate
# finance database job installs pinned PGlite to execute PostgreSQL locally.

on:
  push:
    branches: [main]
    paths: &sync_paths
      - 'scripts/lib/**'
      - 'scripts/tests/**'
      - 'scripts/shopify-sync.mjs'
      - 'scripts/shopify-orders-backfill.mjs'
      - 'scripts/ad-platforms-sync.mjs'
      - 'scripts/search-console-backfill.mjs'
      - 'scripts/qbo-sandbox-validation.mjs'
      - 'scripts/plaid-sync.mjs'
      - '.github/workflows/plaid-sync.yml'
      - 'supabase/functions/shopify-oauth-start/**'
      # page-inspect's admission logic is a SECURITY BOUNDARY and lives in the
      # function directory, so a change there must run these tests. Without
      # this path the allowlist could be edited and nothing would run.
      - 'supabase/functions/page-inspect/**'
      - 'supabase/functions/silo-chat/**'
      - 'supabase/functions/quickbooks-post-journal/**'
      - 'supabase/functions/quickbooks-report/**'
      - 'v2/accounting-books*'
      - 'v2/qbo-history.js'
      - 'supabase/migrations/*qbo_historical_ledger.sql'
      - 'supabase/functions/plaid-finance/**'
      - 'supabase/functions/card-categorize/**'
      - 'supabase/migrations/*finance_v1_posting_controls.sql'
      - 'supabase/migrations/*plaid_bank_feed.sql'
      - 'v2/card-coding.html'
      - 'v2/transactions.html'
      - 'v2/transactions-tiles.js'
      - 'v2/transactions-workspace.css'
      - 'v2/bank-workspace.js'
      - 'v2/accounting-suite*'
      - 'v2/nav-config.js'
      - 'v2/silo-chrome.js'
      - 'v2/plaid-bank-feed.js'
      - 'v2/je-composer.js'
      # The splitter is tested against the real verify file, so a change to
      # the file must re-run that test.
      - 'supabase/verify_v2_schema.sql'
      - '.github/workflows/sync-tests.yml'
  pull_request:
    paths: *sync_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Bare checkout on purpose, same stance as the v3 unit job.
      - name: Collections sync
        run: node scripts/tests/collections-sync.test.mjs

      - name: Shopify stays read-only
        run: node scripts/tests/shopify-readonly.test.mjs

      - name: Finance V1 approval and QBO recovery controls
        run: node scripts/tests/finance-v1-controls.test.mjs

      - name: Finance V1 posting request handler regressions
        run: node scripts/tests/finance-v1-posting-handler.test.mjs

      - name: QBO sandbox probe safety and failure handling (mock IO)
        run: node scripts/tests/qbo-sandbox-validation.test.mjs

      - name: JE composer review regressions
        run: node scripts/tests/je-composer-review.test.mjs

      - name: Plaid protocol and encrypted credential binding
        run: node scripts/tests/plaid-core.test.mjs

      - name: Plaid authenticated request handler
        run: node scripts/tests/plaid-finance-handler.test.mjs

      - name: Bank feed coding and Link callbacks
        run: node scripts/tests/plaid-bank-feed-ui.test.mjs

      - name: Card AI bank-feed admission
        run: node scripts/tests/card-categorize-bank-guard.test.mjs

      - name: Account workspace states and cutover confirmation
        run: node --test scripts/tests/bank-workspace.test.mjs scripts/tests/finance-dialog.test.mjs

      - name: Accounting suite navigation and legacy routes
        run: node --test scripts/tests/accounting-suite.test.mjs scripts/tests/accounting-foundation-ui.test.mjs scripts/tests/qbo-report-connection.test.mjs scripts/tests/transactions-tiles.test.mjs scripts/tests/qbo-history-ui.test.mjs

      - name: Plaid scheduled sync failure handling
        run: node scripts/tests/plaid-sync.test.mjs

      # A manual 730-day backfill once finished GREEN in two minutes having
      # written nothing (run #354, 2026-09-09): Shopify refused with HTTP 200
      # and the rate limit inside the GraphQL errors array, ~100 already-fetched
      # days were discarded by the all-at-the-end upsert, and the sessions stage
      # was skipped without leaving any record despite a 730-day parameter
      # asking for it. These assert all of that stays fixed -- none of it is
      # visible in a diff, and every wrong version looks reasonable.
      - name: Landing-page backfill keeps partial progress and reports honestly
        run: node scripts/tests/landing-pages-backfill.test.mjs

      # Ask SILO may now select SEO candidate pages itself and inspect up to
      # five. These pin the parts decided in code and prompt text: the
      # inspection budget, the trusted-URL contract (never assemble one, never
      # pair a path with another shop's domain), and the qualifiers a
      # "simplify" pass strips first -- truncation, absence-is-not-zero, and
      # the absence of any Search Console / search-term data.
      - name: Ask SILO SEO orchestration and qualifiers
        run: node scripts/tests/seo-orchestration.test.mjs

      - name: Ask SILO prompt assembly
        run: node supabase/functions/silo-chat/prompt.test.mjs

      # Search Console ingestion. Pins what the probe measurements decided:
      # every request dataState=final with the window ending 2 days back in
      # PACIFIC, per-day attribution computed from the same fetch (a day with
      # a total and no query rows is attributed ZERO, never null), the site
      # row written LAST so it never describes detail rows that did not land,
      # paging by startRow with the guard flagging truncation, query x page
      # never requested, and the backfill keeping completed chunks when a
      # later one fails.
      - name: Search Console sync
        run: node scripts/tests/search-console-sync.test.mjs

      # products_master is one row per (company, sku), so its shopify_product_id
      # is decided by nightly sync ORDER for the 26.9% of sold SKUs that exist
      # in more than one shop. These assert the properties that mapping table
      # exists to keep -- one SKU on two products yields two rows, a variant
      # with no SKU is still mapped, first_seen_at is not restamped nightly.
      - name: Product/SKU mapping grain
        run: node scripts/tests/product-sku-mapping.test.mjs

      # The one that most needs to run on every change: it asserts the known
      # allowlist bypass shapes (suffix matching, lookalike hosts), that
      # resolved addresses must be public unicast, HTTPS-only, that redirects
      # get the same check, and that the shop-domain sweep retires only what
      # the shop stopped serving.
      - name: Page inspection admission and extraction
        run: node scripts/tests/page-inspect.test.mjs

      # Integration-style, all on localhost: proves the TCP connection goes to
      # an ADDRESS we chose while TLS authenticates a NAME we chose, and that
      # claiming a different name over the same address FAILS certificate
      # validation. That negative case is the one that says pinning by address
      # does not weaken authentication. The TLS half needs openssl to mint a
      # throwaway cert and skips (does not fail) without it; ubuntu-latest has
      # it. No network egress, no install.
      - name: Page inspection pinned-TLS shape
        run: node scripts/tests/page-inspect-tls.test.mjs

      # The scheduled production check (deployment-drift-check.yml) splits
      # verify_v2_schema.sql into statements before sending them. A statement
      # cut inside a literal runs as two broken ones (red for nothing); two
      # glued together return only the second's rows (green without looking).
      # Pinned against the real file, not only toy inputs.
      - name: Remote schema verify splits the real file correctly
        run: node scripts/tests/verify-schema-remote.test.mjs

      # The Management API rate-limits; run #2 lost 28 of 148 statements to a
      # 429 and reported them as "could not run". Pins the retry shape.
      - name: Remote schema verify survives the API rate limit
        run: node scripts/tests/management-api.test.mjs

  plaid-typecheck:
    name: Plaid Edge Function typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check actual Edge imports and types
        run: npx --yes deno@2.9.6 check supabase/functions/plaid-finance/index.ts supabase/functions/card-categorize/index.ts supabase/functions/quickbooks-report/index.ts

  finance-database:
    name: Finance database regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated PostgreSQL test dependency
        run: npm ci --prefix scripts/tests/finance-db --ignore-scripts
      - name: Execute finance migration, approval and void regressions
        run: node scripts/tests/finance-v1-database.test.mjs
      - name: Execute Plaid authority, lifecycle and audit regressions
        run: node scripts/tests/plaid-bank-feed-database.test.mjs

      - name: Execute QBO-seeded accounting foundation regressions
        run: node scripts/tests/accounting-foundation-database.test.mjs

      - name: Execute retained QBO ledger and reconciliation regressions
        run: node scripts/tests/qbo-history-database.test.mjs
