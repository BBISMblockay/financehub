name: Sync logic tests

# Unit tests for scripts/lib sync logic that has no network and no database.
#
# The suite that matters here is collections-sync: it drives a real
# mid-pagination failure through runCollectionsSync with a fake Shopify and
# a fake Supabase, and asserts that a partial fetch writes NO completed_at
# and sweeps NO missing_since. That property is the difference between a
# timeout being a retry and a timeout marking every collection deleted, and
# it is not visible in a diff -- the wrong version looks perfectly
# reasonable.
#
# No secrets. The unit job has no install and stubs IO in memory; the separate
# finance database job installs pinned PGlite to execute PostgreSQL locally.

on:
  push:
    branches: [main]
    paths: &sync_paths
      - 'scripts/lib/**'
      - 'scripts/tests/**'
      - 'supabase/migrations/*canned_report_accuracy.sql'
      - 'v3/js/report-params.js'
      - 'scripts/shopify-sync.mjs'
      - 'scripts/shopify-orders-backfill.mjs'
      - 'scripts/ad-platforms-sync.mjs'
      - 'scripts/search-console-backfill.mjs'
      - 'scripts/meta-creative-backfill.mjs'
      - 'scripts/qbo-sandbox-validation.mjs'
      - 'supabase/functions/plaid-scheduled-sync/**'
      - 'scripts/plaid-sync.mjs'
      - '.github/workflows/plaid-sync.yml'
      - '.github/workflows/redo-backfill.yml'
      - '.github/workflows/redo-marketing-probe.yml'
      - '.github/workflows/mailroom-backfill.yml'
      - 'supabase/functions/shopify-oauth-start/**'
      - 'supabase/migrations/*company_onboarding.sql'
      - 'pages/login.html'
      # Workspace Settings: the tab shell, the pages it collapses, and the
      # membership RPCs behind the Team tab.
      - 'v2/workspace-settings.*'
      - 'v2/settings-company.html'
      - 'v2/settings-team.html'
      - 'v2/settings-notifications.html'
      - 'v2/platform-admin.html'
      - 'v2/nav-config.js'
      - 'v2/silo-chrome.js'
      - 'v2/integrations.html'
