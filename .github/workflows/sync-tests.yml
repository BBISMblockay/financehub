      - 'v2/silo-chrome.js'
      - 'v2/plaid-bank-feed.js'
      - 'v2/je-composer.js'
      - 'scripts/lib/forecast-candidate-core.mjs'
      - 'scripts/forecast-candidate-run.mjs'
      - 'scripts/forecast-candidate-backtest.mjs'
      - 'scripts/sql/forecast_candidate_backtest.sql'
      - 'supabase/migrations/*forecast_candidate_ledger.sql'
      - 'supabase/migrations/*stripe_billing_and_connect.sql'
      - 'supabase/functions/stripe-webhook/**'
      - 'supabase/functions/stripe-invoice/**'
      - 'supabase/functions/stripe-connect/**'
      - 'supabase/functions/stripe-billing/**'
      - 'v2/invoicing.html'
      - 'v2/billing.html'
      - 'v2/invoice-request.js'
      - 'supabase/migrations/*customer_account_onboarding.sql'
      - 'supabase/migrations/*open_customer_applications.sql'
      - 'supabase/migrations/*open_applications_toggle.sql'
      - 'supabase/migrations/*archive_customer_accounts.sql'
      - 'supabase/functions/customer-onboarding/**'
      - 'scripts/tests/customer-onboarding-bootstrap.sql'
      - 'v2/customers.html'
      - 'v2/customer-onboarding.html'
      # The splitter is tested against the real verify file, so a change to
      # the file must re-run that test.
      - 'supabase/verify_v2_schema.sql'
      # Notification sender identity: the resolver, its tests, the editable
      # contacts tab, and the ten mail functions that now typecheck in CI.
      # Without these paths the functions could be edited and nothing would run.
      - 'supabase/migrations/*notification_reply_contacts.sql'
      - 'supabase/functions/org-invite-send/**'
      - 'supabase/functions/payment-request-notify/**'
      - 'supabase/functions/payment-request-submitted-notify/**'
      - 'supabase/functions/comp-request-notify/**'
      - 'supabase/functions/mail-item-notify/**'
      - 'supabase/functions/sample-notify/**'
      - 'supabase/functions/review-send/**'
      - 'supabase/functions/review-finish/**'
      - 'supabase/functions/review-portal/**'
      - 'supabase/functions/payment-request-forward-melio/**'
      # legacy-slack-pause.test.mjs executes this migration and reads the
      # inert endpoint; an edit to either must re-run it.
      - 'supabase/migrations/*pause_legacy_slack_notifications.sql'
      - 'supabase/functions/notify-slack/**'
      - '.github/workflows/sync-tests.yml'
  pull_request:
    paths: *sync_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Bare checkout on purpose, same stance as the v3 unit job.
      - name: Collections sync
        run: node scripts/tests/collections-sync.test.mjs

      - name: Shopify stays read-only
        run: node scripts/tests/shopify-readonly.test.mjs

      - name: Finance V1 approval and QBO recovery controls
        run: node scripts/tests/finance-v1-controls.test.mjs

      - name: Finance V1 posting request handler regressions
        run: node scripts/tests/finance-v1-posting-handler.test.mjs

      - name: QBO sandbox probe safety and failure handling (mock IO)
        run: node scripts/tests/qbo-sandbox-validation.test.mjs

      - name: JE composer review regressions
        run: node scripts/tests/je-composer-review.test.mjs

      - name: Plaid protocol and encrypted credential binding
        run: node scripts/tests/plaid-core.test.mjs

      - name: Plaid authenticated request handler
        run: node scripts/tests/plaid-finance-handler.test.mjs

      - name: Bank feed coding and Link callbacks
        run: node scripts/tests/plaid-bank-feed-ui.test.mjs

      - name: Card AI bank-feed admission
        run: node scripts/tests/card-categorize-bank-guard.test.mjs

      - name: Card AI historical coding evidence
        run: node scripts/tests/card-categorize-history.test.mjs

      - name: Account workspace states and cutover confirmation
        run: node --test scripts/tests/bank-workspace.test.mjs scripts/tests/finance-dialog.test.mjs

      - name: Accounting suite navigation and legacy routes
        run: node --test scripts/tests/cashflow.test.mjs scripts/tests/accounting-display.test.mjs scripts/tests/accounting-suite.test.mjs scripts/tests/accounting-foundation-ui.test.mjs scripts/tests/qbo-report-connection.test.mjs scripts/tests/transactions-tiles.test.mjs scripts/tests/transaction-dates.test.mjs scripts/tests/qbo-history-ui.test.mjs scripts/tests/card-splits-ui.test.mjs

      # Which company's sidebar a session is served. Visibility only -- RLS
      # decides the data -- but resolveNavProfile(null) used to answer
      # 'grandfathered', so a second tenant's user on a deep link (no cached
      # company: sessionStorage is per-tab, the auth session is not) was shown
      # Baseballism's menu.
      - name: Nav profile fails closed on an unresolved company
        run: node --test scripts/tests/nav-profile.test.mjs

      # One settings area, no duplicate Billing/Integrations routes, and a
      # platform link that a company owner can never see.
      - name: Workspace settings navigation and platform separation
        run: node --test scripts/tests/workspace-settings.test.mjs

      # Making an env var mandatory in a script silently breaks every workflow
      # that runs it without one, and a workflow_dispatch-only job proves itself
      # only when a human dispatches it -- possibly months later, mid-onboarding.
      # Generic contract, not a list of names, so new scripts are covered too.
      - name: Workflows supply the env their scripts require
        run: node --test scripts/tests/workflow-env-contract.test.mjs

      - name: Plaid scheduled sync failure handling
        run: node scripts/tests/plaid-sync.test.mjs

      - name: Scheduled Plaid identity and admission
        run: |
          npm ci --prefix scripts/tests/plaid-oidc
          node --import ./scripts/tests/plaid-oidc/register.mjs scripts/tests/plaid-scheduled-sync.test.mjs

      # A manual 730-day backfill once finished GREEN in two minutes having
      # written nothing (run #354, 2026-09-09): Shopify refused with HTTP 200
      # and the rate limit inside the GraphQL errors array, ~100 already-fetched
      # days were discarded by the all-at-the-end upsert, and the sessions stage
      # was skipped without leaving any record despite a 730-day parameter
      # asking for it. These assert all of that stays fixed -- none of it is
      # visible in a diff, and every wrong version looks reasonable.
      - name: Landing-page backfill keeps partial progress and reports honestly
        run: node scripts/tests/landing-pages-backfill.test.mjs

      # Ask SILO may now select SEO candidate pages itself and inspect up to
      # five. These pin the parts decided in code and prompt text: the
      # inspection budget, the trusted-URL contract (never assemble one, never
      # pair a path with another shop's domain), and the qualifiers a
      # "simplify" pass strips first -- truncation, absence-is-not-zero, and
      # the absence of any Search Console / search-term data.
      - name: Ask SILO SEO orchestration and qualifiers
        run: node scripts/tests/seo-orchestration.test.mjs

      - name: Ask SILO prompt assembly
        run: node supabase/functions/silo-chat/prompt.test.mjs

      # Search Console ingestion. Pins what the probe measurements decided:
      # every request dataState=final with the window ending 2 days back in
      # PACIFIC, per-day attribution computed from the same fetch (a day with
      # a total and no query rows is attributed ZERO, never null), the site
      # row written LAST so it never describes detail rows that did not land,
      # paging by startRow with the guard flagging truncation, query x page
      # never requested, and the backfill keeping completed chunks when a
      # later one fails.
      - name: Search Console sync
        run: node scripts/tests/search-console-sync.test.mjs

      # Meta ad destinations. The assertion that earns its place is the
      # DOWNGRADE: these reads go through the Graph batch API, where a field
      # Meta does not accept returns 200 on the outer POST and fails every
      # item inside it -- which the loop skipped silently. Without the
      # per-item check, one refused field writes thousands of creative rows
      # with no copy and no links, warning about nothing.
      - name: Meta creative destinations
        run: node scripts/tests/meta-creative-links.test.mjs

      - name: Marketing Report destination rendering
        run: node scripts/tests/wow-report-destination.test.mjs

      # The backfill that reaches ads the nightly never asks about (it fetches
      # creatives only for ad ids inside its trailing window, which is why 126
      # of 4,079 stored creatives had ever been requested). The assertion that
      # earns its place is that the backfill ONLY ADDS: re-asking about an old
      # ad must never blank a destination or copy already resolved, because a
      # backfill that deletes data is worse than one that misses some.
      - name: Meta creative backfill
        run: node scripts/tests/meta-creative-backfill.test.mjs

      # ...and the DRIVER, executed for real. The core passing in isolation is
      # the exact state in which a dead-zone reference shipped inside an
      # orchestrator callback here: this runs the script's own connection load,
      # candidate selection, PostgREST paging and sync_jobs bookkeeping.
      - name: Meta creative backfill driver
        run: node scripts/tests/meta-creative-backfill-driver.test.mjs

      # products_master is one row per (company, sku), so its shopify_product_id
      # is decided by nightly sync ORDER for the 26.9% of sold SKUs that exist
      # in more than one shop. These assert the properties that mapping table
      # exists to keep -- one SKU on two products yields two rows, a variant
      # with no SKU is still mapped, first_seen_at is not restamped nightly.
      - name: Product/SKU mapping grain
        run: node scripts/tests/product-sku-mapping.test.mjs

      # The one that most needs to run on every change: it asserts the known
      # allowlist bypass shapes (suffix matching, lookalike hosts), that
      # resolved addresses must be public unicast, HTTPS-only, that redirects
      # get the same check, and that the shop-domain sweep retires only what
      # the shop stopped serving.
      - name: Page inspection admission and extraction
        run: node scripts/tests/page-inspect.test.mjs

      # Integration-style, all on localhost: proves the TCP connection goes to
      # an ADDRESS we chose while TLS authenticates a NAME we chose, and that
      # claiming a different name over the same address FAILS certificate
      # validation. That negative case is the one that says pinning by address
      # does not weaken authentication. The TLS half needs openssl to mint a
      # throwaway cert and skips (does not fail) without it; ubuntu-latest has
      # it. No network egress, no install.
      - name: Page inspection pinned-TLS shape
        run: node scripts/tests/page-inspect-tls.test.mjs

      # The scheduled production check (deployment-drift-check.yml) splits
      # verify_v2_schema.sql into statements before sending them. A statement
      # cut inside a literal runs as two broken ones (red for nothing); two
      # glued together return only the second's rows (green without looking).
      # Pinned against the real file, not only toy inputs.
      # The Demand Planner candidate runner. Only orchestration is tested here
      # -- which cutoffs to attempt, and that one refused cutoff does not
      # abandon the month's remaining ones. The forecast arithmetic is defined
      # once in SQL and is driven against a real PostgreSQL in the database job.
      - name: Demand candidate runner planning and parameter binding
        run: node scripts/tests/forecast-candidate.test.mjs

      # Two Stripe surfaces deliver the SAME event types and are told apart
      # only by which signing secret verified the delivery -- get that backwards
      # and a client's own sales are filed as SILO subscription revenue. Also
      # pins the one arithmetic step between a person and a real customer's
      # card: "1,250.00" -> 125000 minor units, refusing what it cannot
      # represent exactly rather than rounding a price nobody agreed to.
      - name: Stripe event routing and invoice amounts
        run: node scripts/tests/stripe-edge-logic.test.mjs

      # The four handlers EXECUTED. `deno check` proves types, not behaviour,
      # and the database suite proves the SQL they call rather than the calling
      # -- which is the exact gap that shipped a dead-zone reference here
      # before, inside an orchestrator whose core had 91 passing assertions.
      - name: Stripe Edge Function handlers
        run: node scripts/tests/stripe-handlers.test.mjs

      - name: Each Stripe handler guard, removed one at a time, must break it
        run: |
          set -u
          for m in webhook-trusts-payload webhook-swallows-failure webhook-lease-is-200 \
                   webhook-ignores-finish connect-body-company connect-note-after-sync \
                   connect-release-on-error connect-no-idempotency invoice-lines-after-create \
                   invoice-trusts-stripe-id billing-body-price billing-trusts-mirror \
                   invoice-failure-always-clean billing-seats-count-every-member \
                   billing-checkout-unserialized invoice-customer-always-clean \
                   billing-resume-ignores-plan billing-note-unchecked billing-replay-unread \
                   billing-lookup-fails-open; do
            echo "--- $m ---"
            if STRIPE_HANDLER_MUTATION="$m" node scripts/tests/stripe-handlers.test.mjs; then
              echo "::error::mutation $m did not fail the suite -- the guard it removes is untested"
              exit 1
            fi
            echo "$m failed the suite, as it must"
          done

      # The onboarding function is PUBLIC: no JWT, no RLS behind it (it holds
      # the service-role key), and it can create a Stripe customer and a
      # payment-method capture session. Every guard it has is orchestration.
      - name: Customer onboarding handler and setup-capture webhook path
        run: node scripts/tests/customer-onboarding.test.mjs

      - name: Each customer onboarding guard, removed one at a time, must break it
        run: |
          set -u
          for m in body-account note-ignored unknown-status-restarts attempt-not-bumped \
                   no-reclaim consent-from-page consent-not-checked webhook-any-mode \
                   webhook-default-fatal webhook-trusts-session webhook-no-owner-check \
                   webhook-owner-any-customer webhook-transient-swallowed \
                   cert-recorded-early cert-trusts-caller \
                   open-body-company open-email-by-position; do
            echo "--- $m ---"
            if CUSTOMER_ONBOARDING_MUTATION="$m" node scripts/tests/customer-onboarding.test.mjs; then
              echo "::error::mutation $m did not fail the suite -- the guard it removes is untested"
              exit 1
            fi
            echo "$m failed the suite, as it must"
          done

      - name: Remote schema verify splits the real file correctly
        run: node scripts/tests/verify-schema-remote.test.mjs

      # The Management API rate-limits; run #2 lost 28 of 148 statements to a
      # 429 and reported them as "could not run". Pins the retry shape.
      - name: Remote schema verify survives the API rate limit
        run: node scripts/tests/management-api.test.mjs

  plaid-typecheck:
    name: Plaid Edge Function typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check actual Edge imports and types
        run: |
          npx --yes deno@2.9.6 check --config supabase/functions/plaid-scheduled-sync/deno.json supabase/functions/plaid-scheduled-sync/index.ts
          npx --yes deno@2.9.6 check supabase/functions/plaid-finance/index.ts supabase/functions/card-categorize/index.ts supabase/functions/quickbooks-report/index.ts
          for fn in stripe-webhook stripe-connect stripe-invoice stripe-billing customer-onboarding; do
            npx --yes deno@2.9.6 check --config "supabase/functions/$fn/deno.json" "supabase/functions/$fn/index.ts"
          done
          # The ten mail functions. Nothing typechecked these before, which is
          # how four of them carried a `err?.message`-on-`{}` error for months:
          # Supabase does not typecheck on deploy, and they are only exercised
          # when an email actually sends. They now resolve their From and
          # Reply-To per tenant, so a signature mistake here is a notification
          # that does not send -- worth catching in CI rather than in an inbox.
          # --node-modules-dir=none because the repo root has a package.json,
          # which otherwise puts deno in node_modules mode; these functions
          # import a fully-specified npm: specifier and need no import map.
          for fn in org-invite-send payment-request-notify payment-request-submitted-notify \
                    comp-request-notify mail-item-notify sample-notify review-send \
                    review-finish review-portal payment-request-forward-melio; do
            npx --yes deno@2.9.6 check --node-modules-dir=none "supabase/functions/$fn/index.ts"
          done

  onboarding-concurrency:
    name: Onboarding concurrency (real PostgreSQL)
    runs-on: ubuntu-latest
    # PGlite is a SINGLE connection, so the finance-database job above can prove
    # a guard refuses a bad state but never that two sessions racing cannot
    # assemble that state between them. Both of the onboarding migration's
    # concurrency claims -- the per-company advisory lock across the two
    # currency guards, and the FOR UPDATE that makes the disabled-account
    # refusal authoritative -- are only testable with two real connections.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      SILO_PG_CONN: postgresql://postgres@127.0.0.1:5432/postgres
      # No server, no psql, no silent green. See skip() in the suite.
      SILO_PG_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Interleave two sessions against the committed migration
        run: node scripts/tests/onboarding-concurrency.test.mjs

      # The last-owner invariant spans two functions and is check-then-act
      # across two DIFFERENT rows -- the target membership is locked, the owner
      # count is not -- so a single-connection harness cannot reach it. Two
      # owners each stepping back left the workspace with ZERO owners before
      # the shared per-company advisory lock, measured, not argued.
      - name: Interleave two sessions against the workspace membership functions
        run: node scripts/tests/workspace-settings-concurrency.test.mjs

      # A concurrency test that cannot fail is the most expensive kind of
      # reassurance: the interleaving still happens, the guards are simply not
      # what stops it. These remove one lock each and REQUIRE the suite to go
      # red, so a future edit that neuters one cannot leave this job green.
      # Measured 2026-09-18, each producing the damage its lock prevents:
      # books seeded USD under a CAD declaration; an administrator's
      # deactivation undone by the redeem it raced; two companies founded from
      # one invite.
      - name: Each lock, removed one at a time, must break it
        run: |
          set -u
          for m in currency-unlocked redeem-unlocked invite-unlocked; do
            echo "--- $m ---"
            if ONBOARDING_RACE_MUTATION="$m" node scripts/tests/onboarding-concurrency.test.mjs; then
              echo "::error::mutation $m did not fail the suite -- the guard it removes is untested"
              exit 1
            fi
            echo "$m failed the suite, as it must"
          done

      - name: The workspace owner-count lock, removed, must break it
        run: |
          set -u
          if WS_RACE_MUTATION=owner-count-unlocked node scripts/tests/workspace-settings-concurrency.test.mjs; then
            echo "::error::owner-count-unlocked did not fail the suite -- the lock it removes is untested"
            exit 1
          fi
          echo "owner-count-unlocked failed the suite, as it must"

  finance-database:
    name: Finance database regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated PostgreSQL test dependency
        run: npm ci --prefix scripts/tests/finance-db --ignore-scripts
      - name: Execute canned report accuracy and drift regressions
        run: node scripts/tests/canned-reports-database.test.mjs
      - name: Execute finance migration, approval and void regressions
        run: node scripts/tests/finance-v1-database.test.mjs
      - name: Execute Plaid authority, lifecycle and audit regressions
        run: node scripts/tests/plaid-bank-feed-database.test.mjs

      - name: Execute QBO-seeded accounting foundation regressions
        run: node scripts/tests/accounting-foundation-database.test.mjs

      - name: Execute retained QBO ledger and reconciliation regressions
        run: node scripts/tests/qbo-history-database.test.mjs

      # One transaction across several accounts (a loan payment's principal and
      # interest): the lines must total the transaction, the posted entry must
      # carry one line per split line and stay balanced, and a learned rule must
      # remember the accounts without ever remembering an amount.
      - name: Execute card transaction split regressions
        run: node scripts/tests/card-splits-database.test.mjs

      - name: Execute profiles tenant-isolation regressions
        run: node --test scripts/tests/profiles-tenant-scope.test.mjs

      # Founding a NEW tenant. The gate is handle_new_user, not login.html:
      # signUp is a public endpoint and the anon key is published, so the test
      # signs a user up WITH org_name in the metadata and asserts no company
      # appears. Also pins the idempotent retry (a lost response must not found
      # a second company), the non-Pacific refusal, and the isolation of the
      # new owner in both directions. Mutations: ONBOARDING_MUTATION=
      # signup-founds-org | retry-creates-new | tz-anything-goes | invite-any-admin
      - name: Execute company-onboarding regressions
        run: node scripts/tests/company-onboarding-database.test.mjs

      # The Team tab's two verbs, both of which replace something quietly
      # wrong: changing a role used to write the GLOBAL profiles.role (which
      # several gates read with no reference to which company you are in), and
      # removing somebody from ONE workspace had no implementation at all --
      # the nearest thing set a global is_active flag.
      - name: Execute workspace membership administration regressions
        run: node scripts/tests/workspace-settings-database.test.mjs

      # entities took client UPDATE from any member of a company, a viewer
      # included -- title, entity_key, meta.nav_profile and entity_type, which
      # is what decides whose menu a company is served. The fixture BUILDS the
      # production policies first and asserts the hole exists, so closing it
      # proves something.
      - name: Execute entities client-write lockdown regressions
        run: node scripts/tests/entities-update-lockdown.test.mjs

      # The stamp helper is a per-migration checklist step now, so "re-running
      # it is free" has to be true rather than asserted. Proven by trigger OID
      # stability -- an oid cannot survive a drop-and-recreate. Also pins that
      # check 6 goes red for ONE missing table: the count-vs-count version it
      # replaced needed six.
      - name: Execute stamp trigger helper and verifier regressions
        run: node scripts/tests/stamp-trigger-helper.test.mjs

      # The seven shared Slack triggers, their functions and the daily cron
      # must stay gone while the integration is paused, and the checked-in
      # notify-slack endpoint must be unable to reach Slack. This suite landed
      # on PR #750 without a step invoking it, so the workflow triggered and
      # passed having executed none of it (cycle-1 review finding). It needs
      # the PGlite install above.
      - name: Execute legacy Slack pause regressions
        run: node scripts/tests/legacy-slack-pause.test.mjs

      # The entity admin gate answered about the wrong company: is_owner_admin()
      # asked "am I an admin ANYWHERE" and then said yes for every tenant. The
      # fixture reproduces the wide gate AND the four policies built on it, and
      # deletes a YOUNG tenant -- Baseballism is shielded by NO ACTION child FKs,
      # so asserting against it would pass with or without the fix.
      # Reply-To is the property that matters: an unconfigured tenant must
      # never make SILO the reply desk for its own invoices.
      - name: Execute notification sender resolution regressions
        run: node scripts/tests/notification-sender.test.mjs

      - name: Each sender guarantee, removed one at a time, must break it
        run: |
          set -u
          for m in fallback-to-silo no-purpose no-sanitize write-open; do
            echo "--- $m ---"
            if SENDER_MUTATION="$m" node scripts/tests/notification-sender.test.mjs; then
              echo "::error::mutation $m did not fail the suite -- the guarantee it removes is untested"
              exit 1
            fi
            echo "$m failed the suite, as it must"
          done

      - name: Execute entity admin gate scoping regressions
        run: node scripts/tests/entity-admin-gate-scope.test.mjs

      - name: Each entity-gate guard, removed one at a time, must break it
        run: |
          set -u
          for m in gate-unscoped gate-inlined vocabulary-kept grant-kept \
                   policy-kept policy-and-gate-kept; do
            echo "--- $m ---"
            if GATE_MUTATION="$m" node scripts/tests/entity-admin-gate-scope.test.mjs; then
              echo "::error::mutation $m did not fail the suite -- the guard it removes is untested"
              exit 1
            fi
            echo "$m failed the suite, as it must"
          done

      - name: Each stamp-helper guarantee, removed, must break it
        run: |
          set -u
          for m in helper-drops-everything verify-counts predicate-loose; do
            echo "--- $m ---"
            if STAMP_MUTATION="$m" node scripts/tests/stamp-trigger-helper.test.mjs; then
              echo "::error::mutation $m did not fail the suite -- the guarantee it removes is untested"
              exit 1
            fi
            echo "$m failed the suite, as it must"
          done

      - name: Each entities layer, removed one at a time, must break it
        run: |
          set -u
          for m in policies-kept grant-kept; do
            echo "--- $m ---"
            if ENTITIES_MUTATION="$m" node scripts/tests/entities-update-lockdown.test.mjs; then
              echo "::error::mutation $m did not fail the suite -- the layer it removes is untested"
              exit 1
            fi
            echo "$m failed the suite, as it must"
          done

      - name: Each workspace membership guard, removed one at a time, must break it
        run: |
          set -u
          for m in role-writes-global-always allow-last-owner-demote strip-removal-guards \
                   allow-self-remove admin-grants-owner platform-list-any-admin \
                   remove-keeps-invite; do
            echo "--- $m ---"
            if WS_MUTATION="$m" node scripts/tests/workspace-settings-database.test.mjs; then
              echo "::error::mutation $m did not fail the suite -- the guard it removes is untested"
              exit 1
            fi
            echo "$m failed the suite, as it must"
          done

      # SECURITY DEFINER functions bypass RLS entirely, so their EXECUTE grant
      # is the whole tenant boundary -- and Supabase grants EXECUTE to anon by
      # DEFAULT on every new function, so the insecure state arrives without
      # anyone writing SQL to cause it. Pins both the working guard and the
      # inert one: `current_user` is the function OWNER inside a definer
      # function, so the obvious guard never fires while looking correct.
      - name: Execute SECURITY DEFINER tenant-boundary regressions
        run: node scripts/tests/tenant-boundary.test.mjs

      # Ask SILO's shared query engine. Its guard is a check on the SHAPE of the
      # statement text, and a SELECT is not a read: `select
      # set_active_company(...)` is one semicolon-free SELECT that repoints the
      # caller's whole session at another company. Also pins the two mechanisms
      # that LOOK like the fix and are not -- a transaction_read_only function
      # SET clause (Postgres rejects it outright) and declaring the function
      # STABLE (a nested volatile function still writes) -- because the second
      # is what the next person will reach for.
      - name: Execute Ask SILO read-only query boundary regressions
        run: node scripts/tests/chat-readonly-query-database.test.mjs

      - name: Execute cashflow override, liquidity and audit regressions
        run: node scripts/tests/cashflow-database.test.mjs

      # The destination columns, run twice to prove the migration is
      # re-appliable (apply_all_post_merge.sql promises that, and the first
      # version of this migration broke it: the view depends on the generated
      # column, so a drop-then-add failed on the second run). Also pins the
      # thruplays/leads that production carried and this repo did not, so a
      # future rebuild of wow_creatives cannot silently delete them again.
      - name: Execute Meta creative destination regressions
        run: node scripts/tests/meta-creative-links-database.test.mjs

      # The SEO workflow's approval RLS, publication guard, window ordering and
      # the deterministic capture, executed as authenticated users against the
      # committed migrations. Until 2026-09-14 the only behavioural check was a
      # manual service-role script that no workflow ran.
      - name: Execute SEO workflow approval, publication and measurement regressions
        run: node scripts/tests/seo-workflow-database.test.mjs

      # The prospective forecast ledger. Two assertions earn the job on their
      # own: the frozen run reproduced from Baseballism's REAL Youth series
      # (115,699 / 59,124 / 4,297 -> 7,735), and the retrospective 20.2% WAPE /
      # -13.9% bias reproduced by executing the shipped backtest SQL over that
      # same series -- next to the 49.6% the identical rule scores over the long
      # window, which is why the candidate is being evaluated prospectively
      # rather than adopted. The rest are properties no diff shows: a frozen
      # row cannot be edited even by the service role, a re-run does not
      # recompute, a month landing after a cutoff cannot change the forecast
      # made at it, and three cycles out of order are not three consecutive
      # cycles.
      - name: Execute demand candidate ledger, tenancy and promotion-gate regressions
        run: node scripts/tests/forecast-candidate-database.test.mjs

      # The competition: several methods frozen side by side, and the SELECTION
      # between them recorded before the cutoff it governs. The assertion that
      # earns the job is that the table refuses a selection whose evidence
      # reaches its own cutoff -- a pick that could have been made after seeing
      # the result it justifies is indistinguishable from no pick at all, and
      # the job writes with the service role, so only a CHECK can stop it. Also
      # runs the whole Category Buy Forecast report as a signed-in user, which
      # is what proves its forward columns read NULL rather than 0 before
      # anything has matured.
      - name: Execute forecast competition, selection and buy-report regressions
        run: node scripts/tests/forecast-method-competition.test.mjs

      # Stripe, twice: SILO's subscription revenue and the clients' own
      # invoicing. What earns the job is not that the tables exist -- it is
      # that no client can write a mirror of an external money system, that
      # the two Stripe surfaces cannot be crossed, that an out-of-order webhook
      # cannot un-pay an invoice, and that a retried request does not invoice a
      # real customer twice.
      - name: Execute Stripe billing, Connect and tenancy regressions
        run: node scripts/tests/stripe-billing-database.test.mjs

      # Each guard, removed one at a time, must turn the suite red. A guard
      # whose removal changes nothing is not a guard, and the four that matter
      # here are invisible in a diff: every wrong version looks reasonable.
      - name: Each Stripe guard, removed one at a time, must break it
        run: |
          set -u
          # Keep this list in step with the STRIPE_MUTATION allowlist at the top
          # of the suite. A mutation that CI never runs is coverage that does
          # not exist -- the first four below were added after the list was
          # written and went three commits without being executed here, while
          # the PR said twelve mutations ran.
          for m in mirror-writable gate-is-admin stale-wins account-rebind \
                   ledger-amnesia platform-takes-account lines-upserted sync-open-to-anon \
                   placeholder-claims-now webhook-no-reclaim connect-rebind-allowed \
                   connect-unclaimed lease-reads-terminal failed-always-fresh \
                   line-price-strict subscription-any-identity \
                   checkout-claim-unguarded checkout-release-unscoped \
                   checkout-takeover-rotates checkout-note-silent; do
            echo "--- $m ---"
            if STRIPE_MUTATION="$m" node scripts/tests/stripe-billing-database.test.mjs; then
              echo "::error::mutation $m did not fail the suite -- the guard it removes is untested"
              exit 1
            fi
            echo "$m failed the suite, as it must"
          done

      # The onboarding schema as real roles: the tax profile must be NARROWER
      # than the customer directory (an EIN is not a ship-to address), the token
      # table must stay RPC-only, and a submission must not be able to grant
      # itself terms. Also runs this feature's own verify_v2_schema checks, so a
      # check that cannot return 'ok' against a correct schema is caught here
      # rather than by a permanently red daily drift run.
      - name: Customer account onboarding schema
        run: node scripts/tests/customer-onboarding-database.test.mjs

      - name: Each customer onboarding schema guard, removed one at a time, must break it
        run: |
          set -u
          for m in tax-open invites-readable submit-takes-terms submit-after-approval \
                   token-not-consumed claim-unguarded claim-steals-session release-no-bump \
                   webhook-any-company webhook-any-customer rebind-allowed \
                   storage-bucket-only public-rpc-granted table-writable owner-any-company \
                   activity-every-call \
                   open-default-on open-ignores-switch open-allows-duplicate \
                   open-trusts-type helper-client-callable \
                   toggle-ungated toggle-needs-settings-row toggle-guesses-currency \
                   archive-ungated archive-blocks-reapply archive-keeps-links-live; do
            echo "--- $m ---"
            if CUSTOMER_DB_MUTATION="$m" node scripts/tests/customer-onboarding-database.test.mjs; then
              echo "::error::mutation $m did not fail the suite -- the guard it removes is untested"
              exit 1
            fi
            echo "$m failed the suite, as it must"
          done
