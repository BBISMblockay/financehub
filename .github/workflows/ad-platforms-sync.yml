name: Ad Platforms KPI Sync

on:
  workflow_dispatch:
    inputs:
      company_entity_id:
        description: Optional company UUID (limit to one entity)
        required: false
      platform:
        description: Optional single platform (google_ads | meta_ads | tiktok_ads | ga4)
        required: false
      connection_id:
        description: Optional ad_platform_connections.id
        required: false
      days_back:
        description: Override trailing-window days (default from connection row, 30)
        required: false
      ig_post_limit:
        description: >-
          Instagram posts to walk back through (default 50). Instagram history is
          per-post, not date-windowed, so days_back does NOT affect it. Each post
          costs one extra API request.
        required: false
  schedule:
    # 10:30 UTC — ad platforms have finalized the prior day by then.
    # (The old note here said "runs before the 11:00 Shopify sync"; that sync
    # moved to 08:30 in 2026-08, so the ordering claim was stale.)
    - cron: "30 10 * * *"
    # 16:30 UTC catch-up, same reasoning as shopify-sync.yml's second cron.
    # GitHub's scheduled triggers are best-effort and get DROPPED silently.
    # On 2026-08-27 BOTH this workflow's 10:30 and shopify-sync's 08:30 were
    # dropped on the same morning, and neither leaves a trace in the Actions
    # list -- a dropped run simply never appears. The visible symptom was a
    # marketer reporting that Meta looked "slightly off" hours before a
    # meeting: the only run that day had been a manual one at 02:27 UTC, i.e.
    # 7:27pm PT, which caught 8/26 with ~4.5 hours of that Pacific day still
    # to go. Two independent triggers have to both be dropped for a day to go
    # unsynced. The sync is an idempotent upsert on a trailing window, so a
    # second run when the first succeeded is close to free.
    - cron: "30 16 * * *"
    # Light refresh every 2 hours -- same reasoning as shopify-sync.yml: survive
    # GitHub delivering crons hours late, rather than needing hourly numbers.
    #
    # Cheap on purpose, because Meta rate limits are real on this account
    # ("Application request limit reached", code 4, hit repeatedly in 2026-08).
    # A 3-day window instead of 30 turns the day-by-day ad-level pull from ~30
    # requests into 3, and ADS_SKIP_ORGANIC drops the Instagram walk, which is
    # one request PER POST and by far the most expensive part. Restatements
    # beyond 3 days are still picked up by the full nightly runs below.
    - cron: "0 */2 * * *"

jobs:
  ad-platforms-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Shared Google OAuth client — needed to redeem the per-connection
      # refresh tokens; google_ads/ga4 connections are skipped (not failed)
      # while these are unset, so this is safe to schedule before the
      # Google Cloud / Ads dev-portal setup is finished.
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      ADS_ONLY_COMPANY_ID: ${{ github.event.inputs.company_entity_id || '' }}
      ADS_ONLY_PLATFORM: ${{ github.event.inputs.platform || '' }}
      ADS_ONLY_CONNECTION_ID: ${{ github.event.inputs.connection_id || '' }}
      ADS_DAYS_BACK: ${{ github.event.inputs.days_back || (github.event.schedule == '0 */2 * * *' && '3') || '' }}
      ADS_SKIP_ORGANIC: ${{ (github.event.schedule == '0 */2 * * *' && 'true') || 'false' }}
      ADS_IG_POST_LIMIT: ${{ github.event.inputs.ig_post_limit || '' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      # Meta/TikTok tokens live on ad_platform_connections rows (set via the
      # Integrations UI), so the orchestrator needs no per-platform secret
      # for them; with zero sync-enabled connections it simply no-ops.
      - name: Run ad platforms sync orchestrator
        run: node scripts/ad-platforms-sync.mjs
