name: PO booking and arrival tests
on:
  pull_request:
    paths:
      - 'v2/po-report.html'
      - 'v2/po-report.css'
      - 'v2/po-builder.html'
      - 'v2/po-pipeline-sync.js'
      - 'v2/products.html'
      - 'v2/profile.html'
      - 'v2/planning-scenarios.html'
      - 'v2/launch-calendar.html'
      - 'v2/v2/launch-calendar2.html'
      - 'v2/underwriting/**'
      - 'v2/tests/browser/po-report-*.test.js'
      - 'supabase/migrations/*shipment_bookings*'
      - 'supabase/migrations/*receiving_write_scope*'
      - 'supabase/migrations/*po_status_write_scope*'
      - 'v2/tests/browser/po-status-steps.test.js'
      - 'scripts/tests/shipment-booking-arrival-database.test.mjs'
      - 'supabase/migrations/*landed_cost_bill_bank*'
      - 'scripts/tests/landed-cost-bank-database.test.mjs'
      - 'v2/tests/unit/landed-cost-split.test.js'
      - 'pages/po-costing-lib.js'
      - 'v2/po-costing.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/po-booking-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix scripts/tests/finance-db --ignore-scripts
      - run: npm install --prefix v2/tests --ignore-scripts --no-package-lock
      - run: cd v2/tests && npx playwright install --with-deps chromium

      # 20261028220000: a booking groups shipments across POs, its dates win
      # over the shipments' own, and v_po_arrival publishes plan / actual /
      # variance per PO without ever writing po_headers.
      - name: Execute shipment booking and arrival migration regressions
        run: node scripts/tests/shipment-booking-arrival-database.test.mjs

      - name: Each arrival guarantee, removed one at a time, must break it
        run: |
          set -u
          for m in min-eta ignore-ata no-tenant-guard plan-wins cascade-delete; do
            echo "--- $m ---"
            if ARRIVAL_MUTATION="$m" node scripts/tests/shipment-booking-arrival-database.test.mjs; then
              echo "::error::mutation $m did not fail the suite -- the guarantee it removes is untested"
              exit 1
            fi
          done

      - name: PO Report shipment overview still behaves
        run: node v2/tests/browser/po-report-shipments.test.js

      - name: PO Report bookings
        run: node v2/tests/browser/po-report-bookings.test.js

      - name: Each booking behaviour, removed one at a time, must break it
        run: |
          set -u
          for m in own-dates no-ata no-conflict no-slip; do
            echo "--- $m ---"
            if PO_BOOKING_MUTATION="$m" node v2/tests/browser/po-report-bookings.test.js; then
              echo "::error::mutation $m did not fail the suite -- the behaviour it removes is untested"
              exit 1
            fi
          done

      # 20261117220000: a delivery a connected AI drafted, waiting for a person.
      # Proves the variance and the AI's own doubts are on screen, that a PO
      # status the person may not change is reported rather than swallowed, and
      # that the tab is unchanged where the RPCs are not applied yet.
      - name: PO Report drafted deliveries
        run: node v2/tests/browser/po-report-drafted-receipts.test.js

      - name: Each drafted-delivery behaviour, removed one at a time, must break it
        run: |
          set -u
          for m in always-visible no-variance silent-po no-source-text hard-fail no-step-card step-hard-fail step-always; do
            echo "--- $m ---"
            if PO_RECEIPT_MUTATION="$m" node v2/tests/browser/po-report-drafted-receipts.test.js; then
              echo "::error::mutation $m did not fail the suite -- the behaviour it removes is untested"
              exit 1
            fi
          done

      # 20261125234500: a PO's steps are company data, and the builder reads
      # them -- with its own list only as the fallback, because an empty status
      # dropdown would stop every PO being edited.
      - name: PO Builder reads this company's steps
        run: node v2/tests/browser/po-status-steps.test.js

      # 20261128040000: a freight invoice is a bill that gets SPENT across
      # purchase orders and containers, and the database -- not the page --
      # refuses a split that comes to more than the bill.
      - name: Execute landed-cost bill bank migration regressions
        run: node scripts/tests/landed-cost-bank-database.test.mjs

      - name: Each bill bank guarantee, removed one at a time, must break it
        run: |
          set -u
          for m in no-guard no-shipment-check no-tenant-check no-legacy no-restore no-dup-index \
                   no-correct no-amount-match no-bill-guard no-detach-flag no-costing-sync; do
            echo "--- $m ---"
            if BANK_MUTATION="$m" node scripts/tests/landed-cost-bank-database.test.mjs; then
              echo "::error::mutation $m did not fail the suite -- the guarantee it removes is untested"
              exit 1
            fi
          done

      # How a bill is spread over the units it paid for: a container's freight
      # reaches that container's lines only, a split totals the invoice to the
      # cent, and an allocation that reaches no line is reported rather than
      # quietly spread elsewhere.
      - name: Landed cost split math
        run: node v2/tests/unit/landed-cost-split.test.js

      # The underwriting extract reads v_po_arrival now; its own suite pins that
      # the lender-facing arrival months still measure the PO's TYPED plan, so a
      # PO with no arrival date stays a visible gap rather than a guessed date.
      - name: Underwriting sources
        run: node --test v2/underwriting/tests/*.test.mjs
