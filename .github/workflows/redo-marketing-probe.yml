name: Redo Marketing Probe

# Read-only diagnostic of Redo's GraphQL marketing reporting API, not a real
# sync -- see scripts/redo-marketing-probe.mjs. Manual trigger only. Uses the
# token already stored on redo_connections for the named company.
on:
  workflow_dispatch:
    inputs:
      # Required, no default: the probe reads one company's Redo credentials.
      company_entity_id:
        description: "Company UUID (required -- whose Redo connection to probe)"
        required: true
        type: string
      start:
        description: "Window start YYYY-MM-DD (default: 31 days ago)"
        required: false
        type: string
      end:
        description: "Window end YYYY-MM-DD (default: yesterday)"
        required: false
        type: string

jobs:
  probe-redo-marketing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Probe Redo marketing endpoints
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REDO_COMPANY_ENTITY_ID: ${{ inputs.company_entity_id }}
          PROBE_START: ${{ inputs.start }}
          PROBE_END: ${{ inputs.end }}
        run: node scripts/redo-marketing-probe.mjs
