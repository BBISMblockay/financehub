name: Report email sync

on:
  schedule:
    - cron: '15 7,13,19 * * *'
  workflow_dispatch: {}

concurrency:
  group: report-email-sync
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run due schedules
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REPORT_EMAIL_CRON_SECRET: ${{ secrets.REPORT_EMAIL_CRON_SECRET }}
        run: node scripts/report-email-sync.mjs
