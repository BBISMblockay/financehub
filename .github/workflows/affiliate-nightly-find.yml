name: Affiliate nightly Find
# Affiliate Studio, nightly: for every company that switched it on in
# Workspace Settings -> Billing, start one Find over its top unchecked
# customers (scripts/affiliate-nightly-find.mjs). The affiliate-research
# function does the work and stops at the company's own limits: customers per
# night, spend per night, and the monthly cap over all Affiliate Studio usage.
# Off for every company until its owner or admin turns it on. Since
# 20261125100000 it also starts nightly Discovery where that is switched on
# (one program a night, its own creators- and dollars-per-night).
#
# 13:15 UTC: after the Shopify sync (08:30 UTC, about two hours) has landed
# the previous day's customers, and before the 14:00 commissions run.
#
# No concurrency group (scripts/CLAUDE.md): an overlapping start joins the
# company's running Find instead of paying twice (the database allows one
# running scan per company), so a second run costs nothing, while a dropped
# run would skip a night.
on:
  schedule:
    - cron: '15 13 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  find:
    runs-on: ubuntu-latest
    environment: sync
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Start each company's nightly Find
        run: node scripts/affiliate-nightly-find.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
