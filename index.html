<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SILO</title>
  <meta name="description" content="Sales, inventory, purchasing, finance and marketing, in one workspace." />
  <script>
    // Decided before first paint. On get-silo.com a signed-out visitor sees
    // the small public page: Google's OAuth verification needs a home page
    // that says what the app is, links the privacy policy, and is not a
    // redirect to a login form. Everywhere else, and for an invite /
    // recovery link on any host, this page stays the auth router. A
    // signed-in visitor to get-silo.com is switched to the router by the
    // module below and sent into the app as before.
    (function () {
      var publicHost = /(^|\.)get-silo\.com$/i.test(location.hostname);
      var authHash = /access_token=|refresh_token=|type=(invite|recovery|magiclink|signup)/i.test(location.hash || '');
      document.documentElement.setAttribute('data-mode', publicHost && !authHash ? 'landing' : 'router');
    })();
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --accent: #2563eb;
      --danger: #991b1b;
      --dangerBg: #fef2f2;
      --dangerBorder: #fecaca;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
    }

    .card {
      width: min(460px, calc(100vw - 32px));
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .logo {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: #0f172a;
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 20px;
      letter-spacing: 0.02em;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.1;
    }

    p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .status {
      margin-top: 18px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #f8fafc;
      font-size: 14px;
      color: var(--text);
    }

    .status.error {
      background: var(--dangerBg);
      border-color: var(--dangerBorder);
      color: var(--danger);
    }

    .sub {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .status.error .sub { color: #7f1d1d; }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid #cbd5e1;
      border-top-color: var(--accent);
      border-radius: 50%;
      display: inline-block;
      vertical-align: -3px;
      margin-right: 10px;
      animation: spin 0.9s linear infinite;
    }

    .status.error .spinner { display: none; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .link {
      margin-top: 16px;
      display: none;
      font-size: 14px;
      line-height: 1.5;
    }

    .link a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
    }

    .link a:hover { text-decoration: underline; }

    .meta {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      display: none;
    }
    /* The router is the default: without the mode script (script disabled)
       no page can tell get-silo.com from silo-baseballism.com, so both keep
       the page they had before. Only a positive landing decision shows it. */
    html:not([data-mode="landing"]) body { display: grid; place-items: center; }
    html:not([data-mode="landing"]) #landing { display: none; }
    html[data-mode="landing"] #router { display: none; }

    /* ── Public landing (get-silo.com): the login page's brand panel, alone ── */
    #landing {
      --band: oklch(0.13 0.01 240); --band-hi: oklch(0.19 0.012 240);
      position: relative; min-height: 100vh; overflow: hidden; color: #fff;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background:
        radial-gradient(circle at 85% 8%, oklch(0.30 0.09 245 / .55) 0%, transparent 45%),
        radial-gradient(circle at 10% 95%, oklch(0.34 0.10 200 / .35) 0%, transparent 50%),
        linear-gradient(160deg, var(--band-hi) 0%, var(--band) 65%);
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 40px 24px; box-sizing: border-box;
    }
    #landing .lp-art { position: absolute; right: -110px; bottom: -110px; width: 420px; height: 420px; opacity: .08; pointer-events: none; }
    #landing .lp-top, #landing .lp-mid, #landing .lp-foot { position: relative; max-width: 560px; width: 100%; margin: 0 auto; }
    #landing .lp-top { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 16px; }
    #landing .lp-mark { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-weight: 700;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); }
    #landing h1 { font-size: clamp(34px, 6vw, 44px); font-weight: 800; line-height: 1.1; letter-spacing: -0.02em; margin: 0 0 16px; color: #fff; }
    #landing .lp-mid p { color: rgba(255,255,255,.62); font-size: 15px; line-height: 1.65; margin: 0 0 12px; }
    #landing .lp-signin { display: inline-block; margin-top: 16px; padding: 11px 22px; border-radius: 12px; background: #fff;
      color: oklch(0.15 0.012 240); font-weight: 700; font-size: 14px; text-decoration: none; }
    #landing .lp-signin:hover { background: rgba(255,255,255,.88); }
    #landing a:focus-visible { outline: 2px solid oklch(0.70 0.15 245); outline-offset: 3px; }
    #landing .lp-foot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px 20px; font-size: 12.5px; color: rgba(255,255,255,.4); }
    #landing .lp-foot nav { display: flex; gap: 18px; flex-wrap: wrap; }
    #landing .lp-foot a { color: rgba(255,255,255,.7); text-decoration: none; }
    #landing .lp-foot a:hover { color: #fff; text-decoration: underline; }
  </style>
</head>
<body>
  <div id="landing">
    <svg class="lp-art" viewBox="0 0 200 200" fill="none" aria-hidden="true">
      <circle cx="100" cy="100" r="96" stroke="white" stroke-width="1.4" />
      <path d="M42 16 Q104 100 42 184" stroke="white" stroke-width="1.4" stroke-dasharray="3 6" fill="none" />
      <path d="M158 16 Q96 100 158 184" stroke="white" stroke-width="1.4" stroke-dasharray="3 6" fill="none" />
    </svg>
    <div class="lp-top"><span class="lp-mark">S</span>SILO</div>
    <main class="lp-mid">
      <h1>Welcome to Silo.</h1>
      <p>Sales, inventory, purchasing, finance and marketing, in one workspace.</p>
      <a class="lp-signin" href="/pages/login.html">Sign in</a>
    </main>
    <footer class="lp-foot">
      <span>&copy; <span id="lpYear">2026</span> SILO</span>
      <nav aria-label="Legal">
        <a href="/legal/privacy.html">Privacy</a>
        <a href="mailto:support@get-silo.com">Contact</a>
      </nav>
    </footer>
  </div>

  <div class="card" id="router">
    <div class="brand">
      <div class="logo">S</div>
      <div>
        <h1>SILO</h1>
        <p>Preparing your access…</p>
      </div>
    </div>

    <div class="status" id="statusBox">
      <span class="spinner" id="spinner"></span>
      <span id="statusText">Checking your sign-in flow.</span>
      <div class="sub" id="subText">You will be redirected automatically.</div>
    </div>

    <div class="link" id="manualLink"></div>
    <div class="meta" id="debugMeta"></div>
  </div>

  <script src="/pages/config.js"></script>
  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const config = window.__SILO_CONFIG__ || {};
    const SUPABASE_URL = config.SUPABASE_URL;
    const SUPABASE_ANON_KEY = config.SUPABASE_ANON_KEY;

    const DEFAULT_APP_PAGE = "/v2/finance.html";
    const LOGIN_PAGE = "/pages/login.html";
    const SET_PASSWORD_PAGE = "/pages/set-password.html";

    const statusBox = document.getElementById("statusBox");
    const statusText = document.getElementById("statusText");
    const subText = document.getElementById("subText");
    const manualLink = document.getElementById("manualLink");
    const debugMeta = document.getElementById("debugMeta");

    function hasAuthHash(hash) {
      if (!hash) return false;
      const lower = hash.toLowerCase();
      return (
        lower.includes("access_token=") ||
        lower.includes("refresh_token=") ||
        lower.includes("type=invite") ||
        lower.includes("type=recovery") ||
        lower.includes("type=magiclink") ||
        lower.includes("type=signup")
      );
    }

    function showManualLink(label, url) {
      manualLink.style.display = "block";
      manualLink.innerHTML = `<a href="${url}">${label}</a>`;
    }

    function showDebug(message) {
      debugMeta.style.display = "block";
      debugMeta.textContent = message;
    }

    function setError(message, detail, linkLabel = "Go to login", linkUrl = LOGIN_PAGE) {
      statusBox.classList.add("error");
      statusText.textContent = message;
      subText.textContent = detail || "Use the link below to continue.";
      showManualLink(linkLabel, linkUrl);
    }

    function safePath(value) {
      const path = String(value || "").trim();
      if (!path) return "";

      // Keep redirects internal only.
      if (!path.startsWith("/")) return "";
      if (path.startsWith("//")) return "";

      // Prevent auth router/login loops.
      if (path === "/" || path === "/index.html") return "";
      if (path === LOGIN_PAGE) return "";

      return path;
    }

    function go(url, delay = 600) {
      setTimeout(() => {
        window.location.replace(url);
      }, delay);
    }

    function routeForProfile(profile) {
      const defaultPage = safePath(profile?.default_page);
      if (defaultPage) return defaultPage;

      // Every role and department lands on Finance, matching
      // ROUTE_BY_DEPARTMENT in pages/login.html. Until 2026-09-10 this
      // router still sent the ops, planning, marketing and retail
      // departments to root-level /ops.html, /planning.html,
      // /marketing.html and /retail.html — none of which exist — so an
      // already-signed-in user in one of those departments who opened the
      // site root got a 404 while the login page sent them to Finance.
      return DEFAULT_APP_PAGE;
    }

    async function getProfileRoute(supabase, userId) {
      if (!userId) return DEFAULT_APP_PAGE;

      const { data, error } = await supabase
        .from("profiles")
        .select("role, department, default_page, is_active")
        .eq("id", userId)
        .maybeSingle();

      if (error) {
        console.error("Profile lookup failed:", error);
        return DEFAULT_APP_PAGE;
      }

      if (data && data.is_active === false) {
        throw new Error("Your SILO account exists but is not active yet. Ask an admin to activate your profile.");
      }

      return routeForProfile(data || {});
    }

    // Landing mode: a signed-out visitor to get-silo.com stays on the public
    // page and nothing below may redirect them. A signed-in one is switched
    // to the router and routed exactly as before.
    const LANDING = document.documentElement.getAttribute("data-mode") === "landing";
    const year = document.getElementById("lpYear");
    if (year) year.textContent = String(new Date().getFullYear());

    async function init() {
      const hash = window.location.hash || "";

      // 1. Invite / recovery / magic link hash present.
      // Do not check session first here; password setup needs the hash preserved.
      if (hasAuthHash(hash)) {
        const setupUrl = `${SET_PASSWORD_PAGE}${hash}`;
        statusText.textContent = "Invite or password setup detected. Sending you to account setup.";
        subText.textContent = "Finish setup first, then continue into SILO.";
        showManualLink("Continue to setup", setupUrl);
        go(setupUrl);
        return;
      }

      // 2. Missing config should fail visibly instead of bouncing forever.
      if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
        if (LANDING) return;
        setError(
          "SILO config is missing.",
          "The page could not load /pages/config.js or the Supabase keys are unavailable.",
          "Go to login",
          LOGIN_PAGE
        );
        showDebug("Missing SUPABASE_URL or SUPABASE_ANON_KEY from window.__SILO_CONFIG__.");
        return;
      }

      try {
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const { data, error } = await supabase.auth.getSession();

        if (error) {
          console.error("Session check failed:", error);
          throw error;
        }

        // 3. Signed-in users go to app landing, not login and not department-access.
        if (data?.session?.user) {
          if (LANDING) document.documentElement.setAttribute("data-mode", "router");
          let target = DEFAULT_APP_PAGE;

          try {
            target = await getProfileRoute(supabase, data.session.user.id);
          } catch (profileErr) {
            setError(
              "Account access is not active.",
              profileErr?.message || "Your profile could not be validated.",
              "Go to login",
              LOGIN_PAGE
            );
            return;
          }

          target = safePath(target) || DEFAULT_APP_PAGE;

          statusText.textContent = "You are already signed in. Sending you to SILO.";
          subText.textContent = "Your session is active in this browser.";
          showManualLink("Continue to SILO", target);
          go(target);
          return;
        }

        // 4. No session -> login (on the public host: stay on the page).
        if (LANDING) return;
        statusText.textContent = "No active session found. Sending you to login.";
        subText.textContent = "Use your SILO email login to continue.";
        showManualLink("Go to login", LOGIN_PAGE);
        go(LOGIN_PAGE);
      } catch (err) {
        console.error("SILO auth router failed:", err);
        if (LANDING) return;
        setError(
          "Could not verify your session.",
          "This usually means the auth config or Supabase session check failed. Try login directly.",
          "Go to login",
          LOGIN_PAGE
        );
        showDebug(err?.message || String(err));
      }
    }

    init();
  </script>
</body>
</html>
