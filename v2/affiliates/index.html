<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>SILO · Affiliate Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../beacon.css" />
  <link rel="stylesheet" href="../silo-brand.css" />
  <script src="/pages/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script>
  <style>
    /* Affiliate Studio (af-) layout only; every colour and font is a Beacon token. */
    .af-panel[hidden] { display: none; }
    .af-share-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--bcn-border); }
    .af-share-row:first-of-type { border-top: 0; }
    .af-share-row img, .af-share-noimg { width: 72px; height: 72px; border-radius: 8px; object-fit: cover; flex: none; background: var(--bcn-bg); border: 1px solid var(--bcn-border); }
    .af-share-txt .af-muted { overflow: hidden; text-overflow: ellipsis; }
    /* "What your affiliates see": the shared items as the portal shows them. */
    .af-seen { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    .af-seen-item { border: 1px solid var(--bcn-border); border-radius: 10px; overflow: hidden; background: var(--bcn-surface); display: flex; flex-direction: column; }
    .af-seen-item img, .af-seen-none { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; background: var(--bcn-bg); }
    .af-seen-none { display: grid; place-items: center; padding: 12px; text-align: center; font-weight: 700; color: var(--bcn-ink-2); }
    .af-seen-body { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .af-seen-body .bcn-btn { margin-top: auto; align-self: flex-start; }
    .af-share-txt { flex: 1; min-width: 0; }
    .af-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .af-grid--wide { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
    .af-grid--settings { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 640px) { .af-grid--settings { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (min-width: 960px) { .af-grid--settings { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    .af-grid--settings .af-span-full { grid-column: 1 / -1; }
    .af-settings-block { margin-bottom: 18px; }
    .af-settings-block:last-child { margin-bottom: 0; }
    .af-settings-title { margin: 0 0 10px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--bcn-ink-2); font-family: var(--bcn-mono); }
    .af-settings-sub { margin: 12px 0 8px; font-size: 11px; color: var(--bcn-ink-3); }
    .af-settings-sub:first-child { margin-top: 0; }
    .af-settings-save { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 4px 0 16px; margin-bottom: 4px; border-bottom: 1px solid var(--bcn-border); }
    .af-checks--boxed { padding: 10px 12px; border: 1px solid var(--bcn-border); border-radius: 8px; background: var(--bcn-bg); }
    .af-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
    .af-row > .bcn-field-group { min-width: 140px; flex: 1; }
    .bcn-field-group[hidden] { display: none; }
    .af-stack { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
    .af-panel > .af-stack { gap: 16px; }
    .af-filter-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .af-filter-bar .bcn-btn { font-size: 12px; padding: 5px 10px; }
    .af-kv-line { font-size: 12px; color: var(--bcn-ink-2); margin-top: 4px; line-height: 1.45; }
    .af-scroll { overflow-x: auto; }
    .af-scroll table.bcn-table { table-layout: auto; min-width: 720px; }
    table.bcn-table td.af-num, table.bcn-table th.af-num { text-align: right; font-family: var(--bcn-mono); font-variant-numeric: tabular-nums; }
    .af-mono { font-family: var(--bcn-mono); font-size: 12px; }
    .af-muted { color: var(--bcn-ink-3); font-size: 12px; }
    .af-evidence { max-width: 360px; white-space: normal; color: var(--bcn-ink-2); font-size: 12px; }
    .af-actions { display: flex; gap: 4px; flex-wrap: wrap; }
    .af-label-verified { color: var(--bcn-pos); }
    .af-label-unconfigured, .af-label-not-measured { color: var(--bcn-neg); }
    .af-label-manual, .af-label-simulated { color: var(--bcn-ink-2); }
    .af-stage { font-family: var(--bcn-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
    .af-checks { display: flex; flex-wrap: wrap; gap: 10px; font-size: 13px; }
    .af-copy { word-break: break-all; }
    .af-next { margin: 12px 18px 0; padding: 0; border: 1px solid var(--bcn-border); border-radius: 10px; background: var(--bcn-surface); overflow: hidden; font-size: 13px; }
    .af-next[hidden] { display: none; }
    /* .silo-main is a scrolling flex column: a child with overflow:hidden would
       otherwise shrink to fit the window and cut off its own last rows. */
    .silo-main.af-studio > * { flex-shrink: 0; }
    .af-todo-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--bcn-border); background: var(--bcn-bg); }
    .af-todo-title { margin: 0; font-size: 14px; font-weight: 600; color: var(--bcn-ink); flex: 1; }
    .af-todo { list-style: none; margin: 0; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
    .af-todo-item { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--bcn-border); border-radius: 8px; background: var(--bcn-bg); }
    .af-todo-text { flex: 1; min-width: 0; line-height: 1.45; color: var(--bcn-ink); }
    .af-todo-acts { display: flex; gap: 6px; flex-shrink: 0; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .af-todo-none { margin: 0; padding: 14px; }
    .af-todo-how { margin: 0; border-top: 1px solid var(--bcn-border); }
    .af-todo-how > summary {
      list-style: none; cursor: pointer; padding: 10px 14px; font-size: 12px; font-weight: 500; color: var(--bcn-ink-2);
      background: var(--bcn-bg);
    }
    .af-todo-how > summary::-webkit-details-marker { display: none; }
    .af-todo-how[open] > summary { border-bottom: 1px solid var(--bcn-border); }
    .af-todo-how-body { margin: 0; padding: 10px 14px 12px; font-size: 11px; line-height: 1.5; color: var(--bcn-ink-3); }
    .af-more > summary { cursor: pointer; font-size: 13px; color: var(--bcn-ink-2); padding: 6px 0; list-style: revert; }
  /* Workflow rail: five steps map to the tabs, with counts when something needs you. */
    .af-pipeline { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 18px 12px; padding: 10px 12px; border: 1px solid var(--bcn-border); border-radius: 10px; background: var(--bcn-surface); }
    .af-pipeline[hidden] { display: none; }
    .af-pipe-step { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 120px; padding: 8px 10px; border: 1px solid var(--bcn-border); border-radius: 8px; background: var(--bcn-bg); cursor: pointer; font: inherit; text-align: left; transition: border-color .12s, background .12s; }
    .af-pipe-step:hover { border-color: var(--bcn-accent); }
    .af-pipe-step--on { border-color: var(--bcn-accent); background: var(--bcn-accent-soft); box-shadow: inset 3px 0 0 var(--bcn-accent); }
    .af-pipe-n { font-family: var(--bcn-mono); font-size: 10px; font-weight: 700; color: var(--bcn-ink-3); width: 1.4em; flex: none; }
    .af-pipe-step--on .af-pipe-n { color: var(--bcn-accent); }
    .af-pipe-label { flex: 1; font-size: 13px; font-weight: 600; color: var(--bcn-ink); min-width: 0; }
    .af-pipe-count { font-family: var(--bcn-mono); font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: var(--bcn-accent); color: #fff; flex: none; }
    .af-pipe-count--muted { background: var(--bcn-band); color: rgba(255, 255, 255, .85); }
    /* Card lists replace wide tables on workflow tabs. */
    .af-items { display: flex; flex-direction: column; gap: 8px; }
    .af-item { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; padding: 12px 14px; border: 1px solid var(--bcn-border); border-radius: 10px; background: var(--bcn-surface); }
    .af-item--compact { padding: 10px 12px; }
    .af-item-head { font-size: 14px; font-weight: 600; line-height: 1.35; }
    .af-item-stats { font-family: var(--bcn-mono); font-size: 12px; color: var(--bcn-ink-2); margin-top: 4px; }
    .af-item-detail { font-size: 12px; color: var(--bcn-ink-2); margin-top: 8px; line-height: 1.45; max-width: 52rem; }
    .af-item-detail .af-evidence { max-width: none; }
    .af-item-foot { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; flex-shrink: 0; }
    .af-item-pay .af-item-stats { font-size: 18px; font-weight: 700; color: var(--bcn-ink); }
    .af-board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: start; }
    @media (max-width: 900px) { .af-board { grid-template-columns: 1fr; } }
    .af-board-col { border: 1px solid var(--bcn-border); border-radius: 10px; background: var(--bcn-bg); padding: 10px; min-height: 80px; }
    .af-board-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--bcn-border); }
    .af-board-head h3 { margin: 0; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--bcn-ink-2); font-family: var(--bcn-mono); }
    .af-board-cards { display: flex; flex-direction: column; gap: 8px; }
    .af-board-empty { font-size: 12px; color: var(--bcn-ink-3); padding: 8px 4px; }
    .af-codes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .af-code-pill { font-family: var(--bcn-mono); font-size: 11px; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--bcn-border); background: var(--bcn-bg); }
    .af-item-more { margin-top: 6px; }
    .af-item-more > summary { cursor: pointer; font-size: 12px; color: var(--bcn-ink-3); list-style: none; }
    .af-item-more > summary::-webkit-details-marker { display: none; }
    .af-item-more[open] > summary { margin-bottom: 6px; }
    .af-kpis-off { display: none !important; }
    #tabs.af-tabs--workflow { margin: 0 18px 10px; flex-wrap: wrap; }
    #tabs.af-tabs--workflow .bcn-tab { font-size: 12px; padding: 6px 12px; }
    .af-ai-hub { margin: 0 18px 12px; }
    .af-ai-hub[hidden] { display: none; }
    .af-ai-status { display: flex; flex-direction: column; gap: 10px; margin: 12px 0; }
    .af-ai-status-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 14px; color: var(--bcn-ink); }
    .af-ai-status-row .af-wait { font-size: 12px; color: var(--bcn-ink-3); }
    .af-ai-note { margin: 8px 0 0; font-size: 11px; line-height: 1.45; }
    .af-ai-foot { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--bcn-border); }
    .af-ai-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .af-ai-actions--tight { margin-top: 6px; }
    .af-ai-hint { margin: 0; font-size: 13px; }
    .af-ai-hint > summary {
      list-style: none; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      padding: 6px 11px; border-radius: var(--bcn-radius);
      font-family: var(--bcn-font); font-size: 12.5px; font-weight: 500;
      color: var(--bcn-ink-2); background: var(--bcn-surface);
      border: 1px solid var(--bcn-border-strong);
      transition: background .12s ease, color .12s ease;
    }
    .af-ai-hint > summary:hover { background: var(--bcn-sunken); color: var(--bcn-ink); }
    .af-ai-hint > summary::-webkit-details-marker { display: none; }
    .af-ai-hint[open] { flex: 1 1 100%; }
    .af-ai-hint[open] > summary { margin-bottom: 8px; }
    .af-ai-hint-body { padding: 10px 12px; border: 1px solid var(--bcn-border); border-radius: 8px; background: var(--bcn-bg); }
    .af-ai-hint-body p { margin: 0 0 6px; }
    .af-ai-hint-body p:last-child { margin-bottom: 0; }
    .af-ai-hint-body .af-ai-actions { margin-top: 8px; }
    .af-ai-tab-hint { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
    .af-stack { gap: 16px; }
    .silo-main > .bcn-kpi-band + .bcn-tabs { margin-top: 0; }
    .silo-main > .af-panel { padding: 16px 18px 32px; }
    /* Modern workflow app shell (dashboard cards, not spreadsheet rows). */
    .silo-main.af-studio { background: linear-gradient(180deg, var(--bcn-bg) 0%, var(--bcn-surface) 42%, var(--bcn-bg) 100%); }
    .af-studio .bcn-header { margin: 0 18px; padding: 20px 0 8px; border-bottom: 0; }
    .af-studio .bcn-header-title h1 { font-size: 1.35rem; letter-spacing: -.02em; }
    .af-studio .af-panel .bcn-card {
      border: 1px solid color-mix(in srgb, var(--bcn-border) 88%, transparent);
      border-radius: 14px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 8px 24px rgba(15, 23, 42, .04);
      background: var(--bcn-surface);
      overflow: hidden;
    }
    .af-studio .bcn-card-header { padding: 14px 16px 10px; border-bottom: 1px solid var(--bcn-border); background: color-mix(in srgb, var(--bcn-bg) 55%, var(--bcn-surface)); }
    .af-studio .bcn-card-header h2 { font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
    .af-studio .bcn-card-body { padding: 14px 16px 16px; }
    .af-studio .af-card-hero .bcn-card-body { padding: 18px 18px 20px; background: linear-gradient(135deg, color-mix(in srgb, var(--bcn-accent-soft) 70%, var(--bcn-surface)) 0%, var(--bcn-surface) 58%); }
    .af-studio .af-card-hero .af-row { align-items: stretch; gap: 12px; }
    .af-studio .af-card-hero .bcn-field { min-height: 44px; border-radius: 12px; }
    .af-studio .af-next, .af-studio .af-pipeline, .af-studio .af-ai-hub { margin-left: 18px; margin-right: 18px; box-shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 6px 18px rgba(15, 23, 42, .04); border-radius: 14px; }
    .af-studio .af-todo-item { border-radius: 12px; box-shadow: 0 1px 2px rgba(15, 23, 42, .03); }
    .af-studio .af-pipeline { gap: 8px; padding: 8px; background: var(--bcn-surface); }
    .af-studio .af-pipe-step { border-radius: 12px; border-color: transparent; background: var(--bcn-bg); box-shadow: inset 0 0 0 1px var(--bcn-border); }
    .af-studio .af-pipe-step--on { box-shadow: inset 0 0 0 1px var(--bcn-accent), 0 4px 14px color-mix(in srgb, var(--bcn-accent) 18%, transparent); background: var(--bcn-accent-soft); }
    .af-studio #tabs.af-tabs--workflow {
      margin: 0 18px 14px; padding: 5px; gap: 4px;
      border-radius: 14px; border: 1px solid var(--bcn-border);
      background: color-mix(in srgb, var(--bcn-bg) 70%, var(--bcn-surface));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5);
    }
    .af-studio #tabs.af-tabs--workflow .bcn-tab {
      border: none; border-radius: 10px; background: transparent;
      padding: 8px 14px; font-weight: 600;
      box-shadow: none;
    }
    .af-studio #tabs.af-tabs--workflow .bcn-tab--active {
      background: var(--bcn-surface);
      box-shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 4px 12px rgba(15, 23, 42, .05);
      color: var(--bcn-ink);
    }
    .af-studio .af-filter-bar {
      gap: 8px; margin-bottom: 14px; padding: 6px;
      border-radius: 12px; background: var(--bcn-bg); border: 1px solid var(--bcn-border);
    }
    .af-studio .af-filter-chip {
      border-radius: 999px;
      padding: 8px 14px;
      font-weight: 600;
      border: 1px solid var(--bcn-border-strong);
      background: var(--bcn-surface);
      box-shadow: 0 1px 2px rgba(15, 23, 42, .05);
    }
    .af-studio .af-filter-chip:hover { background: var(--bcn-sunken); }
    .af-studio .af-filter-chip--on,
    .af-studio .af-filter-chip.bcn-btn--primary {
      background: var(--bcn-accent);
      color: #fff;
      border-color: var(--bcn-accent);
      box-shadow: 0 2px 10px color-mix(in srgb, var(--bcn-accent) 24%, transparent);
    }
    .af-studio .af-filter-chip.bcn-btn--primary .af-mono { color: inherit; opacity: .92; }
    /* No invisible controls: ghost reads as surfaced inside Studio panels. */
    .af-studio .af-panel .bcn-btn--ghost:not(.bcn-btn--danger),
    .af-studio .af-next .bcn-btn--ghost:not(.bcn-btn--danger),
    .af-studio .af-ai-hub .bcn-btn--ghost:not(.bcn-btn--danger),
    .af-studio .bcn-header-actions .bcn-btn--ghost {
      background: var(--bcn-surface);
      color: var(--bcn-ink);
      border: 1px solid var(--bcn-border-strong);
      box-shadow: 0 1px 2px rgba(15, 23, 42, .04);
    }
    .af-studio .af-panel .bcn-btn--ghost:not(.bcn-btn--danger):hover,
    .af-studio .af-next .bcn-btn--ghost:not(.bcn-btn--danger):hover,
    .af-studio .af-ai-hub .bcn-btn--ghost:not(.bcn-btn--danger):hover,
    .af-studio .bcn-header-actions .bcn-btn--ghost:hover {
      background: var(--bcn-sunken);
      color: var(--bcn-ink);
    }
    .af-studio #tabs.af-tabs--workflow .bcn-tab:not(.bcn-tab--active) {
      background: var(--bcn-surface);
      border: 1px solid var(--bcn-border);
      color: var(--bcn-ink-2);
      box-shadow: 0 1px 2px rgba(15, 23, 42, .03);
    }
    .af-studio .af-catalog-foot .bcn-btn,
    .af-studio .af-item-foot .bcn-btn {
      min-height: 34px;
      border: 1px solid var(--bcn-border-strong);
      background: var(--bcn-surface);
      box-shadow: 0 1px 2px rgba(15, 23, 42, .04);
    }
    .af-studio .af-catalog-foot .bcn-btn--primary,
    .af-studio .af-item-foot .bcn-btn--primary {
      background: var(--bcn-accent);
      color: #fff;
      border-color: var(--bcn-accent);
    }
    .af-items--grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 18px;
    }
    .af-item--tile {
      flex-direction: column; align-items: stretch; gap: 0;
      padding: 0; border-radius: 16px; overflow: hidden;
      border: 1px solid var(--bcn-border);
      box-shadow: 0 2px 4px rgba(15, 23, 42, .04), 0 12px 28px rgba(15, 23, 42, .06);
      transition: transform .14s ease, box-shadow .14s ease;
    }
    /* Affiliato-style product cards: thumb + title, Summary block, Sales/Amount rows. */
    .af-item--catalog { padding: 16px 16px 14px; gap: 12px; }
    .af-catalog-head { display: flex; gap: 12px; align-items: flex-start; }
    .af-catalog-thumb {
      flex: none; width: 72px; height: 72px; border-radius: 12px;
      display: grid; place-items: center; overflow: hidden;
      background: linear-gradient(145deg, var(--bcn-accent-soft), var(--bcn-bg));
      border: 1px solid var(--bcn-border);
    }
    .af-catalog-thumb .bcn-avatar, .af-catalog-thumb .af-avatar {
      width: 72px; height: 72px; font-size: 22px; border-radius: 12px;
      box-shadow: none; border: none;
    }
    .af-catalog-thumb > * { grid-area: 1 / 1; }
    .af-catalog-thumb .af-avatar-photo { width: 72px; height: 72px; object-fit: cover; border-radius: 12px; }
    .af-catalog-title { flex: 1; min-width: 0; }
    .af-catalog-name { font-size: 15px; font-weight: 700; line-height: 1.3; color: var(--bcn-ink); }
    .af-catalog-name a { color: inherit; text-decoration: none; }
    .af-catalog-name a:hover { color: var(--bcn-accent); }
    .af-catalog-sub { font-size: 12px; color: var(--bcn-ink-2); margin-top: 2px; }
    .af-catalog-meta { font-size: 12px; font-weight: 600; color: var(--bcn-ink); margin-top: 6px; }
    .af-catalog-head > .bcn-pill { flex: none; align-self: flex-start; }
    .af-catalog-summary { padding-top: 4px; }
    .af-catalog-summary-h {
      margin: 0 0 6px; font-size: 13px; font-weight: 700; color: var(--bcn-ink);
    }
    .af-catalog-summary-p {
      margin: 0; font-size: 12px; line-height: 1.5; color: var(--bcn-ink-3);
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .af-catalog-stats { display: flex; flex-direction: column; gap: 10px; margin-top: 2px; }
    .af-catalog-stat {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      font-size: 12px; color: var(--bcn-ink-2);
    }
    .af-catalog-stat-lbl { font-weight: 500; }
    .af-catalog-stat-val { font-family: var(--bcn-mono); font-size: 13px; font-weight: 700; color: var(--bcn-ink); }
    .af-catalog-stat-val--up .af-catalog-up { color: var(--bcn-pos); font-size: 12px; }
    .af-catalog-stat-barwrap {
      display: flex; align-items: center; gap: 10px; flex: 1; justify-content: flex-end; max-width: 58%;
    }
    .af-catalog-bar {
      flex: 1; height: 6px; border-radius: 999px; background: var(--bcn-bg);

    }
    .af-catalog-bar-fill {
      display: block; height: 100%; border-radius: 999px;

    .af-catalog-stat-num { font-family: var(--bcn-mono); font-size: 11px; font-weight: 600; color: var(--bcn-ink); white-space: nowrap; }
    .af-catalog-more { margin: 0; }
    .af-catalog-foot {

    .af-studio .af-item--tile:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(15, 23, 42, .06), 0 14px 28px rgba(15, 23, 42, .07); }
    .af-item-top {
      display: flex; gap: 14px; align-items: center;
      padding: 14px 14px 12px;

      border-bottom: 1px solid var(--bcn-border);

    .af-item-top .bcn-avatar.bcn-avatar--lg,
    .af-item-top .af-avatar {
      width: 56px; height: 56px; font-size: 18px; font-weight: 700;
      border-radius: 14px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, .1);
    }
    .af-platform-tag {
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
      color: var(--bcn-accent); font-family: var(--bcn-mono);
    }
    .af-item-main { flex: 1; min-width: 0; }
    .af-item-metric {
      margin: 0 14px; padding: 10px 12px; border-radius: 10px;
      background: color-mix(in srgb, var(--bcn-bg) 80%, var(--bcn-surface));
      border: 1px solid var(--bcn-border);
      font-family: var(--bcn-mono); font-size: 13px; font-weight: 600; color: var(--bcn-ink);
    }
    .af-item-metric .af-muted { font-family: var(--bcn-font); font-weight: 400; font-size: 11px; margin-top: 2px; }
    .af-item--tile .af-item-more { margin: 8px 14px 0; }
    .af-item--tile .af-item-foot {
      margin-top: auto; padding: 12px 14px 14px;
      border-top: 1px solid var(--bcn-border);
      background: color-mix(in srgb, var(--bcn-bg) 45%, var(--bcn-surface));
    }
    .af-item--tile .af-codes { margin-top: 8px; }
    .af-avatar {
      flex: none; width: 44px; height: 44px; border-radius: 12px;
      display: grid; place-items: center; font-weight: 700; font-size: 15px;
      color: var(--bcn-accent); background: var(--bcn-accent-soft);
      border: 1px solid color-mix(in srgb, var(--bcn-accent) 22%, var(--bcn-border));
    }
    .af-item-avatar.bcn-avatar { flex: none; border-radius: 12px; }
    .af-share-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px; margin-top: 8px;
    }
    .af-studio .af-share-card {
      display: flex; flex-direction: column; gap: 10px;
      padding: 12px; border-radius: 14px;
      border: 1px solid var(--bcn-border);
      background: var(--bcn-surface);
      box-shadow: 0 1px 2px rgba(15, 23, 42, .04);
      height: 100%;
    }
    .af-studio .af-share-card img, .af-studio .af-share-card .af-share-noimg {
      width: 100%; height: auto; aspect-ratio: 16 / 10; border-radius: 10px;
    }
    .af-studio .af-share-card .af-share-txt { flex: 1; }
    .af-studio .af-board-col { border-radius: 14px; box-shadow: inset 0 0 0 1px var(--bcn-border); }
    .af-items--grid .af-item--pay { border-radius: 14px; box-shadow: 0 6px 18px rgba(15, 23, 42, .05); }
    @media (max-width: 720px) {
      .af-items--grid { grid-template-columns: 1fr; }
      .af-studio .af-item--tile:hover { transform: none; }
    }
