<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>SILO · Affiliate Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../beacon.css" />
  <link rel="stylesheet" href="../silo-brand.css" />
  <script src="/pages/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script>
  <style>
    /* Affiliate Studio (af-) layout only; every colour and font is a Beacon token. */
    .af-panel[hidden] { display: none; }
    .af-panel > .af-stack + .af-stack:not(:empty) { margin-top: 24px; }
    .af-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .af-grid--wide { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
    .af-grid--settings { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 640px) { .af-grid--settings { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (min-width: 960px) { .af-grid--settings { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    .af-grid--settings .af-span-full { grid-column: 1 / -1; }
    .af-settings-block { margin-bottom: 18px; }
    .af-settings-block:last-child { margin-bottom: 0; }
    .af-settings-title { margin: 0 0 10px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--bcn-ink-2); font-family: var(--bcn-mono); }
    /* Setup as a settings page (2026-11-13): two columns of cards, one row
       per setting, chips instead of dropdowns, saved as you go. */
    .af-settings { position: relative; display: grid; grid-template-columns: 1fr; gap: 16px; align-items: start; }
    @media (min-width: 1080px) { .af-settings { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
    .af-settings-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    .af-set-saved { position: absolute; top: -30px; right: 0; font-family: var(--bcn-mono); font-size: 11px; color: var(--bcn-pos); }
    .af-set-row { display: grid; grid-template-columns: minmax(120px, 34%) minmax(0, 1fr); gap: 14px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--bcn-border); }
    .af-set-row:last-child, .af-seed-dep:last-child .af-set-row { border-bottom: 0; }
    .af-set-row[hidden], .af-seed-dep[hidden] { display: none; }
    .af-set-label { font-size: 13px; font-weight: 600; color: var(--bcn-ink-2); }
    .af-set-ctl { min-width: 0; }
    .af-set-input { width: 100%; }
    textarea.af-set-input { min-height: 120px; resize: vertical; }
    .af-set-unit { display: flex; align-items: center; gap: 8px; }
    .af-set-unit .af-set-input { max-width: 7.5rem; font-family: var(--bcn-mono); }
    .af-set-unit span { font-size: 12px; color: var(--bcn-ink-3); }
    .af-set-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .af-set-tags span { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--bcn-sunken); color: var(--bcn-ink-2); }
    .af-seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: 10px; background: var(--bcn-sunken); border: 1px solid var(--bcn-border); }
    .af-seg-btn { font: inherit; font-size: 12.5px; font-weight: 600; padding: 6px 12px; border: 0; border-radius: 8px; background: transparent; color: var(--bcn-ink-3); cursor: pointer; transition: background .12s, color .12s; }
    .af-seg-btn:hover:not(:disabled) { color: var(--bcn-ink); }
    .af-seg-btn.is-on { background: var(--bcn-surface); color: var(--bcn-ink); box-shadow: var(--bcn-shadow); }
    .af-seg-btn:disabled { cursor: not-allowed; }
    .af-chips-tog { display: flex; flex-wrap: wrap; gap: 6px; }
    .af-chip-tog { font: inherit; font-size: 12.5px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--bcn-border-strong); background: var(--bcn-surface); color: var(--bcn-ink-2); cursor: pointer; transition: background .12s, border-color .12s, color .12s; }
    .af-chip-tog.is-on { background: var(--bcn-accent-soft); border-color: var(--bcn-accent-border); color: var(--bcn-accent); font-weight: 600; }
    .af-chip-tog:disabled { cursor: not-allowed; opacity: .7; }
    @media (max-width: 560px) { .af-set-row { grid-template-columns: 1fr; gap: 6px; } }
    .af-settings-sub { margin: 12px 0 8px; font-size: 11px; color: var(--bcn-ink-3); }
    .af-settings-sub:first-child { margin-top: 0; }
    .af-settings-save { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 4px 0 16px; margin-bottom: 4px; border-bottom: 1px solid var(--bcn-border); }
    .af-checks--boxed { padding: 10px 12px; border: 1px solid var(--bcn-border); border-radius: 8px; background: var(--bcn-bg); }
    .af-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
    .af-row > .bcn-field-group { min-width: 140px; flex: 1; }
    .bcn-field-group[hidden] { display: none; }
    .af-stack { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
    /* A flex box needs this or `hidden` does nothing, which is how the
       People sub-tabs showed both lists at once (Blake 2026-11-20). */
    .af-stack[hidden] { display: none; }
    .af-panel > .af-stack { gap: 16px; }
    .af-filter-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .af-filter-bar .bcn-btn { font-size: 12px; padding: 5px 10px; }
    .af-kv-line { font-size: 12px; color: var(--bcn-ink-2); margin-top: 4px; line-height: 1.45; }
    .af-scroll { overflow-x: auto; }
    .af-scroll table.bcn-table { table-layout: auto; min-width: 720px; }
    table.bcn-table td.af-num, table.bcn-table th.af-num { text-align: right; font-family: var(--bcn-mono); font-variant-numeric: tabular-nums; }
    .af-mono { font-family: var(--bcn-mono); font-size: 12px; }
    .af-muted { color: var(--bcn-ink-3); font-size: 12px; }
    .af-evidence { max-width: 360px; white-space: normal; color: var(--bcn-ink-2); font-size: 12px; }
    .af-actions { display: flex; gap: 4px; flex-wrap: wrap; }
    .af-label-verified { color: var(--bcn-pos); }
    .af-label-unconfigured, .af-label-not-measured { color: var(--bcn-neg); }
    .af-label-manual, .af-label-simulated, .af-label-waiting { color: var(--bcn-ink-2); }
    .af-stage { font-family: var(--bcn-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
    .af-checks { display: flex; flex-wrap: wrap; gap: 10px; font-size: 13px; }
    .af-copy { word-break: break-all; }
    .af-next { margin: 12px 18px 0; padding: 0; border: 1px solid var(--bcn-border); border-radius: 10px; background: var(--bcn-surface); overflow: hidden; font-size: 13px; }
    .af-next[hidden] { display: none; }
    /* .silo-main is a scrolling flex column: a child with overflow:hidden would
       otherwise shrink to fit the window and cut off its own last rows. The
       To do strip that first hit this is gone, so no child clips today and
       nothing in the suite can prove the rule -- it stays as insurance for the
       next child that does, and the mutation that used to pin it was dropped
       rather than left passing for the wrong reason. */
    .silo-main.af-studio > * { flex-shrink: 0; }
    .af-todo-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--bcn-border); background: var(--bcn-bg); }
    .af-todo-title { margin: 0; font-size: 14px; font-weight: 600; color: var(--bcn-ink); flex: 1; }
    .af-todo { list-style: none; margin: 0; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
    .af-todo-item { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--bcn-border); border-radius: 8px; background: var(--bcn-bg); }
    .af-todo-text { flex: 1; min-width: 0; line-height: 1.45; color: var(--bcn-ink); }
    .af-todo-acts { display: flex; gap: 6px; flex-shrink: 0; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .af-todo-none { margin: 0; padding: 14px; }
    .af-auto { display: flex; flex-direction: column; }
    .af-auto-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 2px; border-bottom: 1px solid var(--bcn-border); font-size: 13px; color: var(--bcn-ink); }
    .af-auto-row:last-child { border-bottom: 0; }
    .af-toggle { position: relative; width: 40px; height: 22px; flex-shrink: 0; border-radius: 999px; border: 1px solid var(--bcn-border-strong); background: var(--bcn-bg); cursor: pointer; padding: 0; transition: background .15s; }
    .af-toggle i { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--bcn-surface); box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: left .15s; }
    .af-toggle--on { background: var(--bcn-pos); border-color: var(--bcn-pos); }
    .af-toggle--on i { left: 20px; }
    .af-toggle:disabled { opacity: .5; cursor: not-allowed; }
    .af-toggle:focus-visible { outline: 2px solid var(--bcn-accent); outline-offset: 2px; }
  /* Workflow rail: five steps map to the tabs, with counts when something needs you. */
    .af-pipeline { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 18px 12px; padding: 10px 12px; border: 1px solid var(--bcn-border); border-radius: 10px; background: var(--bcn-surface); }
    .af-pipeline[hidden] { display: none; }
    .af-pipe-step { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 120px; padding: 8px 10px; border: 1px solid var(--bcn-border); border-radius: 8px; background: var(--bcn-bg); cursor: pointer; font: inherit; text-align: left; transition: border-color .12s, background .12s; }
    .af-pipe-step:hover { border-color: var(--bcn-accent); }
    .af-pipe-step--on { border-color: var(--bcn-accent); background: var(--bcn-accent-soft); box-shadow: inset 3px 0 0 var(--bcn-accent); }
    .af-pipe-n { font-family: var(--bcn-mono); font-size: 10px; font-weight: 700; color: var(--bcn-ink-3); width: 1.4em; flex: none; }
    .af-pipe-step--on .af-pipe-n { color: var(--bcn-accent); }
    .af-pipe-label { flex: 1; font-size: 13px; font-weight: 600; color: var(--bcn-ink); min-width: 0; }
    .af-pipe-count { font-family: var(--bcn-mono); font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: var(--bcn-accent); color: #fff; flex: none; }
    .af-pipe-count--muted { background: var(--bcn-band); color: rgba(255, 255, 255, .85); }
    /* Card lists replace wide tables on workflow tabs. */
    .af-items { display: flex; flex-direction: column; gap: 8px; }
    .af-item { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; padding: 12px 14px; border: 1px solid var(--bcn-border); border-radius: 10px; background: var(--bcn-surface); }
    .af-item--compact { padding: 10px 12px; }
    .af-item-head { font-size: 14px; font-weight: 600; line-height: 1.35; }
    .af-item-stats { font-family: var(--bcn-mono); font-size: 12px; color: var(--bcn-ink-2); margin-top: 4px; }
    .af-item-detail { font-size: 12px; color: var(--bcn-ink-2); margin-top: 8px; line-height: 1.45; max-width: 52rem; }
    .af-item-detail .af-evidence { max-width: none; }
    /* Open sections in place of fold-outs (Blake 2026-11-13). */
    .af-section { border-top: 1px solid var(--bcn-border); padding-top: 14px; margin-top: 14px; }
    .af-item--tile .af-catalog-why { margin: 8px 14px 0; }
    .af-catalog-why .af-evidence { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .af-seed-prog { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 12px; }
    .af-seed-bar { flex: 1; max-width: 320px; height: 8px; border-radius: 999px; background: var(--bcn-sunken); overflow: hidden; }
    .af-seed-bar i { display: block; height: 100%; border-radius: 999px; background: var(--bcn-pos); }
    .af-item-foot { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; flex-shrink: 0; }
    .af-item-pay .af-item-stats { font-size: 18px; font-weight: 700; color: var(--bcn-ink); }
    .af-board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: start; }
    @media (max-width: 900px) { .af-board { grid-template-columns: 1fr; } }
    .af-board-col { border: 1px solid var(--bcn-border); border-radius: 10px; background: var(--bcn-bg); padding: 10px; min-height: 80px; }
    .af-board-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--bcn-border); }
    .af-board-head h3 { margin: 0; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--bcn-ink-2); font-family: var(--bcn-mono); }
    .af-board-cards { display: flex; flex-direction: column; gap: 8px; }
    .af-board-empty { font-size: 12px; color: var(--bcn-ink-3); padding: 8px 4px; }
    /* Queues: tick rows, then act on the ticked ones. */
    .af-q { display: flex; flex-direction: column; gap: 8px; }
    .af-q-bar { align-items: center; margin-bottom: 8px; }
    .af-q-all { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .af-q-row { display: flex; align-items: flex-start; gap: 10px; }
    .af-q-row > .af-q-pick { margin-top: 14px; flex: none; }
    .af-q-body { flex: 1; min-width: 0; }
    .af-q-row.is-selected .af-item { box-shadow: inset 0 0 0 2px var(--bcn-accent); }
    .af-content-media { display: block; max-width: 100%; max-height: 160px; border-radius: 8px; background: var(--bcn-band); }
    .af-codes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .af-steps { display: grid; gap: 4px; margin-top: 8px; }
    .af-step { gap: 6px; font-size: 12px; align-items: center; }
    .af-step .bcn-btn { padding: 2px 8px; font-size: 12px; }
    .af-code-pill { font-family: var(--bcn-mono); font-size: 11px; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--bcn-border); background: var(--bcn-bg); }
    .af-kpis-off { display: none !important; }
    /* Suite tabs: beacon .bcn-tabs underline bar — no pill override. */
    .af-studio > #tabs.bcn-tabs { margin: 0; width: 100%; flex-shrink: 0; }
    .af-ai-hub { margin: 0 18px 12px; }
    .af-ai-hub[hidden] { display: none; }
    .af-ai-status { display: flex; flex-direction: column; gap: 10px; margin: 12px 0; }
    .af-ai-status-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 14px; color: var(--bcn-ink); }
    .af-ai-status-row .af-wait { font-size: 12px; color: var(--bcn-ink-3); }
    .af-ai-note { margin: 8px 0 0; font-size: 11px; line-height: 1.45; }
    .af-ai-foot { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--bcn-border); }
    .af-ai-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .af-ai-actions--tight { margin-top: 6px; }
    .af-ai-tab-hint { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
    .af-stack { gap: 16px; }
    .af-stack--pinched { gap: 12px; }
    .af-surface { margin: 0; }
    .af-surface-head {
      display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
      padding: 0 2px 10px; margin-bottom: 12px; border-bottom: 1px solid var(--bcn-border);
    }
    .af-surface-head h2 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
    .af-surface-body { padding: 0 2px; }
    .af-studio.af-stack--pinched .af-panel .bcn-card { box-shadow: none; }
    .af-pay-sub { margin: 0 0 12px; padding: 0 2px; min-height: 36px; border-bottom: 1px solid var(--bcn-border); background: transparent; }
    .silo-main > .bcn-kpi-band + .bcn-tabs { margin-top: 0; }
    .silo-main > .af-panel { padding: 16px 18px 32px; }
    /* Modern workflow app shell (dashboard cards, not spreadsheet rows). */
    .silo-main.af-studio { background: linear-gradient(180deg, var(--bcn-bg) 0%, var(--bcn-surface) 42%, var(--bcn-bg) 100%); }
    .af-studio .bcn-header { margin: 0 18px; padding: 20px 0 8px; border-bottom: 0; }
    .af-studio.af-studio--ready .bcn-header { padding: 12px 0 4px; }
    .af-studio.af-studio--ready .bcn-header-sub { display: none; }
    .af-studio.af-studio--workflow .bcn-header { padding-bottom: 0; margin-bottom: 0; }
    .af-studio.af-studio--workflow > #tabs.bcn-tabs { margin-top: 0; }
    .af-studio.af-studio--workflow > .af-panel { padding-top: 8px; }
    .af-studio .bcn-header-title h1 { font-size: 1.35rem; letter-spacing: -.02em; }
    .af-workflow-h { margin: 0 0 10px; padding: 0 2px; font-size: 1.05rem; font-weight: 700; letter-spacing: -.02em; scroll-margin-top: 12px; }
    .af-find-inline { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin-bottom: 12px; }
    .af-find-inline > .bcn-field-group { flex: 1 1 220px; min-width: 0; }
    .af-list-foot { margin-top: 12px; display: flex; justify-content: center; }
    .af-tab-count {
      margin-left: 4px; font-family: var(--bcn-mono); font-size: 11px; font-weight: 600;
      color: var(--bcn-ink-3);
    }
    .bcn-tab--active .af-tab-count { color: var(--bcn-ink-2); }
    .af-studio .af-panel .bcn-card {
      border: 1px solid color-mix(in srgb, var(--bcn-border) 88%, transparent);
      border-radius: 14px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 8px 24px rgba(15, 23, 42, .04);
      background: var(--bcn-surface);
      overflow: hidden;
    }
    .af-studio .bcn-card-header { padding: 14px 16px 10px; border-bottom: 1px solid var(--bcn-border); background: color-mix(in srgb, var(--bcn-bg) 55%, var(--bcn-surface)); }
    .af-studio .bcn-card-header h2 { font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
    .af-studio .bcn-card-body { padding: 14px 16px 16px; }
    .af-studio .af-card-hero .bcn-card-body { padding: 18px 18px 20px; background: linear-gradient(135deg, color-mix(in srgb, var(--bcn-accent-soft) 70%, var(--bcn-surface)) 0%, var(--bcn-surface) 58%); }
    .af-studio .af-card-hero .af-row { align-items: stretch; gap: 12px; }
    .af-studio .af-card-hero .bcn-field { min-height: 44px; border-radius: 12px; }
    .af-studio .af-next, .af-studio .af-pipeline, .af-studio .af-ai-hub { margin-left: 18px; margin-right: 18px; box-shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 6px 18px rgba(15, 23, 42, .04); border-radius: 14px; }
    .af-studio .af-todo-item { border-radius: 12px; box-shadow: 0 1px 2px rgba(15, 23, 42, .03); }
    .af-studio .af-pipeline { gap: 8px; padding: 8px; background: var(--bcn-surface); }
    .af-studio .af-pipe-step { border-radius: 12px; border-color: transparent; background: var(--bcn-bg); box-shadow: inset 0 0 0 1px var(--bcn-border); }
    .af-studio .af-pipe-step--on { box-shadow: inset 0 0 0 1px var(--bcn-accent), 0 4px 14px color-mix(in srgb, var(--bcn-accent) 18%, transparent); background: var(--bcn-accent-soft); }
    .af-studio .af-filter-bar {
      gap: 8px; margin-bottom: 14px; padding: 6px;
      border-radius: 12px; background: var(--bcn-bg); border: 1px solid var(--bcn-border);
    }
    /* Two kinds of control, one look each (Blake 2026-11-20: "they all need
       to flow and look similar"). Moving between lists is always the underline
       bar `.af-subtabs`, the same one People uses. Narrowing the list you are
       already on is always this pill -- never the accent colour, which on a
       filter read as a third style competing with the tabs above it. */
    .af-studio .af-filter-chip {
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--bcn-ink-2);
      border: 1px solid var(--bcn-border);
      background: var(--bcn-surface);
      box-shadow: none;
    }
    .af-studio .af-filter-chip:hover { background: var(--bcn-sunken); }
    .af-studio .af-filter-chip--on,
    .af-studio .af-filter-chip.bcn-btn--primary {
      background: var(--bcn-ink);
      color: var(--bcn-surface);
      border-color: var(--bcn-ink);
      box-shadow: none;
    }
    .af-studio .af-filter-chip.bcn-btn--primary .af-mono { color: inherit; opacity: .92; }
    /* No invisible controls: ghost reads as surfaced inside Studio panels. */
    .af-studio .af-panel .bcn-btn--ghost:not(.bcn-btn--danger),
    .af-studio .af-next .bcn-btn--ghost:not(.bcn-btn--danger),
    .af-studio .af-ai-hub .bcn-btn--ghost:not(.bcn-btn--danger),
    .af-studio .bcn-header-actions .bcn-btn--ghost {
      background: var(--bcn-surface);
      color: var(--bcn-ink);
      border: 1px solid var(--bcn-border-strong);
      box-shadow: 0 1px 2px rgba(15, 23, 42, .04);
    }
    .af-studio .af-panel .bcn-btn--ghost:not(.bcn-btn--danger):hover,
    .af-studio .af-next .bcn-btn--ghost:not(.bcn-btn--danger):hover,
    .af-studio .af-ai-hub .bcn-btn--ghost:not(.bcn-btn--danger):hover,
    .af-studio .bcn-header-actions .bcn-btn--ghost:hover {

      border-radius: 99px; padding: 2px 7px;
    }
    .af-ov-delta--up { background: var(--bcn-pos-soft); color: var(--bcn-pos); }
    .af-ov-delta--down { background: var(--bcn-neg-soft); color: var(--bcn-neg); }
    .af-ov-delta--flat { background: var(--bcn-sunken); color: var(--bcn-ink-3); }
    .af-ov-spark { display: block; width: calc(100% + 30px); margin: 8px -15px 0; height: 46px; }
    .af-ov-spark .af-ov-ln { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .af-ov-spark .af-ov-ar { stroke: none; opacity: .18; }
    .af-ov-spark circle { stroke: none; }
    .af-ov-spark--accent .af-ov-ln { stroke: var(--bcn-accent); }
    .af-ov-spark--accent .af-ov-ar, .af-ov-spark--accent circle { fill: var(--bcn-accent); }
    .af-ov-spark--pos .af-ov-ln { stroke: var(--bcn-pos); }
    .af-ov-spark--pos .af-ov-ar, .af-ov-spark--pos circle { fill: var(--bcn-pos); }
    .af-ov-spark--warn .af-ov-ln { stroke: var(--bcn-warn); }
    .af-ov-spark--warn .af-ov-ar, .af-ov-spark--warn circle { fill: var(--bcn-warn); }

    .af-studio .af-ov-band {
      background: var(--bcn-band); border: 1px solid var(--bcn-border-strong);
      border-radius: 14px; padding: 13px 16px;
      display: flex; flex-wrap: wrap; gap: 12px 26px; align-items: center;
    }
    .af-ov-band .af-ov-bi { min-width: 0; }
    .af-ov-band .af-ov-bl {
      font-size: 10.5px; font-weight: 600; letter-spacing: .07em;
      text-transform: uppercase; color: var(--bcn-band-ink-2);
    }
    .af-ov-band .af-ov-bv {
      font-family: var(--bcn-mono); font-size: 15px; font-weight: 600;
      color: var(--bcn-band-ink); margin-top: 2px;
    }
    .af-ov-band .af-ov-bv button {
      font-family: var(--bcn-mono); font-size: 15px; font-weight: 600;
      background: none; border: 0; padding: 0; cursor: pointer;
      color: var(--bcn-band-ink); border-bottom: 1px dotted var(--bcn-band-ink-2);
    }
    .af-ov-band .af-ov-bsep { flex: 1; }

    .af-ov-cols {
      display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
      gap: 14px; align-items: start;
    }
    .af-ov-cols > div { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

    .af-ov-lb { display: flex; flex-direction: column; }
    .af-ov-lb-row {
      display: grid; grid-template-columns: 20px 34px minmax(0, 1fr) 92px 74px 56px;
      gap: 12px; align-items: center; padding: 10px 0;
      border-bottom: 1px solid var(--bcn-border);
    }
    .af-ov-lb-row:last-child { border-bottom: 0; }
    .af-ov-rk { font-family: var(--bcn-mono); font-size: 12px; color: var(--bcn-ink-3); text-align: right; }
    .af-ov-who { min-width: 0; }
    .af-ov-who .af-ov-nm {
      font-size: 13px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .af-ov-who .af-ov-hd {
      font-size: 11.5px; color: var(--bcn-ink-3); margin-top: 1px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .af-ov-bar {
      height: 5px; border-radius: 99px; background: var(--bcn-sunken);
      overflow: hidden; margin-top: 6px;
    }
    .af-ov-bar i { display: block; height: 100%; border-radius: 99px; background: var(--bcn-accent); }
    .af-ov-money {
      font-family: var(--bcn-mono); font-size: 13px; font-weight: 600; text-align: right;
    }
    .af-ov-money span {
      display: block; font-family: var(--bcn-font); font-size: 11px;
      font-weight: 400; color: var(--bcn-ink-3); margin-top: 2px;
    }
    .af-ov-when { font-family: var(--bcn-mono); font-size: 11.5px; color: var(--bcn-ink-3); text-align: right; }
    .af-ov-avatar { display: grid; width: 34px; height: 34px; }
    .af-ov-avatar > * { grid-area: 1 / 1; }
    .af-ov-avatar > *, .af-ov-avatar .af-avatar-photo {
      width: 34px; height: 34px; font-size: 12.5px;
      border-radius: 99px; object-fit: cover; box-shadow: none; border: none;
    }

    .af-ov-ro { display: flex; flex-direction: column; }
    .af-ov-ro-row {
      display: flex; gap: 10px; align-items: flex-start; padding: 11px 0;
      border-bottom: 1px solid var(--bcn-border);
    }
    .af-ov-ro-row:last-child { border-bottom: 0; }
    .af-ov-dot { flex: none; width: 7px; height: 7px; border-radius: 99px; margin-top: 6px; }
    .af-ov-dot--quiet { background: var(--bcn-warn); }
    .af-ov-dot--drop { background: var(--bcn-neg); }
    .af-ov-dot--never { background: var(--bcn-ink-4); }
    .af-ov-dot--rise { background: var(--bcn-pos); }
    .af-ov-dot--stuck { background: var(--bcn-accent); }
    .af-ov-ro-b { flex: 1; min-width: 0; }
    .af-ov-ro-top { display: flex; gap: 7px; align-items: baseline; flex-wrap: wrap; }
    .af-ov-ro-top .af-ov-nm { font-size: 13px; font-weight: 600; }
    .af-ov-why { font-size: 12px; color: var(--bcn-ink-2); margin-top: 3px; line-height: 1.45; }
    .af-ov-why b { font-family: var(--bcn-mono); font-weight: 600; color: var(--bcn-ink); }
    .af-ov-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
    .af-ov-chart svg { display: block; width: 100%; height: auto; }
    .af-ov-chart .af-ov-grid { stroke: var(--bcn-border); stroke-width: 1; }
    .af-ov-chart .af-ov-axis { stroke: var(--bcn-border-strong); stroke-width: 1; }
    .af-ov-chart .af-ov-tick { font-family: var(--bcn-mono); font-size: 10.5px; fill: var(--bcn-ink-3); }
    .af-ov-chart .af-ov-bc { fill: var(--bcn-accent); }
    .af-ov-legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 11.5px; color: var(--bcn-ink-3); }
    .af-ov-legend i {
      display: inline-block; width: 9px; height: 9px; border-radius: 2px;
      margin-right: 6px; vertical-align: -1px;
    }
    @media (max-width: 1080px) {
      .af-ov-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .af-ov-cols { grid-template-columns: minmax(0, 1fr); }
      /* One column: what needs a press comes before the charts. */
      .af-ov-cols > div:last-child { order: -1; }
    }
    @media (max-width: 620px) {
      .af-ov-metrics { grid-template-columns: minmax(0, 1fr); }
      .af-ov-lb-row { grid-template-columns: 18px 34px minmax(0, 1fr) 80px; row-gap: 4px; }
      .af-ov-lb-row .af-ov-when, .af-ov-lb-row .af-ov-money--comm { display: none; }
    }

    /* Posts from affiliates: a tile big enough to judge the post by. */
    .af-ctile { display: flex; gap: 12px; align-items: flex-start; width: 100%; }
    .af-ctile-media {
      width: 108px; height: 108px; flex: none; border-radius: 10px; overflow: hidden;
      display: grid; place-items: center; background: var(--bcn-bg); border: 1px solid var(--bcn-border);
    }
    .af-ctile-media .af-content-media { width: 100%; height: 100%; max-height: none; object-fit: cover; border-radius: 0; }
    .af-ctile-media--none { font-family: var(--bcn-mono); font-size: 11px; color: var(--bcn-ink-3); }
    .af-ctile-txt { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .af-ctile-who { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .af-ctile-who .af-item-avatar { width: 26px; height: 26px; font-size: 10px; }
    @media (max-width: 620px) {
      .af-ctile-media { width: 84px; height: 84px; }
    }

    /* People: Affiliates / Discovery. */
    .af-subtabs { margin: 0 0 14px; }

    /* Adding or editing in the middle of the screen. */
    dialog.af-dialog {
      border: 1px solid var(--bcn-border); border-radius: 12px; padding: 0;
      width: min(640px, 94vw); max-height: 88vh; background: var(--bcn-surface); color: var(--bcn-ink);
    }
    dialog.af-dialog::backdrop { background: rgba(0, 0, 0, .38); }
    dialog.af-dialog .bcn-card-body { max-height: 72vh; overflow: auto; }
    .af-dialog-foot { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }

    /* One short line, with the detail on hover instead of in the copy. */
    .af-info {
      display: inline-grid; place-items: center; width: 15px; height: 15px; margin-left: 5px;
      border: 1px solid var(--bcn-border); border-radius: 50%; vertical-align: -2px;
      font-size: 10px; font-weight: 700; color: var(--bcn-ink-3); cursor: help; background: var(--bcn-bg);
    }

    /* Any dates, not just the last 30 or 90 days. */
    .af-range { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .af-range input[type="date"] {
      height: 28px; padding: 0 8px; font-size: 11.5px; font-family: var(--bcn-mono);
      border: 1px solid var(--bcn-border); border-radius: var(--bcn-radius);
      background: var(--bcn-surface); color: var(--bcn-ink);
    }
    .af-range-sep { color: var(--bcn-ink-3); font-size: 11.5px; }
    /* ── Density (Blake 2026-11-20: "everything looks a bit large", "tiles are
       way large", "each tab should almost fit on one page", "still looks not
       pro enough"). One pass over the whole suite: smaller type, tighter
       padding, flatter surfaces. Colours and fonts stay Beacon's. ── */
    .af-studio { background: var(--bcn-bg); }
    .silo-main > .af-panel { padding: 10px 18px 24px; }
    .af-studio .bcn-header { padding: 14px 0 4px; }
    .af-studio.af-studio--ready .bcn-header { padding: 10px 0 2px; }
    .af-studio .bcn-header-title h1 { font-size: 1.15rem; }
    .af-studio .af-panel .bcn-card {
      border-radius: 10px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, .04);
    }
    .af-studio .bcn-card-header { padding: 9px 13px 8px; }
    .af-studio .bcn-card-header h2 { font-size: 13.5px; }
    .af-studio .bcn-card-body { padding: 10px 13px 12px; }
    .af-studio .af-card-hero .bcn-card-body { padding: 12px 13px 14px; background: var(--bcn-surface); }
    .af-studio .af-card-hero .bcn-field { min-height: 36px; border-radius: 8px; }
    .af-studio .af-next, .af-studio .af-pipeline, .af-studio .af-ai-hub { border-radius: 10px; box-shadow: 0 1px 2px rgba(15, 23, 42, .04); }
    .af-surface-head { padding-bottom: 7px; margin-bottom: 9px; }
    .af-surface-head h2 { font-size: 13.5px; }
    .af-workflow-h { font-size: .95rem; margin-bottom: 8px; }
    .af-stack { gap: 10px; }
    .af-panel > .af-stack { gap: 12px; }
    .af-panel > .af-stack + .af-stack:not(:empty) { margin-top: 16px; }
    .af-subtabs { margin-bottom: 4px; }
    /* Rows: the list view is the one that has to fit on a page. */
    .af-items { gap: 6px; }
    .af-item { padding: 9px 12px; gap: 10px; border-radius: 8px; }
    .af-item--compact { padding: 7px 10px; }
    .af-item-head { font-size: 13px; }
    .af-item-stats { font-size: 11.5px; margin-top: 2px; }
    .af-item-detail { font-size: 11.5px; margin-top: 5px; }
    .af-kv-line { font-size: 11.5px; margin-top: 2px; }
    .af-muted, .af-mono { font-size: 11.5px; }
    .af-studio table.bcn-table th, .af-studio table.bcn-table td { padding: 6px 10px; font-size: 12.5px; }
    .af-list-who { min-width: 150px; gap: 8px; }
    .af-list-thumb, .af-list-thumb .bcn-avatar, .af-list-thumb .af-avatar, .af-list-thumb .af-avatar-photo { width: 28px; height: 28px; font-size: 11px; border-radius: 6px; }
    /* Tiles: same card, two thirds the size. */
    .af-items--grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
    .af-item--tile { border-radius: 10px; box-shadow: 0 1px 2px rgba(15, 23, 42, .04); }
    .af-item--catalog { padding: 11px 12px 10px; gap: 8px; }
    .af-catalog-head { gap: 9px; }
    .af-catalog-thumb, .af-catalog-thumb .bcn-avatar, .af-catalog-thumb .af-avatar, .af-catalog-thumb .af-avatar-photo { width: 44px; height: 44px; border-radius: 9px; font-size: 15px; }
    .af-catalog-name { font-size: 13.5px; }
    .af-catalog-sub, .af-catalog-meta { font-size: 11.5px; }
    .af-catalog-summary-h { font-size: 12px; margin-bottom: 3px; }
    .af-catalog-summary-p { font-size: 11.5px; -webkit-line-clamp: 2; }
    .af-catalog-why .af-evidence { -webkit-line-clamp: 2; font-size: 11.5px; }
    .af-catalog-stats { gap: 6px; }
    .af-catalog-stat { font-size: 11.5px; }
    .af-catalog-foot { padding-top: 8px; }
    .af-item--tile .af-catalog-why { margin: 6px 12px 0; }
    /* Content: a gallery row is a row, not a poster. */
    .af-ctile-media { width: 72px; height: 54px; }
    .af-content-media { max-height: 110px; }
    /* Whatever the markup around it, a post's photo or video is bounded by its
       row. An affiliate uploads at any size, and one that sizes itself tears
       the row open (Blake 2026-11-20).
       The media is taken out of flow to do it: a percentage height on a grid
       item does NOT resolve against the grid area for a replaced element, so
       `height: 100%` on an undecoded <video> left it at its 300x150 default
       and 150px tall inside a 54px tile. Positioned against the box, the
       percentages resolve and nothing can escape it (Blake 2026-11-21). */
    .af-studio .af-ctile-media { position: relative; }
    .af-studio .af-ctile-media > img, .af-studio .af-ctile-media > video {
      position: absolute; inset: 0; width: 100%; height: 100%;
      max-width: 100%; max-height: 100%; object-fit: cover;
    }
    @media (max-width: 640px) { .af-ctile-media { width: 60px; height: 45px; } }
    /* Dashboard: the four figures and the chart fit above the fold. */
    .af-ov { gap: 10px; }
    .af-ov-metrics { gap: 10px; }
    .af-studio .af-ov-metric { border-radius: 10px; padding: 10px 12px 0; }
    .af-ov-metric .af-ov-val { font-size: 21px; margin-top: 4px; }
    .af-ov-metric .af-ov-foot { margin-top: 4px; }
    .af-ov-spark { height: 34px; width: calc(100% + 24px); margin: 6px -12px 0; }
    .af-studio .af-ov-band { border-radius: 10px; padding: 9px 13px; }
    .af-ov-chart svg { max-height: 220px; }
    .af-ov-cols { gap: 10px; }
  </style>
  <link rel="stylesheet" href="../beacon-mirrors-unified.css" />
  <link rel="stylesheet" href="../v2-mobile.css" />
  <script src="../v2-shell.js" defer></script>
</head>
<body class="silo-brand">
<div class="silo-app" id="silo-app">
  <main class="silo-main af-studio">
    <header class="bcn-header">
      <div style="flex:1;min-width:0;">
        <div class="bcn-header-title"><h1>Affiliate Studio</h1></div>
        <div class="bcn-header-sub bcn-header-sub--trimmed">Find creators, invite them, track their codes and pay their commission.</div>
      </div>
      <div class="bcn-header-actions">
        <select class="bcn-field" id="programSel" aria-label="Program" style="min-width:200px;"></select>
        <button class="bcn-btn bcn-btn--primary" id="btnNewProgram" hidden>+ New program</button>
      </div>
    </header>

    <div class="bcn-status" id="status" hidden></div>

    <div class="bcn-kpi-band" id="kpis"></div>

    <nav class="bcn-tabs" id="tabs" role="tablist" aria-label="Affiliate Studio sections">
      <!-- People first: it is where the work starts, so it is what opens
           (Blake 2026-11-20). The program's numbers sit one along. -->
      <button type="button" class="bcn-tab bcn-tab--active" role="tab" aria-selected="true" data-tab="people" id="tab-people">People</button>
      <button type="button" class="bcn-tab" role="tab" aria-selected="false" data-tab="overview" id="tab-overview">Program</button>
      <button type="button" class="bcn-tab" role="tab" aria-selected="false" data-tab="comms" id="tab-comms">Outreach</button>
      <button type="button" class="bcn-tab" role="tab" aria-selected="false" data-tab="share" id="tab-share">Share</button>
      <button type="button" class="bcn-tab" role="tab" aria-selected="false" data-tab="payouts" id="tab-payouts">Money</button>
      <button type="button" class="bcn-tab" role="tab" aria-selected="false" data-tab="program" id="tab-program">Setup</button>
      <button type="button" class="bcn-tab" role="tab" aria-selected="false" data-tab="records" id="tab-records">Records</button>
    </nav>

    <section class="af-panel" data-panel="overview"><div class="af-ov" id="overviewBody"></div></section>
    <!-- People: everyone in the programme on one page -- the affiliates, the
         creators not in yet, and the messages waiting on them. They were three
         tabs; moving between them was most of the clicking. -->
    <section class="af-panel" data-panel="people" hidden>
      <!-- Two jobs, two sub-tabs (Blake 2026-11-20): the affiliates already in
           the programme, and discovery -- the creators who are not. -->
      <nav class="bcn-tabs af-subtabs" id="peopleSubtabs" role="tablist" aria-label="People">
        <button type="button" class="bcn-tab bcn-tab--active" role="tab" aria-selected="true" data-act="people-sub" data-k="discovery">Discovery</button>
        <button type="button" class="bcn-tab" role="tab" aria-selected="false" data-act="people-sub" data-k="affiliates">Affiliates</button>
      </nav>
      <div class="af-stack" id="affiliatesBody"></div>
      <div class="af-stack af-stack--pinched" id="prospectsBody"></div>
    </section>
    <!-- Comms: every message to a creator or an affiliate, prepped and
         approved in queues, plus the template they start from. -->
    <section class="af-panel" data-panel="comms" hidden><div class="af-stack" id="outreachBody"></div></section>
    <section class="af-panel" data-panel="share" hidden><div class="af-stack" id="shareBody"></div></section>
    <section class="af-panel af-money" data-panel="payouts" hidden><div class="af-stack af-stack--pinched" id="payoutsBody"></div></section>
    <!-- Setup: the programme's own settings, and what it shares. -->
    <section class="af-panel" data-panel="program" hidden>
      <div class="af-stack" id="programBody"></div>
    </section>
    <section class="af-panel" data-panel="records" hidden><div class="af-stack" id="recordsBody"></div></section>
  </main>
</div>

<!-- Adding or editing a person happens in the middle of the screen, not in a
     form that opens at the top of a long list (Blake 2026-11-20). studio.js
     fills the body and opens it with showModal(). -->
<dialog class="af-dialog" id="afDialog" aria-labelledby="afDialogTitle">
  <div class="bcn-card" style="margin:0;border:0">
    <div class="bcn-card-header"><h2 id="afDialogTitle">&nbsp;</h2><button class="bcn-btn bcn-btn--ghost" type="button" data-act="dialog-close">Close</button></div>
    <div class="bcn-card-body" id="afDialogBody"></div>
  </div>
</dialog>

<script src="../nav-config.js"></script>
<script src="../avatar.js"></script>
<script src="../silo-chrome.js"></script>
<script type="module" src="studio.js"></script>
</body>
</html>
