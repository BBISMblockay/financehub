<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>Affiliate portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../beacon.css" />
  <link rel="stylesheet" href="../silo-brand.css" />
  <script src="/pages/config.js"></script>
  <style>
    /* Affiliate-facing page: no SILO chrome, no internal navigation. Beacon tokens only. */
    body { background: var(--bcn-bg); }
    .af-wrap { max-width: 1160px; margin: 0 auto; padding: 24px 20px 64px; display: flex; flex-direction: column; gap: 18px; }
    .af-terms { max-height: 420px; overflow-y: auto; border: 1px solid var(--bcn-border); padding: 12px 14px; background: var(--bcn-surface); font-size: 14px; line-height: 1.55; }
    .af-num { font-family: var(--bcn-mono); font-variant-numeric: tabular-nums; }
    .af-muted { color: var(--bcn-ink-3); font-size: 13px; }
    .af-copy { word-break: break-all; font-family: var(--bcn-mono); font-size: 12px; }
    .af-form { display: flex; flex-direction: column; gap: 10px; }
    .af-hp { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
    .af-brand { display: flex; align-items: center; gap: 12px; }
    .af-logo { height: 40px; width: auto; max-width: 200px; object-fit: contain; border-radius: 8px; display: block; }
    .af-badge { width: 40px; height: 40px; border-radius: 10px; background: var(--bcn-ink); color: var(--bcn-surface); display: grid; place-items: center; font-weight: 700; font-size: 18px; flex: none; }
    .af-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .af-top h1 { font-size: 20px; margin: 0; }

    /* Dashboard: a hero, the numbers, then the feed beside the account. */
    .af-dash { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
    .af-dash > .af-span { grid-column: 1 / -1; }
    .af-main, .af-side { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
    @media (max-width: 900px) { .af-dash { grid-template-columns: 1fr; } }
    .af-panel { background: var(--bcn-surface); border: 1px solid var(--bcn-border); border-radius: 16px; padding: 20px; box-shadow: var(--bcn-shadow); }
    .af-panel h2 { font-size: 17px; margin: 0 0 14px; color: var(--bcn-ink); }
    .af-hero { background: var(--bcn-band); color: var(--bcn-band-ink); border-radius: 18px; padding: 24px 26px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: center; }
    @media (max-width: 700px) { .af-hero { grid-template-columns: 1fr; } }
    .af-hero h2 { margin: 0 0 6px; font-size: 24px; color: var(--bcn-band-ink); }
    .af-hero .af-sub { color: var(--bcn-band-ink-2); font-size: 14px; }
    .af-hero .af-copy { color: var(--bcn-band-ink-2); }
    .af-hero-link { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; min-width: 0; max-width: 460px; }
    .af-code { font-family: var(--bcn-mono); font-weight: 600; border: 1px dashed currentColor; border-radius: 8px; padding: 2px 10px; }
    .af-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
    @media (max-width: 700px) { .af-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .af-stat { background: var(--bcn-surface); border: 1px solid var(--bcn-border); border-radius: 16px; padding: 16px 18px; box-shadow: var(--bcn-shadow); }
    .af-stat-label { color: var(--bcn-ink-3); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
    .af-stat-value { font-family: var(--bcn-mono); font-size: 26px; font-weight: 600; color: var(--bcn-ink); margin-top: 6px; font-variant-numeric: tabular-nums; }
    .af-stat--pos .af-stat-value { color: var(--bcn-pos); }
    .af-stat-sub { color: var(--bcn-ink-3); font-size: 12px; margin-top: 4px; }
    .af-chip .bcn-pill { align-self: flex-start; }

    /* The feed: what the brand shared, each with the affiliate's own link. */
    .af-feed { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .af-item { border: 1px solid var(--bcn-border); border-radius: 14px; background: var(--bcn-surface); overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--bcn-shadow); }
    .af-media { position: relative; aspect-ratio: 4 / 3; background: var(--bcn-sunken); }
    .af-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .af-media-none { width: 100%; height: 100%; display: flex; align-items: flex-end; padding: 12px; font-weight: 700; font-size: 15px; line-height: 1.25; color: var(--bcn-band-ink); background: linear-gradient(160deg, var(--bcn-band-hi), var(--bcn-band)); }
    .af-tag { position: absolute; top: 10px; left: 10px; background: var(--bcn-surface); color: var(--bcn-ink); font-family: var(--bcn-mono); font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; box-shadow: var(--bcn-shadow); }
    .af-item-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .af-item-title { font-weight: 700; color: var(--bcn-ink); font-size: 14px; line-height: 1.35; }
    .af-item-note { color: var(--bcn-ink-2); font-size: 13px; line-height: 1.45; white-space: pre-line; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .af-item-date { font-family: var(--bcn-mono); font-size: 12px; color: var(--bcn-accent); font-weight: 600; }
    .af-item-acts { margin-top: auto; display: flex; flex-wrap: wrap; gap: 6px; padding-top: 6px; }
    .af-feed-head { font-weight: 700; color: var(--bcn-ink); margin: 6px 0 12px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; }
    .af-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .af-filter { border: 1px solid var(--bcn-border); background: var(--bcn-surface); color: var(--bcn-ink-2); border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
    .af-filter.is-on { background: var(--bcn-ink); border-color: var(--bcn-ink); color: var(--bcn-surface); }
    .af-item[hidden] { display: none; }

    /* Calendar: what drops when, soonest first, each with the rep's link. */
    .af-cal { display: flex; flex-direction: column; }
    .af-cal-month { font-family: var(--bcn-mono); font-size: 12px; font-weight: 600; color: var(--bcn-ink-3); text-transform: uppercase; letter-spacing: .06em; margin: 12px 0 6px; }
    .af-cal-month:first-child { margin-top: 0; }
    .af-cal-row { display: grid; grid-template-columns: 54px 132px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--bcn-border); }
    .af-cal-row:last-child { border-bottom: 0; }
    .af-cal-date { border: 1px solid var(--bcn-border); border-radius: 10px; text-align: center; padding: 4px 0; font-family: var(--bcn-mono); line-height: 1.1; }
    .af-cal-date .af-cal-day { display: block; font-size: 20px; font-weight: 600; color: var(--bcn-ink); text-transform: none; }
    .af-cal-date > span:first-child { font-size: 11px; color: var(--bcn-accent); font-weight: 600; text-transform: uppercase; }
    .af-cal-row.is-soon .af-cal-date { border-color: var(--bcn-accent); }
    .af-cal-thumb { width: 132px; height: 99px; border-radius: 10px; object-fit: cover; display: block; background: var(--bcn-sunken); }
    .af-cal-thumb-none { width: 132px; height: 99px; border-radius: 10px; background: linear-gradient(160deg, var(--bcn-band-hi), var(--bcn-band)); }
    .af-cal-text { min-width: 0; }
    .af-cal-title { font-weight: 700; color: var(--bcn-ink); font-size: 15px; }
    .af-cal-note { color: var(--bcn-ink-3); font-size: 13px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    @media (max-width: 560px) { .af-cal-row { grid-template-columns: 54px minmax(0, 1fr); } .af-cal-thumb, .af-cal-thumb-none { grid-column: 2; width: 100%; height: auto; aspect-ratio: 4 / 3; } .af-cal-text, .af-cal-row .bcn-btn { grid-column: 2; } .af-cal-row .bcn-btn { justify-self: start; } .af-cal-date { align-self: start; } }

    /* Account side: codes as chips, earnings as bars, payouts as rows. */
    .af-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .af-chip { border: 1px solid var(--bcn-border); border-radius: 12px; padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; }
    .af-chip-code { font-family: var(--bcn-mono); font-size: 15px; color: var(--bcn-ink); }
    .af-bars { display: flex; flex-direction: column; gap: 10px; }
    .af-bar-row { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13px; }
    .af-bar { height: 10px; border-radius: 999px; background: var(--bcn-sunken); overflow: hidden; }
    .af-bar > span { display: block; height: 100%; background: var(--bcn-accent); border-radius: 999px; }
    .af-rows { display: flex; flex-direction: column; }
    .af-rows > div { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--bcn-border); font-size: 13px; }
    .af-rows > div:last-child { border-bottom: 0; }
    .af-links { display: flex; flex-direction: column; gap: 8px; }

    /* Brand switcher: a rep who reps more than one brand. */
    .af-switch { position: relative; }
    .af-switch-btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--bcn-border); background: var(--bcn-surface); color: var(--bcn-ink); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
    .af-switch-btn::after { content: '▾'; color: var(--bcn-ink-3); }
    .af-switch-menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; min-width: 240px; background: var(--bcn-surface); border: 1px solid var(--bcn-border); border-radius: 14px; box-shadow: var(--bcn-shadow); padding: 6px; display: flex; flex-direction: column; gap: 2px; }
    .af-switch-menu[hidden] { display: none; }
    .af-switch-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none; color: var(--bcn-ink); border-radius: 10px; padding: 8px 10px; font: inherit; font-size: 14px; cursor: pointer; }
    .af-switch-item:hover:not(:disabled) { background: var(--bcn-sunken); }
    .af-switch-item:disabled { cursor: default; color: var(--bcn-ink-3); }
    .af-switch-item .af-logo { height: 22px; max-width: 70px; }
    .af-switch-item .af-badge { width: 22px; height: 22px; font-size: 11px; border-radius: 6px; }
    .af-switch-prog { color: var(--bcn-ink-3); font-size: 12px; margin-left: auto; }
  </style>
</head>
<body class="silo-brand">
<main class="af-wrap">
  <header class="af-top"><div class="af-brand"><span id="mark"></span><h1 id="title">Affiliate portal</h1></div><div class="af-brand"><span class="af-switch" id="switch"></span><span class="af-muted" id="who"></span></div></header>
  <div class="bcn-status" id="status" hidden></div>
  <div id="hero"></div>
  <div class="af-stats" id="kpis" hidden></div>
  <div id="body"><div class="af-panel">Loading…</div></div>
  <p class="af-muted">Run by the brand using SILO. This page is personal to you.</p>
</main>
<script type="module">
import { $, esc, call, setStatus, takeToken, brandMark, wireBrandMark } from './public.js';
import { formatMoney } from './studio-core.js';
const token = takeToken('silo_affiliate_portal');
const card = (title, html) => `<div class="af-panel"><h2>${esc(title)}</h2>${html}</div>`;
const empty = (t) => `<div class="bcn-empty">${esc(t)}</div>`;
const day = (s) => (s ? String(s).slice(0, 10) : '');

// No password: a rep signs in with the email the brand has on file and gets
// a fresh link there. The answer never says whether the email is known.
const signInForm = () => `<form class="af-form" id="signin" novalidate>
    <div class="bcn-field-group"><label class="bcn-label" for="siEmail">Your email</label>
    <input class="bcn-field" id="siEmail" type="email" autocomplete="email" required maxlength="254" /></div>
    <button class="bcn-btn bcn-btn--primary" type="submit" id="siGo">Email me a sign-in link</button></form>`;
function wireSignIn() {
  $('signin').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    $('siGo').disabled = true;
    try { const r = await call('signin', { email: $('siEmail').value }); setStatus(r.message, 'pos'); }
    catch (e) { setStatus(e.message, 'neg'); $('siGo').disabled = false; }
  });
}
// `intro` replaces the standard line when the rep arrived here for a reason
// of their own, so the page answers the question they actually asked.
function signIn(intro) {
  $('body').innerHTML = card('Sign in', `<p>${intro ? esc(intro) : "Enter the email you joined with. We'll send you a link."}</p>${signInForm()}`);
  $('kpis').hidden = true;
  $('hero').innerHTML = '';
  wireSignIn();
}

function expired() {
  $('body').innerHTML = card('This link has expired', `<p>We can email you a new one.</p>
    <button class="bcn-btn bcn-btn--primary" id="renew">Email me a new link</button>
    <p class="af-muted">Or sign in with your email.</p>${signInForm()}`);
  wireSignIn();
  $('renew').addEventListener('click', async () => {
    $('renew').disabled = true;
    try { const r = await call('renew', { token }); setStatus(r.message, 'pos'); }
    catch (e) { setStatus(e.message, 'neg'); $('renew').disabled = false; }
  });
}

async function load() {
  if (!token) return signIn();
  let r;
  try { r = await call('resolve', { token }); }
  catch (e) { if (e.status === 404) return expired(); $('body').innerHTML = card('Something went wrong', `<p>${esc(e.message)}</p>`); return; }
  if (r.purpose === 'signup') { location.replace(`join.html?t=${encodeURIComponent(token)}`); return; }
  $('title').textContent = `${r.brand} affiliate portal`;
  $('mark').innerHTML = brandMark(r.brand, r.brand_logo);
  wireBrandMark($('mark'));
  const st = await call('statement', { token });
  const s = st.statement || {};
  const cur = s.currency; const m = (c) => formatMoney(c, cur); const t = s.totals || {};
  const kpi = (l, v, cls = '', sub = '') => `<div class="af-stat ${cls}"><div class="af-stat-label">${esc(l)}</div><div class="af-stat-value">${v}</div>${sub ? `<div class="af-stat-sub">${esc(sub)}</div>` : ''}</div>`;
  const known = (v) => v !== null && v !== undefined;
  $('kpis').innerHTML = (known(t.sales_cents) ? kpi('Sales you drove', m(t.sales_cents), '', `${esc(t.orders ?? 0)} orders`) : kpi('Orders', esc(t.orders ?? 0)))
    + kpi('Earned', m(t.earned_cents), 'af-stat--pos', rateText(r.program?.commission, cur)) + kpi('Paid to you', m(t.paid_cents)) + kpi('Coming to you', m(t.unclaimed_cents));
  $('kpis').hidden = false;
  const name = String(s.affiliate?.display_name || r.affiliate?.display_name || '').split(' ')[0];
  $('who').textContent = name ? `Signed in as ${s.affiliate?.display_name || r.affiliate?.display_name}` : '';
  $('hero').innerHTML = heroCard(st.feed, name, r.brand, s.affiliate?.status);

  const codes = s.codes || [];
  const links = (s.links || []).map((l) => { let u = l.link || l.destination_url; if (!l.link) { try { const x = new URL(l.destination_url); for (const k of ['utm_source', 'utm_medium', 'utm_campaign']) if (l[k]) x.searchParams.set(k, l[k]); u = x.toString(); } catch {} } return u; });
  const monthly = s.monthly || [];
  const top = Math.max(1, ...monthly.map((x) => Math.abs(Number(x.amount_cents) || 0)));
  const side = [
    card('Your codes', codes.length ? `<div class="af-chips">${codes.map((c) => `<div class="af-chip"><span class="af-chip-code">${esc(c.code)}</span>${codeState(c, t.today)}<span class="af-muted">${esc(day(c.starts_on))} → ${esc(day(c.ends_on) || 'open')}</span></div>`).join('')}</div>` : empty('No code yet. The brand will send one.')),
    links.length ? card('Your links', `<div class="af-links">${links.map((u) => `<span class="af-copy">${esc(u)}</span>`).join('')}</div>`) : '',
    card('Earnings by month', monthly.length ? `<div class="af-bars">${monthly.map((x) => `<div class="af-bar-row"><span class="af-num">${esc(x.month)}</span><div class="af-bar"><span style="width:${Math.max(2, Math.round(Math.abs(Number(x.amount_cents) || 0) / top * 100))}%"></span></div><span class="af-num">${m(x.amount_cents)}</span></div>`).join('')}</div>` : empty('No earnings yet. Share your link to start.')),
    card('Payouts', (s.payouts || []).length ? `<div class="af-rows">${s.payouts.map((p) => `<div><span class="af-num">${m(p.amount_cents)}</span><span>${esc(p.status === 'marked_paid' ? `paid ${day(p.marked_paid_at)}` : p.status)}</span></div>`).join('')}</div>` : empty('No payouts yet.')),
    `<p class="af-muted">Terms v${esc(s.affiliate?.terms_version_accepted ?? '—')}, accepted ${esc(day(s.affiliate?.terms_accepted_at))}.</p>`,
  ].join('');
  $('body').innerHTML = `<div class="af-dash"><div class="af-main">${calendarCard(st.feed, t.today)}${feedCard(st.feed)}</div><div class="af-side">${side}</div></div>`;
  brandSwitcher();
}

// A rep who reps more than one brand gets a menu instead of a trip back to
// their inbox. One brand (or an unapplied migration, or any error) leaves the
// header exactly as it is: this is a shortcut, never a gate.
async function brandSwitcher() {
  let brands = [];
  try { brands = (await call('brands', { token })).brands || []; } catch { return; }
  // No rows at all means this link was not sent to the rep's own address --
  // a link their brand's team generated and passed on. Those open one brand
  // on purpose, because whoever generated it holds the same link. Say so,
  // rather than leaving a rep who works with several brands wondering where
  // the menu went. One row means one brand, and needs nothing.
  if (!brands.length) {
    $('switch').innerHTML = '<button class="af-switch-btn" type="button" id="switchBtn">Switch brand</button>';
    $('switchBtn').addEventListener('click', () => signIn(
      'This link came from your brand’s team, so it opens that brand only. Enter your email and we’ll send you a link that moves between every brand you work with.'));
    return;
  }
  if (brands.length < 2) return;
  const current = brands.find((b) => b.is_current) || brands[0];
  const row = (b) => `<button class="af-switch-item" type="button" data-brand="${esc(b.affiliate_id)}"${b.is_current ? ' disabled' : ''}>
    ${brandMark(b.brand, b.brand_logo)}<span>${esc(b.brand)}</span><span class="af-switch-prog">${esc(b.is_current ? 'Signed in' : b.program)}</span></button>`;
  $('switch').innerHTML = `<button class="af-switch-btn" type="button" id="switchBtn" aria-haspopup="true" aria-expanded="false">${esc(current.brand)}</button>
    <div class="af-switch-menu" id="switchMenu" hidden>${brands.map(row).join('')}</div>`;
  wireBrandMark($('switch'));
  const menu = $('switchMenu'); const btn = $('switchBtn');
  const close = () => { menu.hidden = true; btn.setAttribute('aria-expanded', 'false'); };
  btn.addEventListener('click', (ev) => {
    ev.stopPropagation();
    menu.hidden = !menu.hidden;
    btn.setAttribute('aria-expanded', String(!menu.hidden));
  });
  document.addEventListener('click', (ev) => { if (!$('switch').contains(ev.target)) close(); });
  document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') close(); });
  menu.addEventListener('click', async (ev) => {
    const b = ev.target.closest('[data-brand]');
    if (!b || b.disabled) return;
    close();
    b.disabled = true;
    try {
      // A new token for that one record. The page reloads onto it, so every
      // read after this is that brand's alone -- no session sees two brands.
      const r = await call('switch', { token, affiliate_id: b.dataset.brand });
      try { sessionStorage.setItem('silo_affiliate_portal', r.token); } catch {}
      location.replace(`portal.html?t=${encodeURIComponent(r.token)}`);
    } catch (e) { setStatus(e.message, 'neg'); b.disabled = false; }
  });
}

// Earned is the commission itself; this says what it is a share of.
function rateText(c, cur) {
  if (!c) return '';
  if (c.kind === 'percent_of_net' && c.percent != null) return `${Number(c.percent)}% of each order`;
  if (c.kind === 'fixed_per_order' && c.fixed_cents != null) return `${formatMoney(c.fixed_cents, cur)} per order`;
  return '';
}

// Whether a code works at checkout today, by its status and dates, judged on
// the company's own calendar day (statement.totals.today), as checkout and
// the feed judge it. Codes still waiting for Shopify never reach this page.
function codeState(c, today) {
  const pill = (label, kind = '') => `<span class="bcn-pill${kind ? ` bcn-pill--${kind}` : ''}" data-code-state>${esc(label)}</span>`;
  if (!today) return '';
  if (c.status !== 'active' || (c.ends_on && day(c.ends_on) < today)) return pill('Ended');
  if (c.starts_on && day(c.starts_on) > today) return pill(`Starts ${day(c.starts_on)}`, 'accent');
  return pill('Active', 'pos');
}

// The top of the page: who this is for, and their own link to share.
function heroCard(feed, name, brand, status) {
  const link = feed?.store_link;
  return `<section class="af-hero">
    <div><h2>${esc(name ? `Hi ${name}` : 'Welcome')}</h2>
      <div class="af-sub">${status === 'paused' ? 'Your account is paused. New orders are not credited until the brand resumes it.' : `You earn on every order that uses your ${esc(brand)} code.`}</div></div>
    <div class="af-hero-link">${link
      ? `<span class="af-copy" id="storeLink">${esc(link)}</span>
         <div class="af-brand">${copyBtn(link, 'Copy my link', 'primary')}<span class="af-sub">Your code <span class="af-code">${esc(feed.code || '')}</span> is applied at checkout.</span></div>`
      : `<span class="af-sub">${feed?.code
        ? `Your code <span class="af-code">${esc(feed.code)}</span> is live — use it at checkout. Your one-tap link appears once ${esc(brand)} sets its store address.`
        : 'Your link appears once you have a code.'}</span>`}</div>
  </section>`;
}
const copyBtn = (text, label, kind = 'ghost') => (text ? `<button class="bcn-btn bcn-btn--${kind}" type="button" data-copy="${esc(text)}" data-what="${esc(label)}">${esc(label)}</button>` : '');

// Launches as a calendar: soonest first, grouped by month, each with the
// rep's own link. Dates are the brand's calendar days, compared with the
// company's own today; past drops are left off.
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
function calendarCard(feed, today) {
  const items = Array.isArray(feed?.items) ? feed.items : [];
  const launches = items.filter((i) => i.kind === 'launch' && /^\d{4}-\d{2}-\d{2}/.test(String(i.event_on || '')))
    .filter((i) => !today || day(i.event_on) >= today)
    .sort((a, b) => day(a.event_on).localeCompare(day(b.event_on)));
  if (!launches.length) return '';
  const soon = (d) => {
    if (!today) return false;
    const diff = (Date.parse(`${d}T00:00:00Z`) - Date.parse(`${today}T00:00:00Z`)) / 86400000;
    return diff >= 0 && diff <= 7;
  };
  let month = '';
  const rows = launches.map((i) => {
    const d = day(i.event_on); const [y, mo, dd] = d.split('-');
    const head = `${y}-${mo}` !== month ? `<div class="af-cal-month">${esc(MONTH_NAMES[Number(mo) - 1])} ${esc(y)}</div>` : '';
    month = `${y}-${mo}`;
    return `${head}<div class="af-cal-row${soon(d) ? ' is-soon' : ''}" data-cal-date="${esc(d)}">
      <div class="af-cal-date"><span>${esc(MONTHS[Number(mo) - 1])}</span><span class="af-cal-day">${esc(String(Number(dd)))}</span></div>
      ${i.image_url ? `<img class="af-cal-thumb" src="${esc(i.image_url)}" alt="">` : '<div class="af-cal-thumb-none"></div>'}
      <div class="af-cal-text"><div class="af-cal-title">${esc(i.title)}</div>${i.note ? `<div class="af-cal-note">${esc(i.note)}</div>` : ''}</div>
      ${copyBtn(i.link, 'Copy my link', 'ghost')}</div>`;
  }).join('');
  return card('Coming up', `<div class="af-cal" id="calendar">${rows}</div>`);
}

// What the brand shared to post, each with this affiliate's own link: the
// link opens the brand's store with the affiliate's code applied, and the
// code is what earns commission. Ads come with their picture and copy.
function feedCard(feed) {
  if (!feed) return '';
  const all = Array.isArray(feed.items) ? feed.items : [];
  const items = all.filter((i) => i.kind !== 'launch');
  if (!items.length) return all.length ? '' : card('Share and earn', empty('Nothing shared yet. New drops, ads and products show up here.'));
  const tag = { product: 'Product', ad: 'Ad' };
  const item = (i) => `<div class="af-item" data-kind="${esc(i.kind)}">
    <div class="af-media">${i.image_url ? `<img src="${esc(i.image_url)}" alt="${esc(i.title)}" loading="lazy">` : `<div class="af-media-none">${esc(i.title)}</div>`}<span class="af-tag">${esc(tag[i.kind] || '')}</span></div>
    <div class="af-item-body">${i.image_url ? `<div class="af-item-title">${esc(i.title)}</div>` : ''}
    ${i.note ? `<div class="af-item-note">${esc(i.note)}</div>` : ''}
    <div class="af-item-acts">${copyBtn(i.link, 'Copy my link', 'primary')}${i.kind === 'ad' ? copyBtn(i.note, 'Copy caption') : ''}${i.image_url ? `<a class="bcn-btn bcn-btn--ghost" href="${esc(i.image_url)}" target="_blank" rel="noopener" download>Save image</a>` : ''}</div></div></div>`;
  // One grid, ads first, with a filter per kind when there are both.
  const order = { ad: 0, product: 1 };
  const sorted = [...items].sort((a, b) => (order[a.kind] ?? 2) - (order[b.kind] ?? 2));
  const kinds = [['ad', 'Ads to repost'], ['product', 'Products']].filter(([k]) => items.some((i) => i.kind === k));
  const filters = kinds.length > 1 ? `<div class="af-filters">${[['', 'All'], ...kinds].map(([k, l]) => `<button type="button" class="af-filter${k ? '' : ' is-on'}" data-filter="${k}">${esc(l)}</button>`).join('')}</div>`
    : `<div class="af-feed-head">${esc(kinds[0]?.[1] || '')}</div>`;
  return card('Share and earn', filters + `<div class="af-feed" id="feed">${sorted.map(item).join('')}</div>`);
}

document.addEventListener('click', async (ev) => {
  const f = ev.target.closest('[data-filter]');
  if (f) {
    document.querySelectorAll('[data-filter]').forEach((x) => x.classList.toggle('is-on', x === f));
    document.querySelectorAll('#feed .af-item').forEach((x) => { x.hidden = !!f.dataset.filter && x.dataset.kind !== f.dataset.filter; });
    return;
  }
  const b = ev.target.closest('[data-copy]');
  if (!b) return;
  try { await navigator.clipboard.writeText(b.dataset.copy); setStatus(b.dataset.what === 'Copy caption' ? 'Caption copied.' : 'Link copied.', 'pos'); }
  catch { setStatus(b.dataset.copy, 'info'); }
});
load().catch((e) => setStatus(e.message, 'neg'));
</script>
</body>
</html>
