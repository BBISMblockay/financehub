<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>Affiliate portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../beacon.css" />
  <link rel="stylesheet" href="../silo-brand.css" />
  <script src="/pages/config.js"></script>
  <style>
    /* Affiliate-facing page: no SILO chrome, no internal navigation. Beacon tokens only. */
    body { background: var(--bcn-bg); }
    .af-wrap { max-width: 720px; margin: 0 auto; padding: 28px 16px 64px; display: flex; flex-direction: column; gap: 14px; }
    .af-terms { max-height: 420px; overflow-y: auto; border: 1px solid var(--bcn-border); padding: 12px 14px; background: var(--bcn-surface); font-size: 14px; line-height: 1.55; }
    .af-num { font-family: var(--bcn-mono); font-variant-numeric: tabular-nums; }
    .af-muted { color: var(--bcn-ink-3); font-size: 12px; }
    .af-copy { word-break: break-all; font-family: var(--bcn-mono); font-size: 12px; }
    .af-form { display: flex; flex-direction: column; gap: 10px; }
    .af-hp { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
    .af-scroll { overflow-x: auto; }
    .af-brand { display: flex; align-items: center; gap: 12px; }
    .af-logo { height: 36px; width: auto; max-width: 180px; object-fit: contain; border-radius: 8px; display: block; }
    /* The feed: what the brand shared, each with the affiliate's own link. */
    .af-feed { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
    .af-item { border: 1px solid var(--bcn-border); border-radius: 12px; background: var(--bcn-surface); overflow: hidden; display: flex; flex-direction: column; }
    .af-media { position: relative; aspect-ratio: 1 / 1; background: var(--bcn-bg); }
    .af-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .af-media-none { width: 100%; height: 100%; display: grid; place-items: center; padding: 16px; text-align: center; font-weight: 700; font-size: 18px; line-height: 1.3; color: var(--bcn-ink-2); }
    .af-tag { position: absolute; top: 8px; left: 8px; background: var(--bcn-ink); color: var(--bcn-surface); font-family: var(--bcn-mono); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; }
    .af-item-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .af-item-title { font-weight: 700; color: var(--bcn-ink); font-size: 14px; line-height: 1.35; }
    .af-item-note { color: var(--bcn-ink-2); font-size: 13px; line-height: 1.45; white-space: pre-line; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .af-item-date { font-family: var(--bcn-mono); font-size: 12px; color: var(--bcn-ink-3); }
    .af-item-acts { margin-top: auto; display: flex; flex-wrap: wrap; gap: 6px; padding-top: 4px; }
    .af-mylink { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .af-mylink .af-copy { flex: 1; min-width: 200px; }
    .af-code { font-family: var(--bcn-mono); font-weight: 600; border: 1px dashed var(--bcn-border); border-radius: 8px; padding: 2px 8px; color: var(--bcn-ink); }
    .af-feed-head { font-weight: 700; color: var(--bcn-ink); margin: 18px 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
    .af-badge { width: 32px; height: 32px; border-radius: 8px; background: var(--bcn-ink); color: var(--bcn-surface); display: grid; place-items: center; font-weight: 700; flex: none; }
  </style>
</head>
<body class="silo-brand">
<main class="af-wrap">
  <header class="bcn-header"><div class="bcn-header-title af-brand"><span id="mark"></span><h1 id="title">Affiliate portal</h1></div></header>
  <div class="bcn-status" id="status" hidden></div>
  <div class="bcn-kpi-band" id="kpis" hidden></div>
  <div id="body"><div class="bcn-card"><div class="bcn-card-body">Loading…</div></div></div>
  <p class="af-muted">Run by the brand using SILO. This page is personal to you.</p>
</main>
<script type="module">
import { $, esc, call, setStatus, takeToken, brandMark, wireBrandMark } from './public.js';
import { formatMoney } from './studio-core.js';
const token = takeToken('silo_affiliate_portal');
const card = (title, html) => `<div class="bcn-card"><div class="bcn-card-header"><h2>${esc(title)}</h2></div><div class="bcn-card-body">${html}</div></div>`;
const table = (head, rows, emptyText) => rows.length
  ? `<div class="af-scroll"><table class="bcn-table"><thead><tr>${head.map((h) => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`
  : `<div class="bcn-empty">${esc(emptyText)}</div>`;
const day = (s) => (s ? String(s).slice(0, 10) : '');

function expired() {
  $('body').innerHTML = card('This link has expired', `<p>We can email you a new one.</p>
    <button class="bcn-btn bcn-btn--primary" id="renew">Email me a new link</button>`);
  $('renew').addEventListener('click', async () => {
    $('renew').disabled = true;
    try { const r = await call('renew', { token }); setStatus(r.message, 'pos'); }
    catch (e) { setStatus(e.message, 'neg'); $('renew').disabled = false; }
  });
}

async function load() {
  if (!token) { $('body').innerHTML = card('This link is incomplete', '<p>Open the link exactly as it was emailed to you.</p>'); return; }
  let r;
  try { r = await call('resolve', { token }); }
  catch (e) { if (e.status === 404) return expired(); $('body').innerHTML = card('Something went wrong', `<p>${esc(e.message)}</p>`); return; }
  if (r.purpose === 'signup') { location.replace(`join.html?t=${encodeURIComponent(token)}`); return; }
  $('title').textContent = `${r.brand} affiliate portal`;
  $('mark').innerHTML = brandMark(r.brand, r.brand_logo);
  wireBrandMark($('mark'));
  const st = await call('statement', { token });
  const s = st.statement || {};
  const cur = s.currency; const m = (c) => formatMoney(c, cur); const t = s.totals || {};
  const kpi = (l, v) => `<div class="bcn-kpi"><div class="bcn-kpi-label">${esc(l)}</div><div class="bcn-kpi-value">${v}</div></div>`;
  $('kpis').innerHTML = kpi('Earned', m(t.earned_cents)) + kpi('Paid', m(t.paid_cents)) + kpi('Not yet paid', m(t.unclaimed_cents)) + kpi('Orders', esc(t.orders ?? 0));
  $('kpis').hidden = false;
  $('body').innerHTML = [
    s.affiliate?.status === 'paused' ? card('Paused', '<p>New orders are not credited until the brand resumes your account.</p>') : '',
    feedCard(st.feed),
    card('Your codes', table(['Code', 'From', 'Until', 'Status'], (s.codes || []).map((c) => [`<span class="af-num">${esc(c.code)}</span>`, esc(day(c.starts_on)), esc(day(c.ends_on) || 'open'), esc(c.status)]), 'No code yet. The brand will send one.')),
    (s.links || []).length ? card('Your links', table(['Link', 'From', 'Status'], (s.links || []).map((l) => { let u = l.link || l.destination_url; if (!l.link) { try { const x = new URL(l.destination_url); for (const k of ['utm_source', 'utm_medium', 'utm_campaign']) if (l[k]) x.searchParams.set(k, l[k]); u = x.toString(); } catch {} } return [`<span class="af-copy">${esc(u)}</span>`, esc(day(l.starts_on)), esc(l.status)]; }), 'No links yet.')) : '',
    card('Earnings by month', table(['Month', 'Orders', 'Commission'], (s.monthly || []).map((x) => [esc(x.month), `<span class="af-num">${esc(x.orders)}</span>`, `<span class="af-num">${m(x.amount_cents)}</span>`]), 'No earnings yet.')),
    card('Payouts', table(['Amount', 'Status', 'Paid', 'Reference'], (s.payouts || []).map((p) => [`<span class="af-num">${m(p.amount_cents)}</span>`, esc(p.status === 'marked_paid' ? 'paid' : p.status), esc(day(p.marked_paid_at)), esc(p.reference || '')]), 'No payouts yet.')),
    card('Terms', `<p>You accepted version ${esc(s.affiliate?.terms_version_accepted ?? '—')} on ${esc(day(s.affiliate?.terms_accepted_at))}.</p>`),
  ].join('');
}
// What the brand shared, each with this affiliate's own link: the link opens
// the brand's store with the affiliate's code applied, and the code is what
// earns commission. Ads come with their picture and copy, to repost.
function feedCard(feed) {
  if (!feed) return '';
  const items = Array.isArray(feed.items) ? feed.items : [];
  if (!items.length && !feed.store_link) return '';
  const copyBtn = (text, label, kind = 'ghost') => (text ? `<button class="bcn-btn bcn-btn--${kind}" type="button" data-copy="${esc(text)}" data-what="${esc(label)}">${esc(label)}</button>` : '');
  const tag = { launch: 'Coming up', product: 'Product', ad: 'Ad' };
  const item = (i) => `<div class="af-item">
    <div class="af-media">${i.image_url ? `<img src="${esc(i.image_url)}" alt="${esc(i.title)}" loading="lazy">` : `<div class="af-media-none">${esc(i.title)}</div>`}<span class="af-tag">${esc(tag[i.kind] || '')}</span></div>
    <div class="af-item-body"><div class="af-item-title">${esc(i.title)}</div>
    ${i.event_on ? `<div class="af-item-date">${esc(i.kind === 'launch' ? `Drops ${day(i.event_on)}` : day(i.event_on))}</div>` : ''}
    ${i.note ? `<div class="af-item-note">${esc(i.note)}</div>` : ''}
    <div class="af-item-acts">${copyBtn(i.link, 'Copy my link', 'primary')}${i.kind === 'ad' ? copyBtn(i.note, 'Copy caption') : ''}${i.image_url ? `<a class="bcn-btn bcn-btn--ghost" href="${esc(i.image_url)}" target="_blank" rel="noopener" download>Save image</a>` : ''}</div></div></div>`;
  const group = (kind, head) => { const g = items.filter((i) => i.kind === kind); return g.length ? `<div class="af-feed-head">${esc(head)}</div><div class="af-feed">${g.map(item).join('')}</div>` : ''; };
  const mine = feed.store_link
    ? `<div class="af-mylink"><span class="af-copy" id="storeLink">${esc(feed.store_link)}</span>${copyBtn(feed.store_link, 'Copy my link', 'primary')}</div>
       <p class="af-muted">Your code <span class="af-code">${esc(feed.code || '')}</span> is applied at checkout.</p>`
    : '<p class="af-muted">Your links appear once you have a code.</p>';
  return card('Share and earn', mine + group('launch', 'Coming up') + group('ad', 'Ads to repost') + group('product', 'Products'));
}

document.addEventListener('click', async (ev) => {
  const b = ev.target.closest('[data-copy]');
  if (!b) return;
  try { await navigator.clipboard.writeText(b.dataset.copy); setStatus(b.dataset.what === 'Copy caption' ? 'Caption copied.' : 'Link copied.', 'pos'); }
  catch { setStatus(b.dataset.copy, 'info'); }
});
load().catch((e) => setStatus(e.message, 'neg'));
</script>
</body>
</html>
