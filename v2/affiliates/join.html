<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>Join the affiliate program</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../beacon.css" />
  <link rel="stylesheet" href="../silo-brand.css" />
  <script src="/pages/config.js"></script>
  <style>
    /* Affiliate-facing page: no SILO chrome, no internal navigation. Beacon tokens only. */
    body { background: var(--bcn-bg); }
    .af-wrap { max-width: 720px; margin: 0 auto; padding: 28px 16px 64px; display: flex; flex-direction: column; gap: 14px; }
    .af-terms { max-height: 420px; overflow-y: auto; border: 1px solid var(--bcn-border); padding: 12px 14px; background: var(--bcn-surface); font-size: 14px; line-height: 1.55; }
    .af-num { font-family: var(--bcn-mono); font-variant-numeric: tabular-nums; }
    .af-muted { color: var(--bcn-ink-3); font-size: 12px; }
    .af-copy { word-break: break-all; font-family: var(--bcn-mono); font-size: 12px; }
    .af-form { display: flex; flex-direction: column; gap: 10px; }
    .af-hp { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
    .af-scroll { overflow-x: auto; }
    /* Invitation hero: the brand's logo (or initial) and name, the offer as one number. */
    .af-hero { display: flex; flex-direction: column; gap: 14px; padding: 26px 24px; border: 1px solid var(--bcn-border); border-radius: 14px; background: var(--bcn-surface); }
    .af-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; color: var(--bcn-ink); }
    .af-logo { height: 40px; width: auto; max-width: 200px; object-fit: contain; border-radius: 8px; display: block; }
    .af-badge { width: 34px; height: 34px; border-radius: 9px; background: var(--bcn-ink); color: var(--bcn-surface); display: grid; place-items: center; font-weight: 700; }
    .af-kicker { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--bcn-ink-3); }
    .af-hero h1 { margin: 0; font-size: 26px; line-height: 1.2; color: var(--bcn-ink); }
    .af-offer { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .af-offer-num { font-family: var(--bcn-mono); font-size: 30px; font-weight: 600; color: var(--bcn-ink); font-variant-numeric: tabular-nums; }
    .af-offer-txt { color: var(--bcn-ink-2); font-size: 14px; }
    .af-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 0; padding: 0; list-style: none; counter-reset: s; }
    .af-steps li { counter-increment: s; border: 1px solid var(--bcn-border); border-radius: 10px; padding: 12px; font-size: 13px; line-height: 1.45; color: var(--bcn-ink-2); background: var(--bcn-bg); }
    .af-steps li::before { content: counter(s); display: block; font-family: var(--bcn-mono); font-weight: 600; color: var(--bcn-accent); margin-bottom: 4px; }
    .af-steps strong { color: var(--bcn-ink); display: block; margin-bottom: 2px; }
    @media (max-width: 600px) { .af-steps { grid-template-columns: 1fr; } .af-hero h1 { font-size: 22px; } }
    #body { display: flex; flex-direction: column; gap: 14px; }
    .af-accept { display: flex; flex-direction: column; gap: 12px; }
    .af-accept .bcn-btn { width: 100%; justify-content: center; padding: 12px 16px; font-size: 15px; }
    .af-check { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
    .af-check input { margin-top: 3px; }
  </style>
</head>
<body class="silo-brand">
<main class="af-wrap">
  <h1 id="title" hidden>Join the affiliate program</h1>
  <div class="bcn-status" id="status" hidden></div>
  <div id="body"><div class="bcn-card"><div class="bcn-card-body">Checking your link…</div></div></div>
  <p class="af-muted">Run by the brand that invited you, powered by SILO. Your link is personal; please do not share it.</p>
</main>
<script type="module">
import { $, esc, call, setStatus, takeToken, termsHtml, brandMark, wireBrandMark } from './public.js';
import { describeCommission } from './studio-core.js';
// Matches /legal/affiliate-terms.html and the affiliate-portal function.
const PLATFORM_TERMS_VERSION = 1;
const token = takeToken('silo_affiliate_signup');
const card = (title, html) => `<div class="bcn-card"><div class="bcn-card-header"><h2>${esc(title)}</h2></div><div class="bcn-card-body">${html}</div></div>`;

async function load() {
  if (!token) { $('body').innerHTML = card('This link is incomplete', '<p>Open the link exactly as it was sent to you, or ask the brand for a new one.</p>'); return; }
  let r;
  try { r = await call('resolve', { token }); }
  catch (e) {
    $('body').innerHTML = card('This link has expired', `<p>${esc(e.status === 404 ? 'Signup links work for a limited time. Ask the person who invited you for a new one.' : e.message)}</p>`);
    return;
  }
  if (r.purpose === 'portal') { location.replace(`portal.html?t=${encodeURIComponent(token)}`); return; }
  $('title').textContent = `Join ${r.brand}'s affiliate program`;
  document.title = `Join ${r.brand}'s affiliate program`;
  if (r.affiliate?.status === 'active') { $('body').innerHTML = card('You are already in', '<p>You accepted the terms already. Check your email for your portal link.</p>'); return; }
  const p = r.program;
  if (p.status !== 'active') { $('body').innerHTML = card('Not open right now', '<p>This program is not accepting new affiliates at the moment. The brand can tell you more.</p>'); return; }
  const offer = describeCommission({ kind: p.commission.kind, percent: p.commission.percent, fixed_cents: p.commission.fixed_cents, currency: p.currency });
  const big = /^[\d$€£¥%.,]|^[A-Z]{3}\b/.test(offer) ? (offer.match(/^\S+/)?.[0] || '') : '';
  const brand = String(r.brand || 'Affiliate program');
  $('body').innerHTML = `<section class="af-hero" id="hero">
      <div class="af-brand">${brandMark(brand, r.brand_logo)}<span>${esc(brand)}</span></div>
      <div><div class="af-kicker">You're invited</div><h1>Join the ${esc(brand)} affiliate program</h1></div>
      <div class="af-offer"><span class="af-offer-num">${esc(big)}</span><span class="af-offer-txt">${esc(offer.slice(big.length).trim())}, paid in <span class="af-num">${esc(p.currency)}</span></span></div>
      <ol class="af-steps">
        <li><strong>Accept the terms</strong>Read them below and sign with your name.</li>
        <li><strong>Get your code</strong>${esc(brand)} sends your personal discount code and link.</li>
        <li><strong>Earn on sales</strong>Orders that use your code earn commission, paid after a refund hold.</li>
      </ol>
    </section>`
    + card(`${p.name} · terms, version ${p.terms_version}`, `<div class="af-terms">${termsHtml(p.terms_markdown)}</div><p class="af-muted" style="margin-top:8px;">Together with these, you accept the <a href="/legal/affiliate-terms.html" target="_blank" rel="noopener">affiliate platform terms</a> (version ${PLATFORM_TERMS_VERSION}): disclosure, how you earn, payments and your information. This page never asks for bank details.</p>`)
    + card('Accept and join', `<form class="af-form af-accept" id="form">
        <div class="bcn-field-group"><label class="bcn-label" for="signed">Your full name (this is your signature)</label><input class="bcn-field" id="signed" autocomplete="name" required maxlength="120" /></div>
        <label class="af-check"><input type="checkbox" id="agree" required /> <span>I have read and accept version ${p.terms_version} of the program terms above and the affiliate platform terms.</span></label>
        <button class="bcn-btn bcn-btn--primary" type="submit" id="go">Accept and join</button>
      </form>`);
  wireBrandMark($('body'));
  $('form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    if (!$('agree').checked || !$('signed').value.trim()) { setStatus('Type your name and tick the box to accept.', 'neg'); return; }
    $('go').disabled = true; setStatus('');
    try {
      const out = await call('accept', { token, signed_name: $('signed').value.trim(), terms_version: p.terms_version, platform_terms_version: PLATFORM_TERMS_VERSION });
      try { sessionStorage.removeItem('silo_affiliate_signup'); } catch {}
      $('body').innerHTML = card('You are in', `<p>Thanks for joining. ${out.confirmation_email === 'sent' ? 'We emailed you a confirmation with your portal link.' : 'Keep the portal link below: a confirmation email could not be sent.'}</p>
        ${out.portal_url ? `<p><a class="bcn-btn bcn-btn--primary" href="${esc(out.portal_url)}">Open my affiliate portal</a></p>` : '<p>The brand will send you your portal link.</p>'}
        <p class="af-muted">The brand will send your discount code and links once they are set up.</p>`);
    } catch (e) {
      if (e.code === 'terms_changed') { setStatus('The terms were just updated. Please read the new version.', 'neg'); await load(); return; }
      setStatus(e.message, 'neg'); $('go').disabled = false;
    }
  });
}
load();
</script>
</body>
</html>
