<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>Join the partner program</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../beacon.css" />
  <link rel="stylesheet" href="../silo-brand.css" />
  <script src="/pages/config.js"></script>
  <!-- The same look as the apply page (Blake 2026-11-18: applying and signing up
       "both need more work"): brand panel with the offer, the agreement and the
       signature in one card. -->
  <link rel="stylesheet" href="partner.css" />
</head>
<body class="silo-brand">
<div class="ap-shell">
  <aside class="ap-brand"><svg class="ap-laces" viewBox="0 0 200 200" fill="none" aria-hidden="true">
      <circle cx="100" cy="100" r="96" stroke="white" stroke-width="1.4" />
      <path d="M42 16 Q104 100 42 184" stroke="white" stroke-width="1.4" stroke-dasharray="3 6" fill="none" />
      <path d="M158 16 Q96 100 158 184" stroke="white" stroke-width="1.4" stroke-dasharray="3 6" fill="none" /></svg>
    <div class="ap-brand-in" id="hero"><div class="ap-mark"></div><div><p class="ap-kicker">Partner program</p><h1>Checking your link…</h1></div><div class="ap-foot"></div></div></aside>
  <main class="ap-main"><div class="ap-card">
    <div id="head"></div>
    <div class="bcn-status" id="status" hidden></div>
    <div id="body"></div>
    <p class="ap-muted" id="foot">Your link is personal; please do not share it.</p>
  </div></main>
</div>
<script type="module">
import { $, esc, call, setStatus, takeToken, termsHtml, brandMark, wireBrandMark } from './public.js';
import { describeCommission } from './studio-core.js';
// Matches /legal/affiliate-terms.html and the affiliate-portal function.
const PLATFORM_TERMS_VERSION = 1;
const token = takeToken('silo_affiliate_signup');
const CHECK = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
const MONEY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15 9.5c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .8-3 2s1.3 1.7 3 2 3 .8 3 2-1.3 2-3 2c-1.4 0-2.5-.5-3-1.5M12 6.5v11"/></svg>';
const head = (title, sub) => { $('head').innerHTML = `<h2>${esc(title)}</h2>${sub ? `<p class="ap-sub">${esc(sub)}</p>` : ''}`; };
const note = (title, text) => { head(title, ''); $('body').innerHTML = `<p class="ap-sub">${esc(text)}</p>`; };
const field = (id, label, attrs) => `<div class="ap-field"><label for="${id}">${esc(label)}</label><input id="${id}" ${attrs} /></div>`;

function hero(brand, logo, offer, currency, program) {
  $('hero').innerHTML = `<div class="ap-mark">${brandMark(brand, logo)}<span>${esc(brand)}</span></div>
    <div><p class="ap-kicker">You're invited</p><h1>Join the ${esc(brand)} partner program</h1>
    <p class="ap-lead">${esc(program)}. Share ${esc(brand)} in your content with your own link and code, and earn on every sale you send.</p>
    <ol class="ap-steps"><li><div><b>Sign the agreement</b><span>Read it here and sign with your name.</span></div></li>
      <li><div><b>Get your code</b><span>Your personal code and link arrive by email.</span></div></li>
      <li><div><b>Earn on sales</b><span>Paid in ${esc(currency)} after the refund window.</span></div></li></ol>
    ${offer ? `<p class="ap-now">Your rate</p><ul class="ap-perks"><li>${MONEY}<span id="offer">${esc(offer)}</span></li></ul>` : ''}</div>
    <div class="ap-foot">Run by ${esc(brand)}.</div>`;
  wireBrandMark($('hero'));
}

// The agreement: the brand's PDF (20261119010000), its written terms, or both.
// A PDF that could not be linked blocks signing: nobody signs a document they
// could not open.
function agreement(p) {
  const file = p.terms_file;
  const doc = !file ? '' : file.url
    ? `<a class="ap-doc" id="termsDoc" href="${esc(file.url)}" target="_blank" rel="noopener noreferrer"><span class="ap-doc-icon">PDF</span><span class="ap-doc-name">${esc(file.name || 'Partnership agreement')}</span><span class="ap-doc-open">Open</span></a>`
    : '<div class="ap-doc ap-doc--broken" id="termsDoc"><span class="ap-doc-icon">PDF</span><span class="ap-doc-name">The agreement did not load. Reload this page.</span></div>';
  const text = p.terms_markdown ? `<div class="ap-terms" id="terms">${termsHtml(p.terms_markdown)}</div>` : (file ? '' : `<div class="ap-terms" id="terms">${termsHtml('')}</div>`);
  return { html: `${doc}${text}`, blocked: !!file && !file.url };
}

async function load() {
  if (!token) { note('This link is incomplete', 'Open the link exactly as it was sent to you, or ask the brand for a new one.'); return; }
  let r;
  try { r = await call('resolve', { token }); }
  catch (e) { note('This link has expired', e.status === 404 ? 'Signup links work for a limited time. Ask the person who invited you for a new one.' : e.message); return; }
  if (r.purpose === 'portal') { location.replace(`portal.html?t=${encodeURIComponent(token)}`); return; }
  const brand = String(r.brand || 'Partner program');
  const p = r.program;
  document.title = `Join ${brand}'s partner program`;
  // One short line, like the apply page's perks; the full rule is in the agreement.
  const full = describeCommission({ kind: p.commission.kind, percent: p.commission.percent, fixed_cents: p.commission.fixed_cents, currency: p.currency });
  const offer = p.commission.kind === 'percent_of_net' && p.commission.percent != null ? `${Number(p.commission.percent)}% of every sale` : full;
  hero(brand, r.brand_logo, offer, p.currency, p.name);
  $('foot').textContent = 'Your link is personal; please do not share it.';
  if (r.affiliate?.status === 'active') { note('You are already in', 'You signed already. Check your email for your portal link.'); return; }
  if (p.status !== 'active') { note('Not open right now', 'This program is not taking new partners at the moment. The brand can tell you more.'); return; }
  const ag = agreement(p);
  head('Sign your agreement', `${p.name} · version ${p.terms_version}`);
  $('body').innerHTML = `<form class="ap-form" id="form" novalidate>
      ${ag.html}
      <p class="ap-muted" style="text-align:left">Together with these you accept the <a href="/legal/affiliate-terms.html" target="_blank" rel="noopener">platform terms</a> (version ${PLATFORM_TERMS_VERSION}). This page never asks for bank details.</p>
      ${r.affiliate?.email ? `<div class="ap-field"><label>Email</label><div class="ap-static" id="email">${esc(r.affiliate.email)}</div></div>` : ''}
      ${field('paypal', `PayPal email (where ${brand} pays you)`, `type="email" autocomplete="email" maxlength="127" value="${esc(r.affiliate?.email || '')}"`)}
      ${field('signed', 'Your full name (this is your signature)', 'autocomplete="name" required maxlength="120" placeholder="First and last name"')}
      <label class="ap-check"><input type="checkbox" id="agree" required /> <span>I have read and accept version ${p.terms_version} of the ${esc(brand)} agreement and the platform terms.</span></label>
      <button class="ap-go" type="submit" id="go"${ag.blocked ? ' disabled' : ''}>Sign and join</button>
    </form>`;
  $('form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    if (!$('agree').checked || !$('signed').value.trim()) { setStatus('Type your name and tick the box to sign.', 'neg'); return; }
    $('go').disabled = true; setStatus('');
    try {
      const out = await call('accept', { token, signed_name: $('signed').value.trim(), payout_email: $('paypal').value.trim() || null, terms_version: p.terms_version, platform_terms_version: PLATFORM_TERMS_VERSION });
      try { sessionStorage.removeItem('silo_affiliate_signup'); } catch {}
      $('head').innerHTML = '';
      $('body').innerHTML = `<div class="ap-done"><div class="ap-done-icon">${CHECK}</div><h2>You are in</h2>
        <p class="ap-sub">${out.confirmation_email === 'sent' ? 'We emailed you a confirmation with your portal link.' : 'Keep the portal link below: a confirmation email could not be sent.'}</p>
        <p class="ap-sub">${out.codes_live?.length ? `Your code <strong>${esc(out.codes_live[0])}</strong> is live. We emailed it with your links.` : `${esc(brand)} will email your code and links.`}</p>
        ${out.portal_url ? `<a class="ap-go" style="text-decoration:none;display:block;width:100%;box-sizing:border-box" href="${esc(out.portal_url)}">Open my partner portal</a>` : `<p class="ap-sub">${esc(brand)} will send you your portal link.</p>`}</div>`;
    } catch (e) {
      if (e.code === 'terms_changed') { setStatus('The agreement was just updated. Please read the new version.', 'neg'); await load(); return; }
      setStatus(e.message, 'neg'); $('go').disabled = false;
    }
  });
}
load();
</script>
</body>
</html>
