<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SILO · Product Studio</title>
  <script>
    // Product Concepts was consolidated into Product Studio (2026-09-30).
    // ?concept=<id> opens that concept in Studio; anything else lands on
    // Studio's default Ready for PO view. Nothing else was ever a parameter here.
    const p = new URLSearchParams(location.search);
    const next = new URLSearchParams();
    if (p.get('concept')) next.set('concept', p.get('concept'));
    location.replace('/v3/product-workflow.html' + (next.toString() ? '?' + next.toString() : ''));
  </script>
</head>
<body></body>
</html>
