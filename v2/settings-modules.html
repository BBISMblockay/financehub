<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SILO · Silo Modules</title>
  <link rel="stylesheet" href="beacon.css" />
  <link rel="stylesheet" href="silo-brand.css" />
  <link rel="stylesheet" href="workspace-settings.css" />
  <link rel="stylesheet" href="settings-modules.css" />
  <link rel="stylesheet" href="beacon-mirrors-unified.css" />
  <link rel="stylesheet" href="v2-mobile.css" />
  <script src="v2-shell.js" defer></script>
  <script src="nav-config.js"></script>
  <script src="avatar.js"></script>
  <script src="workspace-settings.js"></script>
  <script src="silo-chrome.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/pages/config.js"></script>
  <script src="settings-modules.js" defer></script>
</head>
<body>
  <div class="silo-app" id="silo-app">
    <main class="silo-main workspace-settings">
      <header class="bcn-header sm-header">
        <div class="bcn-header-title">
          <div>Silo Modules</div>
          <div class="bcn-header-sub bcn-header-sub--trimmed" id="module-company">Workspace</div>
          <p class="sm-lede">Choose which modules are active for everyone in this workspace.</p>
        </div>
        <div class="sm-header-act">
          <span class="bcn-pill" id="module-permission" hidden></span>
        </div>
      </header>

      <div class="ws-page sm-page">
        <div class="bcn-status" id="status" role="status" aria-live="polite" hidden></div>

        <div class="sm-layout">
          <div class="ws-card sm-catalog">
            <div class="ws-body">
              <div id="module-controls" class="sm-module-list" aria-label="Workspace modules"></div>
            </div>
          </div>

          <aside class="ws-card sm-aside">
            <div class="ws-card-head sm-aside-head">
              <div class="ws-title">Always on</div>
            </div>
            <div class="ws-body ws-body--tight">
              <ul class="sm-core-list" aria-label="Areas not controlled by module toggles">
                <li class="sm-core-row"><span class="sm-core-name">Home &amp; reports</span></li>
                <li class="sm-core-row"><span class="sm-core-name">Ask SILO</span><span class="sm-core-meta">Grants</span></li>
                <li class="sm-core-row"><span class="sm-core-name">Settings</span></li>
              </ul>
              <button class="bcn-btn bcn-btn--ghost sm-reload" id="module-reload" type="button">Reload</button>
            </div>
          </aside>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
