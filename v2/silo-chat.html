<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SILO · Ask SILO</title>
  <link rel="stylesheet" href="beacon.css" />
  <link rel="stylesheet" href="silo-brand.css" />
  <link rel="stylesheet" href="beacon-mirrors-unified.css" />
  <link rel="stylesheet" href="v2-mobile.css" />
  <script src="v2-shell.js" defer></script>
  <style>
    .ac-content { flex:1; min-height:0; display:flex; flex-direction:column; padding:12px 18px 18px; }
    .ac-card { flex:1; min-height:0; display:flex; flex-direction:column; }
    .ac-log { flex:1; min-height:0; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:14px; }

    .ac-msg { display:flex; gap:10px; max-width:760px; }
    .ac-msg--user { align-self:flex-end; flex-direction:row-reverse; }
    .ac-msg--assistant { align-self:flex-start; }
    .ac-avatar {
      width:26px; height:26px; border-radius:50%; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      font-family:var(--bcn-mono); font-size:10px; font-weight:700;
    }
    .ac-msg--user .ac-avatar { background:var(--bcn-band); color:var(--bcn-band-ink); }
    .ac-msg--assistant .ac-avatar { background:var(--bcn-accent); color:#fff; }
    .ac-bubble {
      padding:10px 14px; border-radius:12px; font-size:13.5px; line-height:1.55;
      white-space:pre-wrap; word-break:break-word;
    }
    .ac-msg--user .ac-bubble { background:var(--bcn-band); color:var(--bcn-band-ink); border-top-right-radius:3px; }
    .ac-msg--assistant .ac-bubble { background:var(--bcn-sunken); color:var(--bcn-ink); border-top-left-radius:3px; }
    .ac-msg--error .ac-bubble { background:color-mix(in oklab, var(--bcn-neg) 12%, var(--bcn-surface)); color:var(--bcn-neg); }

    .ac-queries {
      margin-top:8px; font-family:var(--bcn-mono); font-size:10.5px; color:var(--bcn-ink-3);
    }
    .ac-queries summary { cursor:pointer; user-select:none; }
    .ac-queries pre {
      margin:6px 0 0; padding:8px 10px; background:var(--bcn-surface); border:1px solid var(--bcn-border);
      border-radius:6px; overflow-x:auto; white-space:pre-wrap; word-break:break-word;
    }

    .ac-empty {
      margin:auto; text-align:center; color:var(--bcn-ink-3); font-size:13px; max-width:420px;
    }
    .ac-empty h3 { color:var(--bcn-ink); margin-bottom:6px; }
    .ac-suggestions { display:flex; flex-direction:column; gap:6px; margin-top:14px; }
    .ac-suggestion {
      text-align:left; padding:8px 12px; border:1px solid var(--bcn-border); border-radius:8px;
      background:var(--bcn-surface); font-size:12.5px; color:var(--bcn-ink-2); cursor:pointer;
    }
    .ac-suggestion:hover { background:var(--bcn-sunken); }

    .ac-typing { display:flex; gap:4px; padding:4px 0; }
    .ac-typing span {
      width:6px; height:6px; border-radius:50%; background:var(--bcn-ink-3);
      animation:ac-bounce 1.1s infinite ease-in-out;
    }
    .ac-typing span:nth-child(2) { animation-delay:.15s; }
    .ac-typing span:nth-child(3) { animation-delay:.3s; }
    @keyframes ac-bounce { 0%,60%,100%{ transform:translateY(0); opacity:.5 } 30%{ transform:translateY(-4px); opacity:1 } }

    .ac-inputbar {
      display:flex; gap:8px; padding:12px; border-top:1px solid var(--bcn-border); flex-shrink:0;
    }
    .ac-inputbar textarea {
      flex:1; resize:none; border:1px solid var(--bcn-border); border-radius:8px; padding:9px 12px;
      font-family:var(--bcn-font); font-size:13px; line-height:1.4; max-height:120px;
    }
  </style>
</head>
<body class="silo-brand">
<div id="silo-app" class="silo-app">
  <main class="silo-main">

    <header class="bcn-header">
      <div style="flex:1;min-width:0">
        <div class="bcn-header-title">
          <span style="font-family:var(--bcn-mono);font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--bcn-ink-3)">Reports</span>
        </div>
        <h1>Ask SILO</h1>
        <div class="bcn-header-sub">Ask anything about your data — sales, inventory, marketing, returns.</div>
      </div>
      <div class="bcn-header-actions">
        <button id="btnNewChat" class="bcn-btn bcn-btn--ghost">New chat</button>
      </div>
    </header>

    <div class="bcn-status" id="status" hidden></div>

    <div class="ac-content">
      <div class="bcn-card ac-card">
        <div class="ac-log" id="log">
          <div class="ac-empty" id="emptyState">
            <h3>Ask anything about your data</h3>
            <div>Grounded in your own SILO/Supabase data — sales, inventory, marketing, returns, purchasing.</div>
            <div class="ac-suggestions">
              <button class="ac-suggestion" data-q="What were our top 5 selling products by revenue in the last 30 days?">What were our top 5 selling products by revenue in the last 30 days?</button>
              <button class="ac-suggestion" data-q="Which SKUs get returned the most, and why?">Which SKUs get returned the most, and why?</button>
              <button class="ac-suggestion" data-q="How is our marketing spend trending against online sales this month?">How is our marketing spend trending against online sales this month?</button>
              <button class="ac-suggestion" data-q="Suggest a marketing campaign idea based on what's actually selling well right now.">Suggest a marketing campaign idea based on what's actually selling well right now.</button>
            </div>
          </div>
        </div>
        <div class="ac-inputbar">
          <textarea id="input" rows="1" placeholder="Ask about sales, inventory, marketing, returns…"></textarea>
          <button id="btnSend" class="bcn-btn bcn-btn--primary">Send</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="../pages/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="nav-config.js"></script>
<script src="silo-chrome.js"></script>
<script>
  const cfg = window.__SILO_CONFIG__ || {};
  const SUPABASE_URL = cfg.SUPABASE_URL || '';
  const SUPABASE_ANON_KEY = cfg.SUPABASE_ANON_KEY || '';

  if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
    document.querySelector('.silo-main').innerHTML =
      `<div style="padding:48px;text-align:center"><div style="font-weight:700;color:var(--bcn-ink)">Missing Supabase config</div></div>`;
    throw new Error('Missing Supabase config');
  }

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const FUNCTIONS_URL = SUPABASE_URL.replace('/rest/v1', '') + '/functions/v1';

  const el = id => document.getElementById(id);
  const esc = s => String(s ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');

  function setStatus(msg, type = 'info', ms = 0) {
    const s = el('status');
    s.className = `bcn-status bcn-status--${type}`;
    s.textContent = msg;
    s.hidden = false;
    if (ms) setTimeout(() => { s.hidden = true; }, ms);
  }

  let history = [];
  let session = null;

  function scrollToBottom() {
    const log = el('log');
    log.scrollTop = log.scrollHeight;
  }

  function renderMessage({ role, content, queries, isError }) {
    el('emptyState').remove?.();
    const wrap = document.createElement('div');
    wrap.className = `ac-msg ac-msg--${isError ? 'error' : role}`;
    const avatar = role === 'user' ? (session?.user?.email?.[0]?.toUpperCase() || 'U') : 'S';
    let queriesHtml = '';
    if (queries && queries.length) {
      queriesHtml = `<details class="ac-queries"><summary>${queries.length} quer${queries.length === 1 ? 'y' : 'ies'} run</summary>${
        queries.map(q => `<pre>${esc(q)}</pre>`).join('')
      }</details>`;
    }
    wrap.innerHTML = `
      <div class="ac-avatar">${esc(avatar)}</div>
      <div>
        <div class="ac-bubble">${esc(content)}</div>
        ${queriesHtml}
      </div>`;
    el('log').appendChild(wrap);
    scrollToBottom();
  }

  function renderTyping() {
    const wrap = document.createElement('div');
    wrap.className = 'ac-msg ac-msg--assistant';
    wrap.id = 'typingIndicator';
    wrap.innerHTML = `
      <div class="ac-avatar">S</div>
      <div class="ac-bubble"><div class="ac-typing"><span></span><span></span><span></span></div></div>`;
    el('log').appendChild(wrap);
    scrollToBottom();
  }

  function removeTyping() {
    el('typingIndicator')?.remove();
  }

  async function sendMessage(text) {
    if (!text.trim()) return;
    el('input').value = '';
    el('input').style.height = 'auto';
    el('btnSend').disabled = true;

    history.push({ role: 'user', content: text });
    renderMessage({ role: 'user', content: text });
    renderTyping();

    try {
      const res = await fetch(`${FUNCTIONS_URL}/silo-chat`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${session.access_token}`,
        },
        body: JSON.stringify({ history }),
      });
      const data = await res.json();
      removeTyping();
      if (!res.ok || data.error) {
        renderMessage({ role: 'assistant', content: data.error || 'Something went wrong.', isError: true });
        return;
      }
      history.push({ role: 'assistant', content: data.answer });
      renderMessage({ role: 'assistant', content: data.answer, queries: data.queries_run });
    } catch (err) {
      removeTyping();
      renderMessage({ role: 'assistant', content: 'Request failed: ' + err.message, isError: true });
    } finally {
      el('btnSend').disabled = false;
      el('input').focus();
    }
  }

  el('btnSend').addEventListener('click', () => sendMessage(el('input').value));
  el('input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage(el('input').value);
    }
  });
  el('input').addEventListener('input', function () {
    this.style.height = 'auto';
    this.style.height = Math.min(120, this.scrollHeight) + 'px';
  });
  el('log').addEventListener('click', (e) => {
    const btn = e.target.closest('.ac-suggestion');
    if (btn) sendMessage(btn.dataset.q);
  });
  el('btnNewChat').addEventListener('click', () => {
    history = [];
    el('log').innerHTML = `
      <div class="ac-empty" id="emptyState">
        <h3>Ask anything about your data</h3>
        <div>Grounded in your own SILO/Supabase data — sales, inventory, marketing, returns, purchasing.</div>
      </div>`;
  });

  async function boot() {
    const sessRes = await sb.auth.getSession();
    if (!sessRes?.data?.session) { window.location.href = '/pages/login.html'; return; }
    session = sessRes.data.session;
    const user = session.user;

    const { data: profile } = await sb.from('profiles').select('name, email, role').eq('id', user.id).single();

    if (window.SiloChrome) {
      window.SiloChrome.mount({
        appEl: '#silo-app',
        active: 'reports/silo-chat',
        user: { email: profile?.email || user.email, role: profile?.role },
        crumbs: ['Reports', 'Ask SILO'],
        supabaseClient: sb,
      });
    }
    el('input').focus();
  }

  boot();
</script>
</body>
</html>
