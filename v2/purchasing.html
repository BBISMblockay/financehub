<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SILO · Purchasing</title>
  <link rel="stylesheet" href="beacon.css" />
  <link rel="stylesheet" href="silo-brand.css" />
  <link rel="stylesheet" href="purchasing-suite.css" />
  <link rel="stylesheet" href="beacon-mirrors-unified.css" />
  <link rel="stylesheet" href="v2-mobile.css" />
  <script src="v2-shell.js" defer></script>
  <script src="nav-config.js"></script>
  <script src="avatar.js"></script>
  <script src="purchasing-suite.js"></script>
  <script src="silo-chrome.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../pages/config.js"></script>
  <script src="purchasing-overview.js"></script>
</head>
<body>
  <div class="silo-app" id="silo-app">
    <main class="silo-main">
      <header class="bcn-header">
        <div style="flex:1;min-width:0;">
          <h1 class="bcn-header-title">Purchasing</h1>
          <p class="bcn-header-sub">Purchase orders, landed cost and factories.</p>
        </div>
        <div class="bcn-header-actions">
          <label class="purch-sr" for="periodPicker">Period</label>
          <select id="periodPicker" class="bcn-field"></select>
          <button type="button" id="btnRefresh" class="bcn-btn bcn-btn--ghost">Refresh</button>
          <a class="bcn-btn bcn-btn--dark" href="/v2/po-builder.html">New PO</a>
        </div>
      </header>

      <section class="bcn-kpi-band" aria-label="Purchasing totals">
        <div class="bcn-kpi"><div class="bcn-kpi-label">Open POs</div><div class="bcn-kpi-value bcn-mono" id="kpiOpen">—</div></div>
        <div class="bcn-kpi"><div class="bcn-kpi-label">Incoming units</div><div class="bcn-kpi-value bcn-mono" id="kpiUnits">—</div></div>
        <div class="bcn-kpi"><div class="bcn-kpi-label">Est. cost</div><div class="bcn-kpi-value bcn-mono" id="kpiCost">—</div></div>
        <div class="bcn-kpi"><div class="bcn-kpi-label">Past due</div><div class="bcn-kpi-value bcn-mono" id="kpiLate">—</div></div>
      </section>

      <div class="purch-page">
        <div class="bcn-status" id="status" hidden></div>
        <p class="purch-muted" id="asOf">Loading…</p>

        <div class="purch-grid">
          <section class="purch-card purch-card--wide">
            <div class="purch-card-head"><h2>Arrivals</h2><a href="/v2/po-report.html">PO Report →</a></div>
            <div class="purch-chart" id="chartArrivals"><div class="purch-empty">—</div></div>
            <div class="purch-chips" id="chipsArrivals"></div>
          </section>

          <section class="purch-card">
            <div class="purch-card-head"><h2>Pipeline</h2><a href="/v2/po-builder.html">PO Builder →</a></div>
            <div class="purch-chart" id="chartPipeline"><div class="purch-empty">—</div></div>
          </section>

          <section class="purch-card">
            <div class="purch-card-head"><h2>Landed cost</h2><a href="/v2/po-costing.html">Landed Cost →</a></div>
            <div class="purch-chart" id="chartCosting"><div class="purch-empty">—</div></div>
          </section>

          <section class="purch-card">
            <div class="purch-card-head"><h2>Needs attention</h2><a href="/v2/po-report.html">Open →</a></div>
            <div class="purch-rows" id="cardAttention"><div class="purch-empty">—</div></div>
          </section>

          <section class="purch-card purch-card--wide">
            <div class="purch-card-head"><h2>Factories</h2><a href="/v2/factories.html">Factories →</a></div>
            <div class="purch-chart" id="chartFactories"><div class="purch-empty">—</div></div>
          </section>
        </div>

        <section class="purch-card">
          <div class="purch-card-head"><h2>Next arrivals</h2><a href="/v2/po-report.html">All POs →</a></div>
          <div id="cardArrivals"><div class="purch-empty">—</div></div>
        </section>
      </div>
    </main>
  </div>

  <script>
    (function () {
      'use strict';
      const Model = window.SiloPurchasingOverview;
      const el = (id) => document.getElementById(id);
      const statusEl = el('status');
      let statusTimer = null;

      function setStatus(msg, type, ms) {
        if (!statusEl) return;
        clearTimeout(statusTimer);
        if (!msg) { statusEl.hidden = true; statusEl.textContent = ''; return; }
        statusEl.className = 'bcn-status bcn-status--' + (type || 'info');
        statusEl.textContent = msg;
        statusEl.hidden = false;
        if (ms) statusTimer = setTimeout(() => { statusEl.hidden = true; }, ms);
      }

      const nf = new Intl.NumberFormat(undefined, { maximumFractionDigits: 0 });
      const n = (v) => (Number.isFinite(Number(v)) ? nf.format(Number(v)) : '—');
      function money(v, currency) {
        if (!Number.isFinite(Number(v))) return '—';
        if (!currency) return nf.format(Number(v));
        return new Intl.NumberFormat(undefined, {
          style: 'currency', currency, maximumFractionDigits: 0,
        }).format(Number(v));
      }

      // One row: a short label and its figure. `tone` colours only the figure.
      function rows(target, items) {
        const host = el(target);
        if (!host) return;
        host.textContent = '';
        const shown = items.filter(Boolean);
        if (!shown.length) {
          const empty = document.createElement('div');
          empty.className = 'purch-empty';
          empty.textContent = 'Nothing yet';
          host.append(empty);
          return;
        }
        for (const [label, value, tone] of shown) {
          const row = document.createElement('div');
          row.className = 'purch-row';
          const l = document.createElement('span');
          l.className = 'purch-row-label';
          l.textContent = label;
          const v = document.createElement('span');
          v.className = 'purch-row-value' + (tone ? ' purch-row-value--' + tone : '');
          v.textContent = value;
          row.append(l, v);
          host.append(row);
        }
      }

      // ── Charts ───────────────────────────────────────────────────────
      // Every chart below is drawn from the model's own numbers and states
      // each figure in text beside its bar, so the picture is never the only
      // way to read it. Colours are Beacon tokens, so both themes are right.
      const COLOR = {
        accent: 'var(--bcn-accent)',
        pos: 'var(--bcn-pos)',
        warn: 'var(--bcn-warn)',
        neg: 'var(--bcn-neg)',
        mute: 'var(--bcn-ink-3)',
        track: 'var(--bcn-border)',
      };

      function emptyInto(host, text) {
        host.textContent = '';
        const empty = document.createElement('div');
        empty.className = 'purch-empty';
        empty.textContent = text;
        host.append(empty);
      }

      // ── SVG helpers ──────────────────────────────────────────────────
      // Charts are drawn at the card's MEASURED pixel width and redrawn on
      // resize, so nothing is scaled: a 10px label is 10px on every screen.
      const SVGNS = 'http://www.w3.org/2000/svg';
      const svgEl = (name, attrs) => {
        const node = document.createElementNS(SVGNS, name);
        for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
        return node;
      };
      const tip = (node, text) => {
        const t = svgEl('title', {});
        t.textContent = text;
        node.append(t);
        return node;
      };

      // Redraw `draw(width)` into `host` whenever its width changes.
      const observers = new WeakMap();
      function responsive(host, draw) {
        const paint = () => {
          const width = Math.round(host.clientWidth);
          if (width < 80) return;
          host.textContent = '';
          host.append(draw(width));
        };
        observers.get(host)?.disconnect?.();
        if (typeof ResizeObserver === 'function') {
          const ro = new ResizeObserver(paint);
          ro.observe(host);
          observers.set(host, ro);
        } else {
          window.addEventListener('resize', paint);
        }
        paint();
      }

      // A rounded-top bar as a path, so the corners stay round at any height.
      function barPath(x, y, w, h, r) {
        const radius = Math.min(r, w / 2, h);
        return `M${x},${y + h}V${y + radius}a${radius},${radius} 0 0 1 ${radius},${-radius}`
          + `h${w - radius * 2}a${radius},${radius} 0 0 1 ${radius},${radius}V${y + h}Z`;
      }

      // ── Arrivals: gradient columns, with the cumulative line over them ──
      // The columns are what lands in each month; the line is the running
      // total, which is the question someone planning actually asks ("how
      // much will have arrived by March"). Past due is its own red column and
      // is NOT in the running total -- it has not arrived.
      function renderArrivalChart(model) {
        const host = el('chartArrivals');
        const chips = el('chipsArrivals');
        if (!host || !chips) return;
        chips.textContent = '';
        const t = model.incoming.timeline;
        const cols = [];
        if (t.pastDue.pos) cols.push({ label: 'Past due', units: t.pastDue.units, past: true });
        for (const m of t.months) cols.push({ label: m.label, units: m.units, key: m.key });
        if (!cols.length) { emptyInto(host, 'No open purchase orders'); return; }

        const thisMonth = model.today ? model.today.slice(0, 7) : null;
        let running = 0;
        for (const c of cols) { if (!c.past) { running += c.units; c.cum = running; } }
        const maxUnits = Math.max(...cols.map((c) => c.units), 1);
        const maxCum = Math.max(running, 1);

        responsive(host, (width) => {
          const H = 168;
          const padT = 20;
          const padB = 26;
          const plot = H - padT - padB;
          const gap = 10;
          const colW = Math.max(6, (width - gap * (cols.length - 1)) / cols.length);
          const svg = svgEl('svg', {
            width, height: H, viewBox: `0 0 ${width} ${H}`, class: 'purch-svg',
            role: 'img', 'aria-label': 'Units arriving by month',
          });
          const defs = svgEl('defs', {});
          for (const [id, token] of [['purchBar', '--bcn-accent'], ['purchBarPast', '--bcn-neg']]) {
            const g = svgEl('linearGradient', { id, x1: '0', y1: '0', x2: '0', y2: '1' });
            g.append(svgEl('stop', { offset: '0', 'stop-color': `var(${token})`, 'stop-opacity': '1' }));
            g.append(svgEl('stop', { offset: '1', 'stop-color': `var(${token})`, 'stop-opacity': '.42' }));
            defs.append(g);
          }
          svg.append(defs);

          // Three gridlines, so a column's height can be read, not guessed.
          for (let i = 0; i <= 2; i += 1) {
            const y = padT + (plot / 2) * i;
            svg.append(svgEl('line', {
              x1: 0, x2: width, y1: y, y2: y, class: 'purch-grid-line',
            }));
          }

          const centers = [];
          cols.forEach((c, i) => {
            const x = i * (colW + gap);
            const h = c.units ? Math.max(4, (c.units / maxUnits) * plot) : 2;
            const y = padT + plot - h;
            centers.push({ x: x + colW / 2, cum: c.cum });
            const bar = svgEl('path', {
              d: barPath(x, y, colW, h, 5),
              fill: c.units ? `url(#${c.past ? 'purchBarPast' : 'purchBar'})` : 'var(--bcn-border)',
            });
            svg.append(tip(bar, `${c.label}: ${n(c.units)} units`));
            if (c.units) {
              svg.append(Object.assign(svgEl('text', {
                x: x + colW / 2, y: y - 7, class: 'purch-svg-fig', 'text-anchor': 'middle',
              }), { textContent: n(c.units) }));
            }
            svg.append(Object.assign(svgEl('text', {
              x: x + colW / 2, y: H - 8, 'text-anchor': 'middle',
              class: 'purch-svg-x' + (c.key && c.key === thisMonth ? ' is-now' : ''),
            }), { textContent: c.label }));
          });

          // The running total, over the months only.
          const line = centers.filter((p) => typeof p.cum === 'number');
          if (line.length > 1) {
            // 88% of the plot, so the running total never rides the top
            // gridline or sits on a column's own figure.
            const yOf = (v) => padT + plot - (v / maxCum) * plot * 0.88;
            const d = line.map((p, i) => `${i ? 'L' : 'M'}${p.x.toFixed(1)},${yOf(p.cum).toFixed(1)}`).join('');
            svg.append(svgEl('path', { d, class: 'purch-svg-line' }));
            for (const p of line) {
              svg.append(tip(svgEl('circle', {
                cx: p.x, cy: yOf(p.cum), r: 3.2, class: 'purch-svg-dot',
              }), `Running total: ${n(p.cum)} units`));
            }
          }
          return svg;
        });

        const chip = (label, value, tone) => {
          if (!value) return;
          const c = document.createElement('span');
          c.className = 'purch-chip' + (tone ? ' purch-chip--' + tone : '');
          const b = document.createElement('b');
          b.textContent = n(value);
          c.append(b, document.createTextNode(label));
          chips.append(c);
        };
        chip(' units arriving in six months', running);
        chip(' units later', t.later.units);
        chip(' units undated', t.undated.units, 'warn');
        chip(' POs past due', t.pastDue.pos, 'neg');
      }

      // ── A donut, with the headline figure in the hole ──────────────────
      // Same data a stacked bar would carry; a ring reads as a whole made of
      // parts, which is what both of these are. The legend still names every
      // figure in text.
      function renderDonut(target, segments, centre, emptyText) {
        const host = el(target);
        if (!host) return;
        const shown = segments.filter((s) => s.value > 0);
        if (!shown.length) { emptyInto(host, emptyText); return; }
        const total = shown.reduce((sum, s) => sum + s.value, 0);
        host.textContent = '';

        const SIZE = 136;
        const STROKE = 15;
        const r = (SIZE - STROKE) / 2;
        const circ = 2 * Math.PI * r;
        const svg = svgEl('svg', {
          width: SIZE, height: SIZE, viewBox: `0 0 ${SIZE} ${SIZE}`, class: 'purch-donut',
          role: 'img', 'aria-label': centre.label,
        });
        const g = svgEl('g', { transform: `rotate(-90 ${SIZE / 2} ${SIZE / 2})` });
        g.append(svgEl('circle', {
          cx: SIZE / 2, cy: SIZE / 2, r, fill: 'none',
          stroke: 'var(--bcn-border)', 'stroke-width': STROKE,
        }));
        let offset = 0;
        for (const s of shown) {
          const len = (s.value / total) * circ;
          const arc = svgEl('circle', {
            cx: SIZE / 2, cy: SIZE / 2, r, fill: 'none', stroke: s.color,
            'stroke-width': STROKE, 'stroke-linecap': 'butt',
            'stroke-dasharray': `${Math.max(0, len - 1.5)} ${circ - Math.max(0, len - 1.5)}`,
            'stroke-dashoffset': -offset,
          });
          g.append(tip(arc, `${s.label}: ${n(s.value)}`));
          offset += len;
        }
        svg.append(g);
        svg.append(Object.assign(svgEl('text', {
          x: SIZE / 2, y: SIZE / 2 - 2, 'text-anchor': 'middle', class: 'purch-donut-value',
        }), { textContent: centre.value }));
        svg.append(Object.assign(svgEl('text', {
          x: SIZE / 2, y: SIZE / 2 + 15, 'text-anchor': 'middle', class: 'purch-donut-label',
        }), { textContent: centre.label }));

        const legend = document.createElement('div');
        legend.className = 'purch-legend';
        for (const s of shown) {
          const item = document.createElement('span');
          item.className = 'purch-legend-item';
          const dot = document.createElement('span');
          dot.className = 'purch-legend-dot';
          dot.style.background = s.color;
          const fig = document.createElement('span');
          fig.className = 'purch-legend-fig';
          fig.textContent = n(s.value);
          item.append(dot, document.createTextNode(s.label + ' '), fig);
          legend.append(item);
        }
        const wrap = document.createElement('div');
        wrap.className = 'purch-donut-wrap';
        wrap.append(svg, legend);
        host.append(wrap);
      }

      // Horizontal bars: the factories behind the open book.
      function renderFactoryChart(model) {
        const host = el('chartFactories');
        if (!host) return;
        const rows = model.factories.rows;
        if (!rows.length) { emptyInto(host, 'No open purchase orders'); return; }
        const max = Math.max(...rows.map((f) => f.units), 1);
        host.textContent = '';
        const wrap = document.createElement('div');
        wrap.className = 'purch-hbars';
        for (const f of rows) {
          const row = document.createElement('div');
          row.className = 'purch-hbar';
          const label = document.createElement('span');
          label.className = 'purch-hbar-label';
          label.textContent = f.factory;
          const fig = document.createElement('span');
          fig.className = 'purch-hbar-fig';
          fig.textContent = n(f.units) + ' units · ' + f.pos + ' PO' + (f.pos === 1 ? '' : 's');
          const track = document.createElement('div');
          track.className = 'purch-hbar-track';
          const fill = document.createElement('div');
          fill.className = 'purch-hbar-fill';
          fill.style.width = Math.max(2, Math.round((f.units / max) * 100)) + '%';
          track.append(fill);
          row.append(label, fig, track);
          wrap.append(row);
        }
        host.append(wrap);
        if (model.factories.count !== null) {
          const note = document.createElement('div');
          note.className = 'purch-chips';
          const chip = document.createElement('span');
          chip.className = 'purch-chip';
          const b = document.createElement('b');
          b.textContent = n(model.factories.count);
          chip.append(b, document.createTextNode(' on file'));
          note.append(chip);
          host.append(note);
        }
      }

      function renderArrivals(model) {
        const host = el('cardArrivals');
        if (!host) return;
        host.textContent = '';
        if (!model.incoming.rows.length) {
          emptyInto(host, 'No dated arrivals on open POs');
          return;
        }
        const table = document.createElement('table');
        table.className = 'purch-table';
        const head = document.createElement('tr');
        for (const [text, cls] of [['PO'], ['Factory'], ['Arrives'], ['Units', 'purch-num'], ['Shipment']]) {
          const th = document.createElement('th');
          th.textContent = text;
          if (cls) th.className = cls;
          head.append(th);
        }
        const thead = document.createElement('thead');
        thead.append(head);
        const tbody = document.createElement('tbody');
        for (const row of model.incoming.rows) {
          const tr = document.createElement('tr');
          const name = document.createElement('td');
          const link = document.createElement('a');
          link.href = '/v2/po-builder.html?po_id=' + encodeURIComponent(row.id);
          link.textContent = row.name;
          name.append(link);
          const factory = document.createElement('td');
          factory.textContent = row.factory || '—';
          const date = document.createElement('td');
          date.textContent = row.date || '—';
          if (row.late) date.className = 'purch-late';
          const units = document.createElement('td');
          units.className = 'purch-num';
          units.textContent = n(row.units);
          const state = document.createElement('td');
          state.textContent = row.state;
          tr.append(name, factory, date, units, state);
          tbody.append(tr);
        }
        table.append(thead, tbody);
        host.append(table);
      }

      // The pipeline's colours run cold to warm along the workflow, so the
      // bar reads left to right as "written" through "arrived".
      // Each status gets its own shade so the legend is unambiguous, mixed
      // from the Beacon tokens rather than from new colours: cool while the
      // order is being placed, warm while it is moving, green once it lands.
      const shade = (token, pct) => `color-mix(in oklab, var(${token}) ${pct}%, var(--bcn-surface))`;
      const STATUS_COLOR = {
        Draft: 'var(--bcn-ink-3)',
        Approved: shade('--bcn-accent', 100),
        'Sent to Factory': shade('--bcn-accent', 72),
        Confirmed: shade('--bcn-accent', 48),
        'In Production': shade('--bcn-warn', 100),
        Shipped: shade('--bcn-warn', 72),
        'In Transit': shade('--bcn-warn', 48),
        'Partially Received': shade('--bcn-pos', 55),
        Received: shade('--bcn-pos', 100),
        Closed: 'var(--bcn-border-strong)',
        Cancelled: 'var(--bcn-border)',
      };

      function render(model) {
        const cur = model.currency;
        el('kpiOpen').textContent = n(model.builder.open);
        el('kpiUnits').textContent = n(model.incoming.units);
        el('kpiCost').textContent = money(model.incoming.estimatedCost, cur);
        el('kpiLate').textContent = n(model.incoming.late);

        const co = model.company?.title || model.company?.entity_key || '';
        const period = Model.resolveWindow(model.windowDays);
        el('asOf').textContent = [
          model.today ? 'As of ' + model.today : null,
          co,
          // Open POs are never cut by the window, so say so once, here, rather
          // than on each card that could be misread without it.
          model.cutoff ? period.label.toLowerCase() + ', plus every open PO' : 'all time',
        ].filter(Boolean).join(' · ');

        renderArrivalChart(model);

        renderDonut('chartPipeline', model.builder.byStatus.map((s) => ({
          label: s.status, value: s.count, color: STATUS_COLOR[s.status] || COLOR.mute,
        })), { value: n(model.builder.total), label: 'POs' }, 'No purchase orders yet');

        const costed = model.costing.state === 'known'
          ? model.costing.fob + model.costing.freight + model.costing.final : 0;
        const costedOf = model.costing.state === 'known'
          ? costed + model.costing.notStarted : 0;
        renderDonut('chartCosting', model.costing.state === 'known' ? [
          { label: Model.PHASE_LABEL.final, value: model.costing.final, color: COLOR.pos },
          { label: Model.PHASE_LABEL.freight, value: model.costing.freight, color: COLOR.warn },
          { label: Model.PHASE_LABEL.fob, value: model.costing.fob, color: COLOR.accent },
          { label: 'Not started', value: model.costing.notStarted, color: COLOR.track },
        ] : [], {
          value: costedOf ? Math.round((costed / costedOf) * 100) + '%' : '—',
          label: 'costed',
        }, model.costing.state === 'known' ? 'No open purchase orders' : 'Could not read costing');

        renderFactoryChart(model);

        rows('cardAttention', [
          ['Drafts', n(model.builder.drafts)],
          ['Past due', n(model.incoming.late), model.incoming.late ? 'neg' : null],
          ['No shipment logged', n(model.incoming.noShipment), model.incoming.noShipment ? 'warn' : null],
          ['No arrival date', n(model.incoming.undated), model.incoming.undated ? 'warn' : null],
          model.incoming.conflicts ? ['Status conflicts', n(model.incoming.conflicts), 'warn'] : null,
        ]);

        renderArrivals(model);

        if (model.errors.length) {
          setStatus('Some figures could not be read: '
            + model.errors.map((e) => e.source).join(', '), 'warn');
        } else {
          setStatus('', null);
        }
      }

      // The period lives in the address bar, so a link to this page carries
      // the window someone was looking at.
      const urlWindow = () => {
        const raw = new URLSearchParams(window.location.search).get('period');
        if (raw === 'all') return null;
        const days = Number(raw);
        return Number.isFinite(days) && days > 0 ? days : Model.DEFAULT_WINDOW_DAYS;
      };
      function fillPeriodPicker(selected) {
        const picker = el('periodPicker');
        if (!picker) return;
        picker.textContent = '';
        for (const w of Model.WINDOWS) {
          const option = document.createElement('option');
          option.value = w.days === null ? 'all' : String(w.days);
          option.textContent = w.label;
          if (w.days === selected) option.selected = true;
          picker.append(option);
        }
      }

      const startWindow = urlWindow();
      fillPeriodPicker(startWindow);

      Model.boot({
        active: 'purchasing/home',
        crumbs: ['Purchasing', 'Overview'],
        windowDays: startWindow,
        onModel: render,
        onError: (error) => setStatus(error.message || 'Could not load purchasing', 'neg'),
      }).then((controller) => {
        el('btnRefresh')?.addEventListener('click', () => {
          setStatus('Refreshing…', 'info');
          controller?.refresh().catch(() => {});
        });
        el('periodPicker')?.addEventListener('change', (event) => {
          const raw = event.target.value;
          const days = raw === 'all' ? null : Number(raw);
          const url = new URL(window.location.href);
          url.searchParams.set('period', raw);
          try { window.history.replaceState(null, '', url); } catch (e) { /* keep the URL */ }
          setStatus('Loading…', 'info');
          controller?.refresh(days).catch(() => {});
        });
      }).catch(() => {});
    })();
  </script>
</body>
</html>
