<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SILO · Reports</title>
  <link rel="stylesheet" href="beacon.css" />
  <link rel="stylesheet" href="silo-brand.css" />
  <style>
    .silo-main { min-width: 0; overflow: hidden; }
    .bcn-header { position: sticky; top: 0; z-index: 30;
      background: var(--bcn-surface); border-bottom: 1px solid var(--bcn-border); }
    .qr-page { flex: 1; min-height: 0; overflow: auto; background: var(--bcn-bg); padding: 16px 20px 64px; }

    .qr-filters {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end;
      background: var(--bcn-surface); border: 1px solid var(--bcn-border);
      border-radius: 12px; padding: 12px 14px; margin-bottom: 14px;
    }
    /* Report picker: one tile per statement, so choosing a report is the
       first click rather than a dropdown hunt. Dates and the account filter
       stay ordinary controls in the bar beneath. */
    .qr-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
      gap: 8px; margin-bottom: 10px; }
    .qr-tile { display: flex; flex-direction: column; gap: 3px; text-align: left; cursor: pointer;
      background: var(--bcn-surface); color: var(--bcn-ink); border: 1px solid var(--bcn-border);
      border-radius: 10px; padding: 10px 12px; font: inherit; }
    .qr-tile:hover { border-color: var(--bcn-accent); }
    .qr-tile[aria-pressed="true"] { border-color: var(--bcn-accent);
      box-shadow: inset 0 0 0 1px var(--bcn-accent); background: var(--bcn-accent-soft, #eaf1fb); }
    .qr-tile-name { font-weight: 650; font-size: 13px; }
    .qr-tile-desc { font-size: 11px; line-height: 1.35; color: var(--bcn-ink-3); }
    .qr-field { display: flex; flex-direction: column; gap: 4px; }
    .qr-field label {
      font-family: var(--bcn-mono); font-size: 10px; text-transform: uppercase;
      letter-spacing: .04em; color: var(--bcn-ink-3);
    }
    .qr-field select, .qr-field input { font-size: 12px; min-width: 150px; }
    .qr-field--wide select { min-width: 280px; }

    .qr-card {
      background: var(--bcn-surface); border: 1px solid var(--bcn-border);
      border-radius: 12px; overflow: hidden;
    }
    .qr-card-head {
      padding: 10px 14px; border-bottom: 1px solid var(--bcn-border);
      display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    }
    .qr-title { font-weight: 650; font-size: 14px; }
    .qr-sub { font-family: var(--bcn-mono); font-size: 11px; color: var(--bcn-ink-3); }

    .qr-scroll { overflow: auto; max-height: 68vh; }
    .qr-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .qr-table th {
      position: sticky; top: 0; background: var(--bcn-sunken); text-align: left;
      font-family: var(--bcn-mono); font-size: 10px; text-transform: uppercase;
      letter-spacing: .04em; color: var(--bcn-ink-3);
      padding: 7px 10px; border-bottom: 1px solid var(--bcn-border); white-space: nowrap;
    }
    .qr-table td { padding: 5px 10px; border-bottom: 1px solid var(--bcn-border); vertical-align: top; }
    .qr-table tr:hover td { background: var(--bcn-sunken); }
    .qr-num { text-align: right; font-family: var(--bcn-mono); white-space: nowrap; }
    .qr-neg { color: var(--bcn-neg); }
    /* Section and total rows carry QBO's own hierarchy; indentation is the only
       thing that makes a nested balance sheet readable. */
    .qr-depth-0 > td:first-child { font-weight: 650; }
    .qr-summary td { font-weight: 650; background: var(--bcn-sunken); }
    /* Rows QBO gave an account id: clicking one starts an adjustment against
       it, so the affordance has to be visible without shouting. */
    .qr-clickable { cursor: pointer; }
    .qr-clickable td:first-child { text-decoration: underline;
      text-decoration-color: var(--bcn-border-strong, #c3cdc8);
      text-underline-offset: 2px; }
    .qr-clickable:hover td { background: var(--bcn-accent-soft, #eaf1fb); }
    .qr-empty { padding: 28px; text-align: center; color: var(--bcn-ink-3); font-size: 13px; }

    .qr-check { display: flex; align-items: center; gap: 6px; padding-bottom: 6px; }
    .qr-check label { font-size: 12px; color: var(--bcn-ink-2); user-select: none; cursor: pointer; }
    .qr-check input { cursor: pointer; }

    /* ---------- drill-down: account transactions, and JE detail within it ---------- */
    .qr-drill-scrim { position: fixed; inset: 0; z-index: 95; background: rgba(15,23,42,.72);
      backdrop-filter: blur(2px);
      display: flex; align-items: flex-start; justify-content: center; padding: 32px 16px;
      overflow: auto; }
    /* The [hidden] attribute is only a UA-stylesheet default (display:none) --
       an author rule that sets display on the SAME element, even one with no
       higher specificity, wins over it because author origin beats UA origin
       regardless of specificity ties. Setting display: flex above, with no
       [hidden] override, meant this full-screen fixed overlay rendered AND
       intercepted every click on the whole page from the moment it loaded,
       hidden attribute or not -- confirmed with elementFromPoint() landing on
       this scrim instead of a real button behind it, in both the shown and
       "hidden" state. This is what made the page look entirely unresponsive,
       not a one-off state -- it was live from the moment the drill-down
       shipped. */
    .qr-drill-scrim[hidden] { display: none; }
    .qr-drill-modal { background: var(--bcn-surface); color: var(--bcn-ink);
      border: 1px solid var(--bcn-border); border-radius: 12px;
      width: min(1180px, 96vw); box-shadow: 0 18px 48px rgba(15,23,42,.35);
      display: flex; flex-direction: column; max-height: calc(100vh - 64px);
      /* A body with no content yet (still loading, or a stuck/stale tab
         state) would otherwise let this collapse to just the head and foot
         glued together -- indistinguishable from broken. */
      min-height: min(360px, 60vh); }
    .qr-drill-head { flex: none; display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--bcn-border); }
    .qr-drill-title { font-size: 14px; font-weight: 650; }
    .qr-drill-sub { font-family: var(--bcn-mono); font-size: 10.5px; color: var(--bcn-ink-3); margin-top: 2px; }
    .qr-drill-body { flex: 1; min-height: 0; overflow: auto; padding: 14px;
      display: flex; flex-direction: column; }
    .qr-drill-body > .qr-empty { flex: 1; display: flex; align-items: center;
      justify-content: center; margin: 0; }
    .qr-drill-foot { flex: none; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      padding: 11px 14px; border-top: 1px solid var(--bcn-border); background: var(--bcn-sunken); }
    .qr-drill-back { display: inline-block; margin-bottom: 10px; cursor: pointer;
      font-size: 12.5px; color: var(--bcn-accent); background: none; border: none; padding: 0; }
    .qr-drill-back:hover { text-decoration: underline; }
    /* A row is a Journal Entry with an id -- QBO gave us enough to drill one level
       further, into that entry's own lines. */
    .qr-je-row { cursor: pointer; }
    .qr-je-row td:nth-child(2) { text-decoration: underline;
      text-decoration-color: var(--bcn-border-strong, #c3cdc8); text-underline-offset: 2px; }
    .qr-je-row:hover td { background: var(--bcn-accent-soft, #eaf1fb); }
    .qr-je-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
      background: var(--bcn-accent-soft, #eaf1fb); color: var(--bcn-accent);
      border: 1px solid var(--bcn-accent); border-radius: 6px; padding: 6px 10px; margin-bottom: 12px; }
    .qr-je-meta { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 12px; }
    .qr-je-meta div { display: flex; flex-direction: column; gap: 2px; }
    .qr-je-meta span { font-family: var(--bcn-mono); font-size: 9.5px; text-transform: uppercase;
      letter-spacing: .04em; color: var(--bcn-ink-3); }
    .qr-je-meta strong { font-size: 12.5px; font-weight: 650; }
  </style>
  <link rel="stylesheet" href="accounting-suite.css?v=615de4bff781" />
  <link rel="stylesheet" href="beacon-mirrors-unified.css" />
  <link rel="stylesheet" href="v2-mobile.css" />
  <script src="v2-shell.js" defer></script>
  <script src="nav-config.js"></script>
  <script src="avatar.js"></script>
  <script src="accounting-suite.js"></script>
  <script src="silo-chrome.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/pages/config.js"></script>
  <script src="je-composer.js"></script>
</head>
<body>
  <div class="silo-app" id="silo-app">
    <main class="silo-main accounting-workspace">
      <header class="bcn-header">
        <div class="bcn-header-title">
          <div>Reports</div>
          <div class="bcn-header-sub" id="subTitle">Run financial statements and explore transaction detail from QuickBooks.</div>
        </div>
        <div class="bcn-header-actions">
          <button class="bcn-btn bcn-btn--primary" id="btnRun">Run report</button>
          <a class="bcn-btn" href="accounting-books.html#register" title="Staged, posted and voided journal entries">Journals</a>
          <button class="bcn-btn" id="btnCsv">CSV</button>
        </div>
      </header>

      <div class="qr-page">
        <div class="bcn-status" id="status" hidden></div>

        <div class="qr-tiles" id="reportTiles" aria-label="Report">
          <button type="button" class="qr-tile" data-report="ProfitAndLoss" aria-pressed="false"><span class="qr-tile-name">Profit &amp; Loss</span><span class="qr-tile-desc">Income and expenses for the period</span></button>
          <button type="button" class="qr-tile" data-report="BalanceSheet" aria-pressed="false"><span class="qr-tile-name">Balance Sheet</span><span class="qr-tile-desc">Assets, liabilities and equity at the end date</span></button>
          <button type="button" class="qr-tile" data-report="TrialBalance" aria-pressed="false"><span class="qr-tile-name">Trial Balance</span><span class="qr-tile-desc">Every account's debit or credit balance</span></button>
          <button type="button" class="qr-tile" data-report="GeneralLedger" aria-pressed="true"><span class="qr-tile-name">General Ledger</span><span class="qr-tile-desc">Transaction detail by account</span></button>
          <button type="button" class="qr-tile" data-report="CashFlow" aria-pressed="false"><span class="qr-tile-name">Cash Flow</span><span class="qr-tile-desc">Operating, investing and financing cash</span></button>
          <button type="button" class="qr-tile" data-report="ProfitAndLossDetail" aria-pressed="false"><span class="qr-tile-name">P&amp;L Detail</span><span class="qr-tile-desc">The transactions behind the P&amp;L</span></button>
          <button type="button" class="qr-tile" data-report="TransactionList" aria-pressed="false"><span class="qr-tile-name">Transaction List</span><span class="qr-tile-desc">Every transaction in the period</span></button>
        </div>
        <div class="qr-filters">
          <input type="hidden" id="report" value="GeneralLedger" />
          <div class="qr-field qr-field--wide" id="accountField">
            <label for="account">Account filter</label>
            <select class="bcn-field bcn-field--mono" id="account">
              <option value="">— all accounts —</option>
            </select>
          </div>

          <div class="qr-field">
            <label for="from">From</label>
            <input class="bcn-field" id="from" type="date" />
          </div>
          <div class="qr-field">
            <label for="to">To</label>
            <input class="bcn-field" id="to" type="date" />
          </div>

          <div class="qr-field">
            <label for="method">Method</label>
            <select class="bcn-field" id="method">
              <option value="Accrual" selected>Accrual</option>
              <option value="Cash">Cash</option>
            </select>
          </div>

          <div class="qr-field">
            <label>&nbsp;</label>
            <div class="qr-check">
              <input type="checkbox" id="byMonth" />
              <label for="byMonth">By month</label>
            </div>
          </div>
        </div>

        <div class="qr-card">
          <div class="qr-card-head">
            <div>
              <div class="qr-title" id="cardTitle">No report run yet</div>
              <div class="qr-sub" id="cardSub">Pick a report above to run it</div>
            </div>
            <div class="qr-sub" id="rowCount"></div>
          </div>
          <div class="qr-scroll">
            <table class="qr-table" id="tbl">
              <tbody><tr><td class="qr-empty">Nothing loaded.</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="qr-drill-scrim" id="drillScrim" hidden>
    <div class="qr-drill-modal" role="dialog" aria-modal="true" aria-label="Account detail">
      <div class="qr-drill-head">
        <div>
          <div class="qr-drill-title" id="drillTitle">Account detail</div>
          <div class="qr-drill-sub" id="drillSub"></div>
        </div>
        <button class="bcn-btn" id="drillClose">Close</button>
      </div>
      <div class="qr-drill-body" id="drillBody"></div>
      <div class="qr-drill-foot">
        <button class="bcn-btn bcn-btn--dark" id="drillPostAdjustment">Post adjustment for this account</button>
      </div>
    </div>
  </div>

<script>
(function () {
  const cfg = window.__SILO_CONFIG__ || {};
  const SUPABASE_URL = cfg.SUPABASE_URL || '';
  const SUPABASE_ANON_KEY = cfg.SUPABASE_ANON_KEY || '';

  if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
    document.querySelector('.silo-main').innerHTML =
      '<div style="padding:48px;text-align:center;font-weight:700">Missing Supabase config</div>';
    return;
  }

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const FUNCTIONS_URL = SUPABASE_URL.replace('/rest/v1', '') + '/functions/v1';

  let _co = null;
  let lastRows = [];

  const el = (id) => document.getElementById(id);
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // QBO ships report cells as plain, unformatted number strings ("1336106.85") --
  // formatted here rather than trusted from the API so every report reads the
  // same regardless of what that particular report happened to send. Parens
  // for negative match the accounting-statement convention the rest of the
  // report already implies (indentation, summary rows).
  function fmtNum(num) {
    const s = Math.abs(num).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return num < 0 ? `(${s})` : s;
  }

  function reportNumber(value) {
    const text = String(value ?? '').trim();
    if (!/^-?(?:\d+|\d{1,3}(?:,\d{3})+)(?:\.\d+)?$/.test(text)) return null;
    const number = Number(text.replace(/,/g, ''));
    return Number.isFinite(number) ? number : null;
  }

  function numericColumns(rows, cols) {
    return cols.map((col, i) => {
      const key = (col.MetaData || []).find(m => m.Name === 'ColKey')?.Value || '';
      const type = String(col.ColType || '').toLowerCase();
      // IDs, document numbers and metadata stay text even when all values are digits.
      if (/^(txn_type|doc_num|date|name|memo|account|split|txn_id)$/.test(key)
          || /^(num|number|transaction type|date|name|memo.*|account.*|split)$/.test(String(col.ColTitle || '').toLowerCase())) return false;
      if (['money', 'amount'].includes(type) || /^(amount|debit|credit|balance|subt.*)$/.test(key)) return true;
      if (i === 0 || (type && !['string', ''].includes(type))) return false;
      const values = rows.map(row => row.cells?.[i]?.value).filter(v => v != null && String(v).trim() !== '');
      return values.length > 0 && values.every(v => reportNumber(v) !== null);
    });
  }

  function setStatus(msg, type = 'info', ms = 0) {
    const s = el('status');
    s.className = `bcn-status bcn-status--${type}`;
    s.textContent = msg;
    s.hidden = false;
    if (ms) setTimeout(() => { s.hidden = true; }, ms);
  }

  // QBO returns reports as arbitrarily nested Rows, mixing detail rows,
  // section headers and summaries. Flatten to a list while keeping depth, so
  // the hierarchy that makes a balance sheet legible survives.
  function flatten(node, depth = 0, out = []) {
    const rows = node?.Rows?.Row ?? node?.Row ?? null;
    if (Array.isArray(rows)) {
      for (const r of rows) {
        if (r.Header?.ColData) {
          out.push({ depth, cells: r.Header.ColData, kind: 'header' });
        }
        if (r.ColData) {
          out.push({ depth, cells: r.ColData, kind: r.type === 'Section' ? 'header' : 'data' });
        }
        if (r.Rows) flatten(r, depth + 1, out);
        if (r.Summary?.ColData) {
          out.push({ depth, cells: r.Summary.ColData, kind: 'summary' });
        }
      }
    }
    return out;
  }

  // Finds a report column by QBO's own ColKey metadata (e.g. 'txn_type') rather
  // than a hardcoded index -- the General Ledger column order is stable today,
  // but reading the key QBO actually gave us costs nothing and doesn't break
  // silently if that ever changes.
  function colIndexByKey(cols, key) {
    return cols.findIndex((c) =>
      (c.MetaData || []).some((m) => m.Name === 'ColKey' && m.Value === key));
  }

  function render(payload) {
    const cols = payload?.Columns?.Column ?? [];
    const headers = cols.map((c) => c.ColTitle || c.ColType || '');
    lastRows = flatten(payload);

    const tbl = el('tbl');
    if (!lastRows.length) {
      tbl.innerHTML = '<tbody><tr><td class="qr-empty">'
        + 'Report returned no rows for that filter.</td></tr></tbody>';
      return;
    }

    const numCols = numericColumns(lastRows, cols);
    const thead = `<thead><tr>${headers.map((h, i) =>
      `<th${numCols[i] ? ' class="qr-num"' : ''}>${esc(h)}</th>`).join('')}</tr></thead>`;

    const body = lastRows.map((r) => {
      const cls = r.kind === 'summary' ? 'qr-summary' : `qr-depth-${r.depth}`;
      // QBO stamps the account id on the first cell of an account row. Where it
      // is there, the row opens that account's transactions (and an adjustment from there).
      const acctId = r.cells?.[0]?.id ? String(r.cells[0].id) : '';
      const tds = headers.map((_, i) => {
        const cell = r.cells[i];
        const v = cell?.value ?? '';
        if (i === 0) {
          return `<td style="padding-left:${10 + r.depth * 14}px">${esc(v)}</td>`;
        }
        if (!numCols[i]) return `<td>${esc(v)}</td>`;
        const num = reportNumber(v);
        const isNum = num !== null;
        return `<td class="qr-num${isNum && num < 0 ? ' qr-neg' : ''}">${isNum ? fmtNum(num) : esc(v)}</td>`;
      }).join('');
      return `<tr class="${cls}${acctId ? ' qr-clickable' : ''}"`
        + (acctId
          ? ` data-acct="${esc(acctId)}" data-label="${esc(r.cells[0].value || '')}"`
            + ' title="Open this account\'s transactions"'
          : '')
        + `>${tds}</tr>`;
    }).join('');

    tbl.innerHTML = thead + `<tbody>${body}</tbody>`;
    el('rowCount').textContent = `${lastRows.length} rows`;
  }

  async function loadAccounts() {
    let q = sb.from('quickbooks_accounts')
      .select('qbo_account_id, name, fully_qualified_name, account_type')
      .eq('is_active', true)
      .order('fully_qualified_name');
    if (_co?.id) q = q.eq('company_entity_id', _co.id);
    const { data, error } = await q;
    if (error) { console.warn('accounts load failed', error); return; }
    const sel = el('account');
    for (const a of data || []) {
      const o = document.createElement('option');
      o.value = a.qbo_account_id;
      o.textContent = (a.fully_qualified_name || a.name)
        + (a.account_type ? ` · ${a.account_type}` : '');
      sel.appendChild(o);
    }
  }

  // ---- drill-down: an account row opens its transactions for the current
  // period, and a Journal Entry row within that opens the entry's own lines.
  // Nothing here posts anything -- Post Adjustment lives in the footer as its
  // own explicit action, seeded with the account being looked at.
  const drillState = { acctId: null, acctLabel: null, payload: null };

  async function openDrilldown(acctId, acctLabel) {
    drillState.acctId = acctId;
    drillState.acctLabel = acctLabel;
    drillState.payload = null;
    el('drillScrim').hidden = false;
    el('drillTitle').textContent = acctLabel || 'Account detail';
    el('drillSub').textContent =
      `${el('from').value || 'start'} → ${el('to').value || 'today'} · ${el('method').value}`;
    el('drillBody').innerHTML = '<div class="qr-empty">Loading transactions…</div>';

    try {
      const { data: { session } } = await sb.auth.getSession();
      const res = await fetch(`${FUNCTIONS_URL}/quickbooks-report`, {
        method: 'POST',
        headers: {
          Authorization: `Bearer ${session.access_token}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          report_name: 'GeneralLedger',
          params: {
            account: acctId,
            start_date: el('from').value || undefined,
            end_date: el('to').value || undefined,
            accounting_method: el('method').value,
          },
        }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || String(res.status));
      drillState.payload = body.report;
      renderDrillTransactions(body.report);
    } catch (e) {
      el('drillBody').innerHTML =
        `<div class="qr-empty">Could not load transactions — ${esc(e.message)}</div>`;
    }
  }

  function renderDrillTransactions(payload) {
    el('drillTitle').textContent = drillState.acctLabel || 'Account detail';
    el('drillSub').textContent =
      `${el('from').value || 'start'} → ${el('to').value || 'today'} · ${el('method').value}`;

    const cols = payload?.Columns?.Column ?? [];
    const headers = cols.map((c) => c.ColTitle || c.ColType || '');
    const rows = flatten(payload);
    const typeIdx = colIndexByKey(cols, 'txn_type');

    if (!rows.length) {
      el('drillBody').innerHTML =
        '<div class="qr-empty">No transactions in this account for the selected period.</div>';
      return;
    }

    const numCols = numericColumns(rows, cols);
    const thead = `<thead><tr>${headers.map((h, i) =>
      `<th${numCols[i] ? ' class="qr-num"' : ''}>${esc(h)}</th>`).join('')}</tr></thead>`;

    const body = rows.map((r) => {
      const cls = r.kind === 'summary' ? 'qr-summary' : `qr-depth-${r.depth}`;
      // Same drill-one-level-further shape as the account row itself: QBO put
      // the transaction's own id on the Transaction Type cell whenever the row
      // is a Journal Entry, confirmed against a real GeneralLedger run.
      const typeCell = typeIdx >= 0 ? r.cells?.[typeIdx] : null;
      const isJe = typeCell?.value === 'Journal Entry' && typeCell?.id;
      const tds = headers.map((_, i) => {
        const cell = r.cells[i];
        const v = cell?.value ?? '';
        if (!numCols[i]) return `<td>${esc(v)}</td>`;
        const num = reportNumber(v);
        const isNum = num !== null;
        return `<td class="qr-num${isNum && num < 0 ? ' qr-neg' : ''}">${isNum ? fmtNum(num) : esc(v)}</td>`;
      }).join('');
      return `<tr class="${cls}${isJe ? ' qr-je-row' : ''}"`
        + (isJe ? ` data-je="${esc(typeCell.id)}" title="Open this journal entry"` : '')
        + `>${tds}</tr>`;
    }).join('');

    el('drillBody').innerHTML = `<table class="qr-table">${thead}<tbody>${body}</tbody></table>`;
  }

  async function openJeDetail(jeId) {
    el('drillTitle').textContent = `Journal Entry ${esc(jeId)}`;
    el('drillSub').innerHTML = '<button class="qr-drill-back" id="drillBack">← Back to transactions</button>';
    el('drillBody').innerHTML = '<div class="qr-empty">Loading…</div>';

    // Enrichment only -- whether SILO itself posted this entry, and its own
    // audit trail. A lookup failure here should never block the QBO-sourced
    // detail below, which is why its own errors are swallowed rather than
    // thrown.
    let posting = null;
    try {
      const { data } = await sb.from('quickbooks_journal_postings')
        .select('source, status, posted_at, qbo_doc_number')
        .eq('qbo_journal_entry_id', String(jeId))
        .maybeSingle();
      posting = data || null;
    } catch { /* enrichment only */ }

    try {
      const { data: { session } } = await sb.auth.getSession();
      const res = await fetch(`${FUNCTIONS_URL}/quickbooks-report`, {
        method: 'POST',
        headers: {
          Authorization: `Bearer ${session.access_token}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ journal_entry_id: jeId }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || String(res.status));
      renderJeDetail(body.journal_entry, posting);
    } catch (e) {
      el('drillBody').innerHTML = `<div class="qr-empty">Could not load this entry — ${esc(e.message)}</div>`;
    }
  }

  const JE_SOURCE_LABEL = { card_import: 'Card Coding', journal_adjustment: 'Journal Adjustments' };

  function renderJeDetail(je, posting) {
    if (!je) {
      el('drillBody').innerHTML = '<div class="qr-empty">QuickBooks returned no entry.</div>';
      return;
    }

    const lines = je.Line || [];
    const dr = lines.filter((l) => l.JournalEntryLineDetail?.PostingType === 'Debit')
      .reduce((n, l) => n + Number(l.Amount || 0), 0);
    const cr = lines.filter((l) => l.JournalEntryLineDetail?.PostingType === 'Credit')
      .reduce((n, l) => n + Number(l.Amount || 0), 0);

    const badge = posting
      ? `<div class="qr-je-badge">Posted via SILO — ${esc(JE_SOURCE_LABEL[posting.source] || posting.source)}`
        + ` · ${esc(posting.status)}`
        + (posting.posted_at ? ` · ${new Date(posting.posted_at).toLocaleString()}` : '')
        + '</div>'
      : '';

    const rows = lines.map((l) => {
      const d = l.JournalEntryLineDetail || {};
      const amt = Number(l.Amount || 0);
      return `<tr>
        <td>${esc(d.AccountRef?.name || d.AccountRef?.value || '—')}</td>
        <td>${esc(d.DepartmentRef?.name || '—')}</td>
        <td>${esc(d.Entity?.EntityRef?.name || '—')}</td>
        <td>${esc(l.Description || '—')}</td>
        <td class="qr-num">${d.PostingType === 'Debit' ? fmtNum(amt) : ''}</td>
        <td class="qr-num">${d.PostingType === 'Credit' ? fmtNum(amt) : ''}</td>
      </tr>`;
    }).join('');

    el('drillBody').innerHTML = `
      ${badge}
      <div class="qr-je-meta">
        <div><span>Date</span><strong>${esc(je.TxnDate || '—')}</strong></div>
        <div><span>Doc #</span><strong>${esc(je.DocNumber || '—')}</strong></div>
        <div><span>Memo</span><strong>${esc(je.PrivateNote || '—')}</strong></div>
      </div>
      <table class="qr-table">
        <thead><tr><th>Account</th><th>Location</th><th>Entity</th><th>Description</th>
          <th class="qr-num">Debit</th><th class="qr-num">Credit</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr class="qr-summary"><td colspan="4">Totals</td>
          <td class="qr-num">${fmtNum(dr)}</td><td class="qr-num">${fmtNum(cr)}</td></tr></tfoot>
      </table>`;
  }

  // Reports QBO can actually break into monthly columns. The detail reports
  // (GeneralLedger, TransactionList, ProfitAndLossDetail) are already
  // transaction-level -- summarize_column_by doesn't apply to them.
  const SUMMARY_REPORTS = ['BalanceSheet', 'ProfitAndLoss', 'TrialBalance', 'CashFlow'];
  const ACCOUNT_FILTER_REPORTS = ['GeneralLedger', 'TransactionList', 'ProfitAndLossDetail'];

  async function run() {
    const report = el('report').value;
    const params = {
      start_date: el('from').value || undefined,
      end_date: el('to').value || undefined,
      accounting_method: el('method').value,
    };
    if (el('byMonth').checked) {
      if (SUMMARY_REPORTS.includes(report)) {
        params.summarize_column_by = 'Month';
      } else {
        setStatus(`${report} doesn't break out by month — showing the full range as one column.`,
          'info', 6000);
      }
    }
    // Only the transaction-level reports accept an account filter; sending it
    // to a Balance Sheet is silently ignored by QBO, which reads as the filter
    // not working rather than not applying.
    const acct = el('account').value;
    if (acct && ACCOUNT_FILTER_REPORTS.includes(report)) {
      params.account = acct;
    } else if (acct) {
      setStatus(`${report} does not support an account filter — running unfiltered.`, 'info', 6000);
    }

    el('btnRun').disabled = true;
    setStatus('Fetching from QuickBooks…', 'info');
    try {
      const { data: { session } } = await sb.auth.getSession();
      const res = await fetch(`${FUNCTIONS_URL}/quickbooks-report`, {
        method: 'POST',
        headers: {
          Authorization: `Bearer ${session.access_token}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ report_name: report, params }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        setStatus(`Report failed: ${body.error || res.status}`, 'neg', 12000);
        return;
      }
      el('cardTitle').textContent =
        document.querySelector(`#reportTiles [data-report="${report}"] .qr-tile-name`)?.textContent || report;
      el('cardSub').textContent =
        `${params.start_date || 'start'} → ${params.end_date || 'today'} · ${params.accounting_method}`
        + ` · fetched ${new Date(body.fetched_at).toLocaleString()}`;
      render(body.report);
      setStatus(`Loaded ${body.row_count} rows. Saved as run ${body.run_id.slice(0, 8)}.`, 'pos', 6000);
    } finally {
      el('btnRun').disabled = false;
    }
  }

  // The point of putting this here is proximity: the entry gets written where
  // the discrepancy was noticed, and the report refreshes on top of it, so the
  // adjustment is checked against the same numbers that prompted it.
  function openComposer(prefill, adjustmentId) {
    if (!window.SiloJE) { setStatus('Journal composer failed to load.', 'neg', 8000); return; }
    if (!_co?.id) { setStatus('No active company — sign in again.', 'neg', 8000); return; }
    window.SiloJE.open({
      db: sb,
      companyId: _co.id,
      context: `qbo-reports:${el('report').value}`,
      prefill,
      adjustmentId,
      onStaged: () => setStatus('Staged. Find it in Journals to review, post or discard.', 'pos', 8000),
      onPosted: async (out) => {
        setStatus(
          `Posted journal entry ${out.doc_number || out.qbo_journal_entry_id}. Re-running the report…`,
          'pos', 10000);
        await run();
      },
    });
  }

  // The staged / posted list (and Discard / Void) lives in Books & setup →
  // Journal register, which already lists every source that posts through
  // quickbooks-post-journal. One list means one place to check the close.
  function csv() {
    if (!lastRows.length) { setStatus('Run a report first.', 'info', 3000); return; }
    const lines = lastRows.map((r) =>
      r.cells.map((c) => {
        const v = String(c?.value ?? '');
        return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
      }).join(','));
    const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `qbo-${el('report').value}-${el('from').value || 'all'}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  (async function boot() {
    const sess = await sb.auth.getSession();
    if (!sess?.data?.session) {
      window.location.href = '/pages/login.html?next='
        + encodeURIComponent(location.pathname + location.search);
      return;
    }
    const user = sess.data.session.user;

    _co = await cfg.ensureActiveCompany?.(sb) || null;

    if (window.SiloChrome) {
      window.SiloChrome.mount({
        appEl: '#silo-app',
        active: 'finance/qbo-reports',
        user: { email: user?.email || '', role: 'admin' },
        crumbs: ['Accounting', 'QuickBooks Reports'],
        supabaseClient: sb,
      });
    }

    // Default to the current year to date — the window most balance-sheet
    // questions start from.
    const now = new Date();
    el('from').value = `${now.getUTCFullYear()}-01-01`;
    el('to').value = now.toISOString().slice(0, 10);

    await loadAccounts();

    el('btnRun').addEventListener('click', run);
    el('btnCsv').addEventListener('click', csv);

    // Clicking an account row now drills into its transactions rather than
    // jumping straight to posting -- Post Adjustment moved into the
    // drill-down's own footer, seeded with the account being looked at.
    el('tbl').addEventListener('click', (e) => {
      const tr = e.target.closest('tr[data-acct]');
      if (!tr) return;
      openDrilldown(tr.dataset.acct, tr.dataset.label);
    });

    el('report').addEventListener('change', () => {
      const report = el('report').value;
      const summarizable = SUMMARY_REPORTS.includes(report);
      el('byMonth').disabled = !summarizable;
      if (!summarizable) el('byMonth').checked = false;
      // Only the transaction-level reports take an account filter; hiding it
      // elsewhere beats offering a control that is silently ignored.
      el('accountField').hidden = !ACCOUNT_FILTER_REPORTS.includes(report);
      document.querySelectorAll('#reportTiles [data-report]').forEach((t) =>
        t.setAttribute('aria-pressed', String(t.dataset.report === report)));
    });
    el('reportTiles').addEventListener('click', (e) => {
      const tile = e.target.closest('[data-report]');
      if (!tile || el('btnRun').disabled) return;
      el('report').value = tile.dataset.report;
      el('report').dispatchEvent(new Event('change'));
      run().catch((err) => setStatus(`Report failed: ${err?.message || err}`, 'neg', 12000));
    });
    el('report').dispatchEvent(new Event('change'));

    el('drillClose').addEventListener('click', () => { el('drillScrim').hidden = true; });
    el('drillScrim').addEventListener('mousedown', (e) => {
      if (e.target === el('drillScrim')) el('drillScrim').hidden = true;
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !el('drillScrim').hidden) el('drillScrim').hidden = true;
    });
    document.querySelector('.qr-drill-modal').addEventListener('click', (e) => {
      if (e.target.closest('#drillBack')) { renderDrillTransactions(drillState.payload); return; }
      const tr = e.target.closest('tr[data-je]');
      if (tr) openJeDetail(tr.dataset.je);
    });
    el('drillPostAdjustment').addEventListener('click', () => {
      if (!drillState.acctId) return;
      el('drillScrim').hidden = true;
      openComposer({
        entryDate: el('to').value || undefined,
        memo: `Adjustment — ${drillState.acctLabel || ''}`.trim(),
        lines: [{ accountId: drillState.acctId, postingType: 'Debit' }, {}],
      });
    });

  })().catch((e) => {
    console.error(e);
    setStatus(`Unexpected error: ${e?.message || e}`, 'neg');
  });
})();
</script>
</body>
</html>
