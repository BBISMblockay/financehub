<!doctype html>
<!-- beacon.css defines every --bcn-* token under :root[data-theme] only (see
     v2/customer-onboarding.html's note); a page with no data-theme is one new
     un-fallback-guarded bcn-* class away from an invisible/unstyled element. -->
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Silo — Select Company</title>
  <link rel="stylesheet" href="beacon.css" />
  <link rel="stylesheet" href="silo-brand.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../pages/config.js"></script>
  <style>
    .picker-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bcn-canvas, #f4f5f7);
    }
    .picker-card {
      width: 100%;
      max-width: 420px;
      background: var(--bcn-surface, #fff);
      border: 1px solid var(--bcn-border, #e2e5ea);
      border-radius: 14px;
      padding: 32px 28px;
      box-shadow: 0 8px 28px rgba(2,6,23,.07);
    }
    .picker-logo {
      width: 40px; height: 40px;
      background: var(--bcn-band, #0f1117);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 18px;
      margin-bottom: 20px;
    }
    .picker-title {
      font-size: 17px; font-weight: 600;
      color: var(--bcn-ink, #111827);
      margin-bottom: 4px;
    }
    .picker-sub {
      font-size: 13px;
      color: var(--bcn-ink-3, #6b7280);
      margin-bottom: 24px;
    }
    .company-list { display: flex; flex-direction: column; gap: 10px; }
    .company-btn {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px;
      border: 1.5px solid var(--bcn-border, #e2e5ea);
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
      text-align: left;
      transition: border-color .15s, background .15s;
      font-family: inherit;
      width: 100%;
    }
    .company-btn:hover {
      border-color: var(--bcn-accent, #2563eb);
      background: #eff6ff;
    }
    .company-avatar {
      width: 36px; height: 36px;
      border-radius: 8px;
      background: var(--bcn-band, #0f1117);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700;
      flex-shrink: 0;
      font-family: 'IBM Plex Mono', monospace;
    }
    .company-name {
      font-size: 14px; font-weight: 600;
      color: var(--bcn-ink, #111827);
    }
    .company-role {
      font-size: 11px;
      color: var(--bcn-ink-3, #6b7280);
      font-family: 'IBM Plex Mono', monospace;
      text-transform: uppercase;
      margin-top: 2px;
    }
    .picker-err {
      margin-top: 16px;
      padding: 10px 14px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      color: #b91c1c;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="picker-wrap">
    <div class="picker-card">
      <div class="picker-logo">S</div>
      <div class="picker-title">Choose a company</div>
      <div class="picker-sub" id="pickerSub">Choose the workspace you want to open.</div>
      <div class="company-list" id="companyList"></div>
      <div class="picker-err" id="errMsg" style="display:none"></div>
    </div>
  </div>

  <script>
    (async function () {
      const listEl = document.getElementById('companyList');
      const errEl  = document.getElementById('errMsg');

      const cfg = window.__SILO_CONFIG__ || {};
      const _sb = (cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY)
        ? window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY)
        : null;

      function showErr(msg) {
        errEl.textContent = msg;
        errEl.style.display = '';
      }

      function roleLabel(role) {
        return ({ owner_admin: 'Owner', owner: 'Owner', executive: 'Executive',
          admin: 'Admin', member: 'Member', user: 'Member', viewer: 'Viewer' })[
          String(role || '').toLowerCase()] || 'Member';
      }

      function esc(value) {
        return String(value ?? '').replace(/[&<>"']/g, (c) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
        })[c]);
      }

      // Same-origin absolute paths only; anything else falls back to Home.
      function safeNext() {
        const raw = new URLSearchParams(window.location.search).get('next') || '';
        if (!raw.startsWith('/') || raw.startsWith('//')) return null;
        // Browsers read "\" as "/" and drop tabs and newlines, so "/\evil.com"
        // and "/<tab>/evil.com" both leave the site (security audit 2026-10-08).
        if (/[\\\u0000-\u001F\u007F]/.test(raw)) return null;
        try {
          if (new URL(raw, 'https://silo.invalid').host !== 'silo.invalid') return null;
        } catch (_) { return null; }
        if (raw.startsWith('/pages/login') || raw.startsWith('/v2/company-picker')) return null;
        return raw;
      }
      const DEST = safeNext() || '/v2/finance.html';

      let companies = [];
      try {
        companies = JSON.parse(sessionStorage.getItem('__SILO_COMPANY_OPTIONS__') || '[]');
      } catch (_) {}

      if (!companies.length) {
        // No options staged by login — this is a direct visit (the sidebar's
        // company switcher). Load memberships ourselves.
        if (!_sb) { window.location.href = '/pages/login.html'; return; }
        const { data: sess } = await _sb.auth.getSession();
        if (!sess?.session?.user) { window.location.href = '/pages/login.html'; return; }
        const { data: rows, error: memErr } = await _sb
          .from('entity_memberships')
          .select('role, entity:entities!inner(id, title, entity_key, meta)')
          .eq('user_id', sess.session.user.id)
          .eq('entity.entity_type', 'company');
        if (memErr) { showErr('Could not load companies: ' + memErr.message); return; }
        companies = (rows || []).map(r => ({ ...r.entity, role: r.role }));
        if (!companies.length) { window.location.href = DEST; return; }
      }

      document.getElementById('pickerSub').textContent = companies.length > 1
        ? 'Choose the workspace you want to open.'
        : 'Open your workspace to continue.';

      companies.forEach(function (co) {
        const btn = document.createElement('button');
        btn.className = 'company-btn';

        const initials = (co.title || co.entity_key || '?').slice(0, 2).toUpperCase();
        btn.innerHTML = `
          <div class="company-avatar">${esc(initials)}</div>
          <div>
            <div class="company-name">${esc(co.title || co.entity_key)}</div>
            <div class="company-role">${esc(roleLabel(co.role))}</div>
          </div>
        `;

        btn.addEventListener('click', async function () {
          btn.disabled = true;
          try {
            // Server first, cache second. RLS enforces company scope off
            // profiles.active_company_id, not off this tab's sessionStorage --
            // writing the local label before the RPC confirms means a failed
            // or interrupted RPC leaves the sidebar naming a company the
            // server never switched to, while every RLS-scoped query keeps
            // reading whatever company was active before. Found 2026-09-30:
            // the label read "Test Company" while active_company_id() was
            // still Baseballism, making an owner_admin of both companies
            // look at Baseballism's real product pipeline under a Test
            // Company label.
            if (_sb) {
              const { error } = await _sb.rpc('set_active_company', { p_entity_id: co.id });
              if (error) { showErr('Could not activate company: ' + error.message); btn.disabled = false; return; }
            }
            if (window.__SILO_CONFIG__?.setActiveCompany) {
              window.__SILO_CONFIG__.setActiveCompany(co);
            } else {
              sessionStorage.setItem('__SILO_COMPANY__', JSON.stringify(co));
            }
            sessionStorage.removeItem('__SILO_COMPANY_OPTIONS__');
            // Wake up any OTHER already-open tab of this browser. This
            // tab's own switch just wrote its OWN sessionStorage above --
            // sessionStorage is per-tab by design, so that write is
            // invisible to a tab that was already open on a different page
            // before this switch happened, and it would otherwise keep
            // showing its (now stale) company label until it next navigates
            // (found 2026-09-30, PR #830 supplemental review). localStorage
            // IS shared and DOES fire a 'storage' event in every OTHER tab
            // of the same origin -- silo-chrome.js listens for this key and
            // re-runs ensureActiveCompany() there, which is the actual
            // source of truth; this write is only a wake-up nudge, never
            // trusted data, so a stale or tampered value here cannot mislead
            // anything -- the listener re-asks the server regardless.
            try {
              localStorage.setItem('silo:company:switched', String(Date.now()));
            } catch (_) { /* private-mode/blocked storage: the visibilitychange
              fallback in silo-chrome.js still catches this on next focus */ }
            window.location.href = DEST;
          } catch (e) {
            showErr('Could not set company: ' + e.message);
            btn.disabled = false;
          }
        });

        listEl.appendChild(btn);
      });
    })();
    </script>
</body>
</html>
